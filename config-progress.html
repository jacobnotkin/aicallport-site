<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Call Port | Configuring Your System</title>
  <meta
    name="description"
    content="AI Call Port is preparing your configured system before verification, pricing review, and activation."
  />
  <style>
    :root{
      --text-primary:#f7fbff;
      --text-secondary:#c9d7e6;
      --text-muted:#8d9db1;
      --blue:#3b82f6;
      --blue-soft:#7bd7ff;
      --orange:#f97316;
      --orange-soft:#ff9d4d;
      --border-soft:rgba(255,255,255,.06);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}

    body{
      color:var(--text-primary);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(78,165,255,0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(255,138,61,0.10), transparent 26%),
        linear-gradient(180deg, #09131f 0%, #07111a 100%);
      overflow:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.014) 1px, transparent 1px);
      background-size:42px 42px;
      mask-image:radial-gradient(circle at center, black 42%, transparent 96%);
      opacity:.08;
    }

    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .panel{
      width:min(760px, 100%);
      text-align:center;
      padding:28px;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(circle at top right, rgba(167,139,250,.10), transparent 34%),
        radial-gradient(circle at top left, rgba(103,212,255,.10), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
      box-shadow:0 24px 60px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.04);
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:30px;
      padding:0 12px;
      border-radius:999px;
      background:rgba(123,215,255,.08);
      border:1px solid rgba(123,215,255,.18);
      color:var(--blue-soft);
      font-size:10px;
      font-weight:900;
      letter-spacing:.14em;
      text-transform:uppercase;
    }

    h1{
      margin:18px 0 0;
      font-size:clamp(34px, 6vw, 66px);
      line-height:.98;
      letter-spacing:-.07em;
      color:#fff;
    }

    .copy{
      margin:16px auto 0;
      max-width:640px;
      color:var(--text-secondary);
      font-size:16px;
      line-height:1.6;
      font-weight:600;
    }

    .stage-hero{
      margin-top:28px;
      font-size:clamp(24px, 4vw, 38px);
      line-height:1.08;
      letter-spacing:-.05em;
      font-weight:900;
      color:var(--blue-soft);
      min-height:46px;
      text-shadow:0 0 18px rgba(123,215,255,.14);
    }

    .progress-shell{
      margin:22px auto 0;
      max-width:620px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.06);
      background:rgba(255,255,255,.04);
      padding:4px;
    }

    .progress-bar{
      height:12px;
      width:0%;
      border-radius:999px;
      background:linear-gradient(90deg, var(--blue), var(--blue-soft), var(--orange-soft));
      box-shadow:0 0 28px rgba(123,215,255,.26);
      transition:width .12s linear;
    }

    .status{
      margin-top:18px;
      color:var(--blue-soft);
      font-size:14px;
      line-height:1.5;
      font-weight:700;
      min-height:22px;
    }

    .company{
      margin-top:10px;
      color:var(--text-muted);
      font-size:13px;
      line-height:1.45;
      font-weight:700;
    }

    @media (max-width:760px){
      .panel{padding:12px}
      .stage-hero{font-size:30px; min-height:64px}
      .copy{font-size:15px}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="eyebrow">Configured System Prep</div>
      <h1>Preparing your configured system</h1>
      <p class="copy" id="copy">
        We’re organizing your business intake, pricing, and setup details before review and verification.
      </p>
      <div class="company" id="companyLine"></div>
      <div class="stage-hero" id="stageHero">Writing AI agent scripts</div>
      <div class="progress-shell">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="status" id="status">Stage 1 of 5</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const companyName = params.get("companyName") || "your company";
    const companyLine = document.getElementById("companyLine");
    const stageHero = document.getElementById("stageHero");
    const progressBar = document.getElementById("progressBar");
    const statusEl = document.getElementById("status");
    const copyEl = document.getElementById("copy");

    companyLine.textContent = `Preparing setup for ${companyName}`;
    copyEl.textContent = `We’re organizing ${companyName}'s business intake, pricing, and setup details before review and verification.`;

    const stages = [
      "Writing AI agent scripts",
      "Configuring inbound and outbound logic",
      "Preparing dashboard and CRM structure",
      "Applying pricing and activation rules",
      "Finalizing review and verification"
    ];

    const duration = 15000;
    const started = Date.now();

    function tick() {
      const elapsed = Date.now() - started;
      const progress = Math.min(100, (elapsed / duration) * 100);
      const stageIndex = Math.min(stages.length - 1, Math.floor(elapsed / 3000));

      progressBar.style.width = `${progress}%`;
      stageHero.textContent = stages[stageIndex];
      statusEl.textContent = `Stage ${stageIndex + 1} of ${stages.length}`;

      if (elapsed < duration) {
        requestAnimationFrame(tick);
      } else {
        progressBar.style.width = "100%";
        stageHero.textContent = stages[stages.length - 1];
        statusEl.textContent = `Stage ${stages.length} of ${stages.length}`;
        window.location.href = `step2.html?${params.toString()}`;
      }
    }

    tick();
  </script>
  <script src="ai-assistant.js"></script>
</body>
</html>
