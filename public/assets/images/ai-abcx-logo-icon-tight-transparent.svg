<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AI-ABCX Logo Icon</title>
  <desc id="desc">Three colored diamond modules around a white segmented ring with a central AI core and diagonal X channel.</desc>
  <defs>
    <style>
      .ring { fill: none; stroke: #ffffff; stroke-width: 24; stroke-linecap: butt; }
      .core { fill: #ffffff; }
      .cut { stroke: #000000; stroke-width: 22; stroke-linecap: butt; }
      .module { stroke: rgba(0,0,0,0.18); stroke-width: 2; }
    </style>
  </defs>

  <!-- Transparent background -->

  <!-- Outer segmented system ring -->
  <path class="ring" d="M 122.5 308 A 150 150 0 0 1 122.5 204" />
  <path class="ring" d="M 174.5 126.1 A 150 150 0 0 1 337.5 126.1" />
  <path class="ring" d="M 389.5 204 A 150 150 0 0 1 389.5 308" />
  <path class="ring" d="M 337.5 385.9 A 150 150 0 0 1 174.5 385.9" />

  <!-- Central AI core -->
  <circle class="core" cx="256" cy="256" r="68" />

  <!-- Diagonal X channel cut through the core -->
  <line class="cut" x1="214" y1="298" x2="298" y2="214" />
  <line class="cut" x1="214" y1="214" x2="298" y2="298" />

  <!-- Mask circle outline correction: keep X channel inside the core visually -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="#ffffff" stroke-width="0" />

  <!-- Three business modules -->
  <rect class="module" x="226" y="46" width="60" height="60" rx="14" transform="rotate(45 256 76)" fill="#ff9f1c" />
  <rect class="module" x="76" y="316" width="60" height="60" rx="14" transform="rotate(45 106 346)" fill="#38bdf8" />
  <rect class="module" x="376" y="316" width="60" height="60" rx="14" transform="rotate(45 406 346)" fill="#7ed957" />
</svg>
