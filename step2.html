<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step 2 — Live Demo</title>

<style>
:root{
  --bg:#06080f;
  --panel:rgba(12,14,21,.94);
  --border:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#94a3b8;
  --orange:#f97316;
}

body{
  margin:0;
  font-family:Inter, sans-serif;
  background:linear-gradient(180deg,#080a11,#06080f);
  color:var(--text);
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.title{
  text-align:center;
  margin-bottom:20px;
}

.title h1{
  color:var(--orange);
  font-size:48px;
  margin:0;
}

.pipeline{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.step{
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  background:rgba(255,255,255,.02);
  cursor:pointer;
  transition:.2s;
}

.step.locked{
  opacity:.4;
  cursor:not-allowed;
}

.step.active{
  border-color:var(--orange);
  animation:pulse 1.4s infinite;
}

.step.complete{
  border-color:var(--orange);
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(249,115,22,.6);}
  70%{box-shadow:0 0 0 10px rgba(249,115,22,0);}
  100%{box-shadow:0 0 0 0 rgba(249,115,22,0);}
}

.step h3{
  margin:0 0 6px;
}

.content{
  margin-top:20px;
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px;
  background:rgba(255,255,255,.02);
  text-align:center;
}

input{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.05);
  color:white;
  font-size:18px;
}

button{
  margin-top:20px;
  padding:16px 24px;
  border:none;
  border-radius:12px;
  font-weight:800;
  letter-spacing:.1em;
  cursor:pointer;
}

.primary{
  background:var(--orange);
  color:white;
}

.secondary{
  background:rgba(255,255,255,.05);
  color:white;
}

.prompt{
  margin-top:20px;
  font-size:20px;
  font-weight:700;
  border:1px solid var(--border);
  padding:16px;
  border-radius:12px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
  <h1>Live Demo</h1>
  <p>Test your AI system on a real phone call</p>
</div>

<div class="pipeline" id="pipeline"></div>

<div class="content" id="content"></div>

</div>

<script>

const steps = [
  {id:"phone", title:"2A Phone Number"},
  {id:"scenario", title:"2B Demo Type"},
  {id:"call", title:"2C Start Call"},
  {id:"prompts", title:"2D Guided Prompts"},
  {id:"complete1", title:"2E Complete"},
  {id:"second", title:"2F Second Demo"},
  {id:"finish", title:"2G Continue"}
];

let state = {
  step:0,
  phone:"",
  scenario:"",
  promptIndex:0,
  callsDone:0
};

const prompts = {
  standard:[
    "Hi, I’d like to book a service.",
    "What services do you offer?",
    "Do you have availability this week?",
    "Can you schedule me?"
  ],
  urgent:[
    "I need urgent help today.",
    "This is an emergency.",
    "Can you prioritize this?",
    "What happens next?"
  ]
};

function renderPipeline(){
  const container = document.getElementById("pipeline");
  container.innerHTML = steps.map((s,i)=>{
    let cls = "step";
    if(i < state.step) cls+=" complete";
    if(i === state.step) cls+=" active";
    if(i > state.step) cls+=" locked";

    return `<div class="${cls}"><h3>${s.title}</h3></div>`;
  }).join("");
}

function renderContent(){
  const c = document.getElementById("content");

  if(state.step===0){
    c.innerHTML = `
      <h2>Enter your business phone number</h2>
      <input id="phone" placeholder="+1 555 123 4567">
      <button class="primary" onclick="savePhone()">Save & Continue</button>
    `;
  }

  if(state.step===1){
    c.innerHTML = `
      <h2>Select demo type</h2>
      <button class="primary" onclick="selectScenario('standard')">Standard Call</button>
      <button class="secondary" onclick="selectScenario('urgent')">Urgent Call</button>
    `;
  }

  if(state.step===2){
    c.innerHTML = `
      <h2>Call your number now</h2>
      <p><strong>${state.phone}</strong></p>
      <p>Pretend you are a customer</p>
      <button class="primary" onclick="next()">I’m Calling Now</button>
    `;
  }

  if(state.step===3){
    const list = prompts[state.scenario];
    const text = list[state.promptIndex];

    c.innerHTML = `
      <h2>Say this now</h2>
      <div class="prompt">${text}</div>
      <button class="primary" onclick="nextPrompt()">Next</button>
    `;
  }

  if(state.step===4){
    c.innerHTML = `
      <h2>Demo complete</h2>
      <p>You experienced your AI handling real calls.</p>
      <button class="primary" onclick="next()">Continue</button>
    `;
  }

  if(state.step===5){
    c.innerHTML = `
      <h2>Run second demo</h2>
      <button class="primary" onclick="startSecond()">Start second test</button>
    `;
  }

  if(state.step===6){
    c.innerHTML = `
      <h2>Your AI is ready</h2>
      <button class="primary" onclick="finish()">Continue to Step 3</button>
    `;
  }
}

function savePhone(){
  const val = document.getElementById("phone").value;
  if(!val) return;
  state.phone = val;
  next();
}

function selectScenario(s){
  state.scenario = s;
  next();
}

function next(){
  state.step++;
  render();
}

function nextPrompt(){
  state.promptIndex++;
  if(state.promptIndex >= prompts[state.scenario].length){
    state.callsDone++;
    state.promptIndex = 0;
    state.step = 4;
  }
  render();
}

function startSecond(){
  state.step = 1;
  render();
}

function finish(){
  window.location.href = "/step3.html";
}

function render(){
  renderPipeline();
  renderContent();
}

render();

</script>

</body>
</html>
