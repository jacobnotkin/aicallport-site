<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | SETUP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; } 
        html, body { width: 100%; min-height: 100vh; background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; overflow-x: hidden; display: flex; flex-direction: column; }
        body { padding: 12px; }
        .bg-glow { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.15) 0%, transparent 50%); pointer-events: none; }
        .console-container { width: 100%; max-width: 1100px; background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px; position: relative; z-index: 10; margin: 40px auto; }
        .hero-title { background: linear-gradient(180deg, #FFFFFF 30%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; transition: 0.2s; color: white; font-weight: 800; }
        .orange-btn:active { transform: scale(0.98); }
        .step-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 12px; opacity: 0.3; cursor: pointer; transition: 0.3s; }
        .step-card.active { border-color: #f97316; background: rgba(249, 115, 22, 0.1); opacity: 1; }
        .next-focus { animation: border-glow 2s infinite ease-in-out; opacity: 1; }
        @keyframes border-glow { 0%, 100% { border-color: rgba(249, 115, 22, 0.3); } 50% { border-color: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.3); } }
        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: white; display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; cursor: pointer; text-transform: uppercase; font-weight: 700; }
        .modal-btn:hover { border-color: #f97316; background: rgba(255,255,255,0.07); }
        .waitlist-tag { background: #f97316; color: white; padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: 900; }
        .modal-scroll { max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .search-box { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: white; margin-bottom: 12px; outline: none; font-size: 12px; }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="console-container">
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-2">
                <span class="font-black italic text-xl uppercase text-white">AI CALL <span class="text-orange-500">PORT</span></span>
            </div>
            <div class="text-[9px] font-black text-orange-500 uppercase tracking-widest flex items-center gap-2">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div> 50 COUNTRIES SYNCED
            </div>
        </div>

        <div class="grid lg:grid-cols-5 gap-10 items-center">
            <div class="lg:col-span-3">
                <h1 class="text-4xl lg:text-6xl font-black italic uppercase leading-tight mb-4 hero-title">ZERO-HUMAN RECEPTIONIST</h1>
                <p class="text-slate-400 text-sm mb-8 font-bold uppercase tracking-wider">Setup your autonomous voice agent in minutes.</p>
                <button onclick="handleStep(1)" class="orange-btn px-10 py-5 rounded-xl text-xs uppercase italic tracking-widest">Start Setup</button>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-black/40 border border-white/10 rounded-3xl p-8 text-center backdrop-blur-md">
                    <div class="flex flex-col items-center mb-6">
                        <span class="text-slate-500 line-through text-xs font-bold mb-1">$399 REGULAR</span>
                        <div class="flex items-baseline gap-1">
                            <span id="cur-sym" class="text-5xl font-black text-white">$</span>
                            <span id="main-price" class="text-5xl font-black text-white">199</span>
                            <span class="text-orange-500 font-black ml-1">/MO</span>
                        </div>
                    </div>
                    <button onclick="handleStep(1)" class="orange-btn w-full py-4 rounded-xl text-[10px] uppercase">ACTIVATE NOW</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-6 gap-3 mt-12">
            <div id="s1" class="step-card next-focus" onclick="handleStep(1)"><p class="text-[8px] font-black text-orange-500 uppercase">01 Market</p><p id="v1" class="text-[10px] text-white/40 font-bold uppercase">Select</p></div>
            <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[8px] font-black text-orange-500 uppercase">02 Industry</p><p id="v2" class="text-[10px] text-white/40 font-bold uppercase">Choose</p></div>
            <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[8px] font-black text-orange-500 uppercase">03 Business</p><p id="v3" class="text-[10px] text-white/40 font-bold uppercase">Sync</p></div>
            <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[8px] font-black text-orange-500 uppercase">04 Role</p><p id="v4" class="text-[10px] text-white/40 font-bold uppercase">Assign</p></div>
            <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[8px] font-black text-orange-500 uppercase">05 Demo</p><p id="v5" class="text-[10px] text-white/40 font-bold uppercase">Test</p></div>
            <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[8px] font-black text-orange-500 uppercase">06 Launch</p><p id="v6" class="text-[10px] text-white/40 font-bold uppercase">Go Live</p></div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-8 rounded-3xl max-w-md w-full">
            <h2 id="mTitle" class="text-xl font-black uppercase text-white mb-6 text-center italic">Market</h2>
            <input type="text" id="mSearch" class="search-box" placeholder="SEARCH..." onkeyup="filterList(this.value)">
            <div id="mContent" class="modal-scroll"></div>
            <button onclick="closeModal()" class="w-full mt-6 text-[10px] text-slate-500 font-black uppercase">Cancel</button>
        </div>
    </div>

    <script>
        const markets = {
            "United Arab Emirates": { cur: "AED", p: "730", active: true },
            "United States": { cur: "$", p: "199", active: true },
            "Singapore": { cur: "S$", p: "270", active: true },
            "United Kingdom": { cur: "£", p: "155", active: true },
            "India": { cur: "₹", p: "16500", active: true },
            "Germany": { cur: "€", p: "185", active: true },
            "Norway": { cur: "kr", p: "2100", active: true },
            "Ireland": { cur: "€", p: "185", active: true },
            "Australia": { cur: "A$", p: "305", active: true },
            "Canada": { cur: "C$", p: "275", active: true },
            "France": { cur: "€", p: "185", active: true },
            "Spain": { cur: "€", p: "185", active: true },
            "Israel": { cur: "₪", p: "720", active: true },
            "Netherlands": { cur: "€", p: "185", active: true },
            "New Zealand": { cur: "NZ$", p: "320", active: true },
            "South Korea": { cur: "₩", p: "265k", active: true },
            "Japan": { cur: "¥", p: "30k", active: true },
            "Switzerland": { cur: "CHF", p: "175", active: true },
            "Sweden": { cur: "kr", p: "2100", active: true },
            "Denmark": { cur: "kr", p: "1380", active: true },
            "Finland": { cur: "€", p: "185", active: true },
            "Belgium": { cur: "€", p: "185", active: true },
            "Austria": { cur: "€", p: "185", active: true },
            "Portugal": { cur: "€", p: "185", active: true },
            "Italy": { cur: "€", p: "185", active: true },
            "Hong Kong": { cur: "HK$", p: "1550", active: true },
            "Poland": { cur: "zł", p: "800", active: true },
            "Luxembourg": { cur: "€", p: "185", active: true },
            "Greece": { cur: "€", p: "185", active: true },
            "Czech Republic": { cur: "Kč", p: "4500", active: true },
            "Russia": { active: false },
            "China": { active: false },
            "Indonesia": { active: false },
            "Brazil": { active: false },
            "Mexico": { active: false },
            "Malaysia": { active: false },
            "Thailand": { active: false },
            "Vietnam": { active: false },
            "Saudi Arabia": { active: false },
            "Qatar": { active: false },
            "South Africa": { active: false },
            "Turkey": { active: false },
            "Argentina": { active: false },
            "Chile": { active: false },
            "Colombia": { active: false },
            "Philippines": { active: false },
            "Hungary": { active: false },
            "Romania": { active: false },
            "Slovakia": { active: false },
            "Estonia": { active: false }
        };

        let currentStep = 0;

        function handleStep(s) {
            if (s === 1 || currentStep >= s - 1) {
                openModal(s);
            }
        }

        function openModal(step) {
            const m = document.getElementById('setupModal');
            const content = document.getElementById('mContent');
            const title = document.getElementById('mTitle');
            content.innerHTML = "";
            m.style.display = 'flex';

            if (step === 1) {
                title.innerText = "MARKET";
                Object.keys(markets).sort().forEach(name => {
                    const btn = document.createElement('button');
                    btn.className = "modal-btn";
                    btn.setAttribute('data-name', name);
                    if (markets[name].active) {
                        btn.onclick = () => {
                            document.getElementById('cur-sym').innerText = markets[name].cur;
                            document.getElementById('main-price').innerText = markets[name].p;
                            finishStep(1, name);
                        };
                        btn.innerHTML = `<span>${name}</span> <div class="w-1 h-1 rounded-full bg-green-500"></div>`;
                    } else {
                        btn.innerHTML = `<span>${name}</span> <span class="waitlist-tag">WAITLIST</span>`;
                        btn.onclick = () => alert("Added to Waitlist!");
                    }
                    content.appendChild(btn);
                });
            } else if (step === 2) {
                title.innerText = "INDUSTRY";
                ["Accounting", "HVAC", "Legal", "Medical", "Real Estate"].forEach(ind => {
                    const btn = document.createElement('button');
                    btn.className = "modal-btn";
                    btn.innerText = ind;
                    btn.onclick = () => finishStep(2, ind);
                    content.appendChild(btn);
                });
            }
            // Add more steps as needed following this pattern
        }

        function finishStep(s, val) {
            currentStep = s;
            document.getElementById(`v${s}`).innerText = val;
            document.getElementById(`s${s}`).classList.add('active');
            document.getElementById(`s${s}`).classList.remove('next-focus');
            if(s < 6) document.getElementById(`s${s+1}`).classList.add('next-focus');
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#f97316', '#ffffff'] });
            closeModal();
        }

        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        function updateParallax(e) { document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%'); document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%'); }
        function filterList(q) { document.querySelectorAll('.modal-btn').forEach(b => b.style.display = b.getAttribute('data-name').toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none'); }
    </script>
</body>
</html>
