<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | BETA Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; margin: 0; overflow-x: hidden; scroll-behavior: smooth;
        }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        .console-container {
            width: 95%; max-width: 1100px; margin: 20px auto; background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; 
            padding: 25px; position: relative; z-index: 10;
        }

        /* Restored Terminal - Moved to Top for Mobile Accessibility */
        .system-log {
            width: 95%; max-width: 400px; margin: 10px auto; height: 80px;
            background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 10px; font-family: monospace; font-size: 9px;
            color: #94a3b8; overflow: hidden;
        }

        .log-line { border-left: 2px solid #f97316; padding-left: 8px; margin-bottom: 2px; animation: fadeIn 0.3s; }

        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); transition: 0.2s; cursor: pointer; border: none; font-weight: 800; }
        .orange-btn:active { transform: scale(0.95); }

        .step-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px; border-radius: 16px; transition: 0.4s; opacity: 0.3;
        }
        .step-card.unlocked { opacity: 1; border-color: rgba(255, 255, 255, 0.15); }
        .step-card.active { border-color: #f97316 !important; background: rgba(249, 115, 22, 0.1) !important; }

        .ticker-bar {
            width: 100%; height: 35px; background: rgba(6, 8, 15, 0.9);
            border-top: 1px solid rgba(249, 115, 22, 0.2);
            display: flex; align-items: center; overflow: hidden;
        }
        .ticker-content { display: flex; white-space: nowrap; animation: marquee 60s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* THE FIX: Control Basement */
        /* This forces the page to be longer so the Vapi button sits below all UI */
        .control-basement {
            height: 200px; /* Large space for the Vapi button */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Force Vapi button to stay within the basement area on mobile */
        #vapi-support-btn {
            bottom: 60px !important;
            right: 50% !important;
            transform: translateX(50%) !important;
        }

        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="system-log" id="logBox">
        <div class="flex justify-between text-[8px] text-orange-500 font-black uppercase mb-1">
            <span>Neural Terminal</span>
            <span class="animate-pulse">● Active</span>
        </div>
        <div id="logContent">
            <div class="log-line">SYSTEM REBOOT COMPLETE...</div>
            <div class="log-line">MOBILE LAYOUT OPTIMIZED...</div>
        </div>
    </div>

    <div class="console-container">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <div class="bg-orange-500 px-1 text-[10px] font-black text-black italic">BETA</div>
                    <span class="font-black italic text-xl uppercase">AI CALL <span class="text-orange-500">PORT</span></span>
                </div>
                <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest italic">100% Automated System</div>
            </div>
        </div>

        <div class="grid lg:grid-cols-5 gap-8 items-center">
            <div class="lg:col-span-3 text-center lg:text-left">
                <h1 class="text-4xl md:text-6xl font-black italic uppercase leading-none mb-4">
                    <span class="text-white block">NEURAL</span>
                    <span class="text-orange-500 block">RECEPTIONIST</span>
                </h1>
                <button id="mainActionBtn" onclick="handleStep(1)" class="orange-btn px-8 py-4 rounded-2xl text-[10px] uppercase tracking-widest italic shadow-xl mb-6">Begin 6-Step Activation</button>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-black/50 border-2 border-orange-500/50 rounded-[30px] p-8 text-center">
                    <div class="flex flex-col items-center mb-4">
                        <span class="text-slate-600 line-through text-xs font-bold">$399 Regular</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-5xl font-black text-white">$199</span>
                            <span class="text-orange-500 font-bold text-sm">/mo</span>
                        </div>
                    </div>
                    <div id="timer" class="text-lg font-mono font-black text-white/40 mb-4">00:00:00</div>
                    <button onclick="handleStep(6)" class="orange-btn w-full py-3 rounded-xl text-[10px] uppercase">Instant Activation</button>
                </div>
            </div>
        </div>

        <div id="stepsSection" class="mt-12">
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
                <div id="s1" class="step-card unlocked" onclick="handleStep(1)"><p class="text-[7px] font-black text-orange-500">01 MARKET</p><p id="v1" class="text-[9px] font-bold uppercase mt-1">Select</p></div>
                <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[7px] font-black text-orange-500">02 INDUSTRY</p><p id="v2" class="text-[9px] font-bold uppercase mt-1">Select</p></div>
                <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[7px] font-black text-orange-500">03 NAME</p><p id="v3" class="text-[9px] font-bold uppercase mt-1">Sync</p></div>
                <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[7px] font-black text-orange-500">04 ROLE</p><p id="v4" class="text-[9px] font-bold uppercase mt-1">Choose</p></div>
                <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[7px] font-black text-orange-500">05 DEMO</p><p id="v5" class="text-[9px] font-bold uppercase mt-1">Sandbox</p></div>
                <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[7px] font-black text-orange-500">06 PIPELINE</p><p id="v6" class="text-[9px] font-bold uppercase mt-1">Activate</p></div>
            </div>
        </div>
    </div>

    <div class="control-basement">
        <div class="ticker-bar">
            <div class="ticker-content" id="ticker"></div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-10 rounded-[40px] max-w-sm w-full text-center">
            <h2 id="mTitle" class="text-xl font-black uppercase text-white mb-6">Setup</h2>
            <div id="mContent" class="grid gap-3"></div>
            <button onclick="closeModal()" class="mt-6 text-[10px] text-slate-500 uppercase font-black">Back</button>
        </div>
    </div>

    <script>
        const stripeLink = "https://buy.stripe.com/8x24gA9TB9Vab160h43ks01";
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let completedSteps = 0; let currentIndustry = "";

        function addLog(msg) {
            const content = document.getElementById('logContent');
            const div = document.createElement('div');
            div.className = "log-line";
            div.innerText = `> ${msg.toUpperCase()}`;
            content.prepend(div);
            if(content.children.length > 3) content.lastChild.remove();
        }

        function handleStep(s) { if(s === 1 || completedSteps >= s-1) triggerModal(s); }

        function triggerModal(step) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";

            if(step === 1) {
                t.innerText = "Market Selection";
                ["USA", "UK", "Canada"].forEach(l => createBtn(l, () => { addLog(`Market: ${l}`); finish(1, l); }, c));
            } else if(step === 2) {
                t.innerText = "Industry Selection";
                Object.keys(assistants).forEach(i => createBtn(i, () => { currentIndustry = i; addLog(`Industry: ${i}`); finish(2, i); }, c));
            } else if(step === 3) {
                t.innerText = "Business Name";
                c.innerHTML = `<input id="bn" placeholder="NAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white mb-4 text-center font-black uppercase text-xs"><button onclick="saveB()" class="orange-btn w-full py-4 rounded-xl font-black text-[10px]">Verify</button>`;
            } else if(step === 4) {
                t.innerText = "Role Select";
                ["Receptionist", "Sales"].forEach(r => createBtn(r, () => { addLog(`Role: ${r}`); finish(4, r); }, c));
            } else if(step === 5) {
                t.innerText = "Test Demo";
                createBtn("Start Sandbox", runVoice, c);
            } else if(step === 6) {
                t.innerText = "Final Activation";
                createBtn("Activate Now", () => { window.open(stripeLink, '_blank'); }, c);
            }
        }

        function createBtn(txt, fn, cont) {
            const b = document.createElement('button');
            b.className = "w-full py-4 bg-white/5 border border-white/10 rounded-xl text-white font-black text-[10px] uppercase";
            b.innerText = txt; b.onclick = fn; cont.appendChild(b);
        }

        function finish(s, v) {
            completedSteps = s;
            document.getElementById(`v${s}`).innerText = v;
            document.getElementById(`s${s}`).classList.add('active');
            closeModal();
            if(s < 6) document.getElementById(`s${s+1}`).classList.add('unlocked');
        }

        function saveB() { const v = document.getElementById('bn').value; if(v) { addLog(`Saved: ${v}`); finish(3, v); } }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        
        async function runVoice() { 
            const id = assistants[currentIndustry] || assistants["Electrical"];
            addLog("VOICE LINK OPEN");
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) {
                    window.vapiSDK.run({ apiKey: vapiApiKey, assistant: id });
                    closeModal(); finish(5, "TESTING");
                    // Scroll to bottom so they see the button in the basement
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }
            } catch(e) { alert("Mic required"); }
        }

        function updateParallax(e) {
            document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%');
            document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%');
        }

        let tickerHtml = "";
        for(let i=0; i<15; i++) tickerHtml += `<span class="px-10 text-[9px] font-black text-orange-500 uppercase italic"> ⚡ SYSTEM ONLINE ⚡ DEPLOYMENT READY </span>`;
        document.getElementById('ticker').innerHTML = tickerHtml + tickerHtml;

        setInterval(() => {
            const now = new Date();
            document.getElementById('timer').textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
