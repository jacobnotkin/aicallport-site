<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>ACTIVATION SUCCESS | AI CALL PORT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; } 
        html, body { width: 100%; min-height: 100vh; position: relative; background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; overflow-x: hidden; display: flex; flex-direction: column; }
        body { padding: 24px; display: flex; align-items: center; justify-content: center; }
        
        .success-card { width: 100%; max-width: 500px; background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(34, 197, 94, 0.2); border-radius: 24px; padding: 40px; text-align: center; box-shadow: 0 0 30px rgba(34, 197, 94, 0.1); }
        
        .success-icon { width: 80px; height: 80px; background: rgba(34, 197, 94, 0.1); border: 2px solid rgba(34, 197, 94, 0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto; color: #22c55e; }
        
        .dashboard-btn { background: linear-gradient(90deg, #f97316, #ea580c); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; transition: 0.2s; color: white; display: inline-block; padding: 12px 24px; border-radius: 12px; font-weight: 800; text-transform: uppercase; font-size: 11px; tracking: wider; text-decoration: none; }
        .dashboard-btn:hover { box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        
        <h1 class="text-3xl font-black uppercase tracking-tight text-white mb-2">ACTIVATION <span class="text-green-500">COMPLETE</span></h1>
        
        <p class="text-slate-400 text-sm mb-8 font-bold">
            Your global AI Receptionist is now live. An email with your dedicated number and dashboard access has been sent to your registered address.
        </p>

        <div class="bg-black/40 border border-white/5 rounded-2xl p-4 mb-8 text-left">
            <p class="text-[9px] font-black uppercase text-orange-500 mb-1 tracking-widest">ORDER SUMMARY</p>
            <p class="text-xs font-bold text-white mb-2">Protocol: <span id="summary-protocol" class="text-slate-300">#AC-9002</span></p>
            <p class="text-xs font-bold text-white">Status: <span class="text-green-500 font-black">ACTIVE</span></p>
        </div>

        <a href="/dashboard" class="dashboard-btn">ACCESS YOUR DASHBOARD</a>
    </div>

</body>
</html>
