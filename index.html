<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CALL PORT</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
background:#06080f;
color:white;
font-family:'Plus Jakarta Sans',sans-serif;
padding:20px;
}
.orange-btn{
background:linear-gradient(90deg,#f97316,#ea580c);
padding:12px 20px;
border-radius:12px;
font-weight:800;
cursor:pointer;
}
.modal-btn{
width:100%;
padding:12px;
border-radius:10px;
background:rgba(255,255,255,0.05);
margin-bottom:8px;
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<h1 class="text-3xl font-black mb-6">AI CALL PORT</h1>

<button class="orange-btn" onclick="handleStep(5)">START DEMO</button>

<div id="setupModal" style="display:none;margin-top:20px;">
<h2 class="font-black mb-4">DEMO</h2>
<div id="mContent"></div>
<button onclick="closeModal()" class="mt-4 text-sm text-gray-400">Close</button>
</div>

<script>
/* =========================
   LOAD PUBLIC KEY SECURELY
========================= */
let vapiApiKey = null;

async function loadKey(){
  if(vapiApiKey) return vapiApiKey;
  const res = await fetch("/api/config");
  if(!res.ok){
    alert("Vapi config failed. Check /api/config and deployment.");
    throw new Error("config fail");
  }
  const data = await res.json();
  vapiApiKey = data.vapiPublicKey;
  return vapiApiKey;
}

/* =========================
   ASSISTANTS
========================= */
const assistants = {
  Electrical: "7a2fbe45-b54b-4375-aa1f-111be3f1501a",
  Plumbing: "e6dec738-840f-4932-85b4-421b2a7bdb0c",
  Legal: "e4ef966a-b6de-4e4f-b586-3dda4480fd0f"
};

let currentAssistant = "Electrical";

/* =========================
   STEPS
========================= */
function handleStep(s){
  if(s===5){
    triggerDemo();
  }
}

/* =========================
   MODAL
========================= */
function triggerDemo(){
  const m = document.getElementById("setupModal");
  const c = document.getElementById("mContent");
  m.style.display="block";
  c.innerHTML="";
  c.appendChild(createBtn("Start Demo Call", runVoice));
}

function closeModal(){
  document.getElementById("setupModal").style.display="none";
}

function createBtn(t,fn){
  const b=document.createElement("button");
  b.className="modal-btn";
  b.innerText=t;
  b.onclick=fn;
  return b;
}

/* =========================
   VOICE
========================= */
async function runVoice(){
  try{
    const key = await loadKey();
    const id = assistants[currentAssistant];

    if(window.vapiSDK){
      window.vapiSDK.run({
        apiKey:key,
        assistant:id
      });
      closeModal();
    } else {
      alert("Voice SDK still loading...");
    }

  }catch(e){
    console.error(e);
  }
}

/* =========================
   LOAD VAPI SDK
========================= */
(function(d,t){
 var g=d.createElement(t),
     s=d.getElementsByTagName(t)[0];
 g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
 g.defer=true;
 g.async=true;
 s.parentNode.insertBefore(g,s);
})(document,"script");
</script>

</body>
</html>
