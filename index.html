<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Call Port — Step 1 System Configuration</title>
<style>
:root {
--bg: #050404;
--bg-2: #0a0807;
--console: #0f0d0b;
--console-2: #14110f;
--panel: #12100e;
--panel-2: #161311;
--line: rgba(255,255,255,0.08);
--line-strong: rgba(255,255,255,0.12);
--text: #f5f2ed;
--muted: rgba(245,242,237,0.70);
--muted-2: rgba(245,242,237,0.42);
--orange: #ff7a1a;
--orange-2: #ff8c3a;
--orange-soft: rgba(255,122,26,0.10);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
margin: 0;
font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
color: var(--text);
background:
radial-gradient(circle at 18% 14%, rgba(255,122,26,0.05), transparent 22%),
radial-gradient(circle at 82% 22%, rgba(255,180,120,0.04), transparent 18%),
linear-gradient(180deg, #080706 0%, var(--bg-2) 48%, var(--bg) 100%);
overflow-x: hidden;
}

.bg-grid,
.bg-stars {
position: fixed;
inset: 0;
pointer-events: none;
}

.bg-grid {
background:
linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
background-size: 42px 42px;
mask-image: radial-gradient(circle at center, black 45%, transparent 96%);
opacity: .35;
}

.bg-stars span {
position: absolute;
width: 2px;
height: 2px;
border-radius: 999px;
background: rgba(255,255,255,.15);
box-shadow: 0 0 6px rgba(255,255,255,.08);
animation: twinkle 4s ease-in-out infinite;
}

.page-shell {
min-height: 100vh;
padding: 34px 24px;
}

.console {
position: relative;
max-width: 1180px;
margin: 0 auto;
padding: 26px 28px 30px;
background: linear-gradient(180deg, var(--console-2) 0%, var(--console) 100%);
border: 1px solid rgba(255,255,255,0.12);
border-radius: 30px;
box-shadow:
0 40px 120px rgba(0,0,0,0.58),
inset 0 1px 0 rgba(255,255,255,0.04);
overflow: hidden;
}

.console::before {
content: "";
position: absolute;
inset: 0;
pointer-events: none;
background:
radial-gradient(
320px circle at var(--mx, 50%) var(--my, 50%),
rgba(255,140,58,0.11),
rgba(255,122,26,0.05) 20%,
transparent 58%
);
}

.console::after {
content: "";
position: absolute;
inset: 0;
pointer-events: none;
border-radius: 30px;
box-shadow: inset 0 0 70px rgba(255,122,26,0.03);
}

.console-inner {
position: relative;
z-index: 1;
}

.console-header {
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
margin-bottom: 18px;
}

.brand-row {
display: flex;
align-items: center;
gap: 12px;
}

.brand-mark {
width: 24px;
height: 24px;
border-radius: 8px;
background: var(--orange);
box-shadow: 0 6px 16px rgba(255,122,26,0.14);
}

.brand-text {
font-size: 15px;
font-weight: 800;
letter-spacing: -.03em;
}

.console-meta {
display: flex;
align-items: center;
gap: 12px;
}

.page-title {
font-size: 12px;
letter-spacing: .12em;
text-transform: uppercase;
color: rgba(245,242,237,0.50);
font-weight: 700;
}

.progress-wrap {
display: flex;
align-items: center;
gap: 12px;
}

.progress-text {
font-size: 12px;
color: rgba(245,242,237,0.64);
white-space: nowrap;
}

.progress-bar {
position: relative;
width: 140px;
height: 8px;
border-radius: 999px;
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.04);
overflow: hidden;
}

.progress-fill {
position: absolute;
inset: 0 auto 0 0;
width: 33.33%;
background: var(--orange);
border-radius: inherit;
box-shadow: 0 0 10px rgba(255,122,26,0.12);
}

.main-grid {
display: grid;
grid-template-columns: minmax(0, 1fr) 360px;
gap: 28px;
align-items: start;
}

.left-side {
min-width: 0;
}

.hero {
padding: 20px 6px 22px;
}

.kicker {
display: inline-flex;
align-items: center;
justify-content: center;
min-height: 30px;
padding: 0 12px;
border-radius: 999px;
border: 1px solid rgba(255,122,26,0.22);
background: rgba(255,122,26,0.05);
color: rgba(255,213,186,0.86);
font-size: 11px;
letter-spacing: .12em;
text-transform: uppercase;
font-weight: 700;
margin-bottom: 16px;
}

.hero h1 {
margin: 0;
font-size: clamp(42px, 5vw, 68px);
line-height: .95;
letter-spacing: -.07em;
font-weight: 800;
text-shadow: 0 0 16px rgba(255,255,255,0.05);
}

.hero p {
margin: 14px 0 0;
max-width: 620px;
color: var(--muted);
font-size: 18px;
line-height: 1.6;
}

.protocol-head {
display: grid;
grid-template-columns: 1fr auto;
gap: 18px;
align-items: end;
margin: 6px 0 18px;
padding: 0 2px;
}

.protocol-title {
font-size: 13px;
letter-spacing: .14em;
text-transform: uppercase;
color: var(--orange);
font-weight: 800;
}

.protocol-sub {
margin-top: 6px;
color: rgba(245,242,237,0.56);
font-size: 12px;
letter-spacing: .10em;
text-transform: uppercase;
font-weight: 700;
}

.steps-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 16px;
}

.step-card {
min-height: 126px;
border-radius: 22px;
border: 1px solid var(--line);
background: var(--panel);
padding: 18px 18px 16px;
position: relative;
overflow: hidden;
cursor: not-allowed;
opacity: .24;
pointer-events: none;
transition: transform .18s ease, opacity .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
}

.step-card.enabled {
opacity: 1;
pointer-events: auto;
}

.step-card.completed {
opacity: .84;
}

.step-card.completed.current-completed {
border-color: rgba(255,140,58,0.72);
background: linear-gradient(180deg, rgba(255,122,26,0.08), #14110f);
box-shadow: 0 0 0 1px rgba(255,122,26,0.10), 0 0 12px rgba(255,122,26,0.08);
}

.step-card.active {
border-color: rgba(255,140,58,0.72);
background: linear-gradient(180deg, rgba(255,122,26,0.08), #14110f);
box-shadow:
0 0 0 1px rgba(255,122,26,0.10),
0 0 12px rgba(255,122,26,0.08);
animation: activeBorderPulse 1.8s ease-in-out infinite;
}

.step-card:hover.enabled {
transform: translateY(-1px);
background: var(--panel-2);
border-color: rgba(255,255,255,0.14);
}

.step-card.active:hover,
.step-card.completed.current-completed:hover {
border-color: rgba(255,166,94,0.88);
}

.step-card::after {
content: "";
position: absolute;
inset: auto auto -34px -34px;
width: 100px;
height: 100px;
border-radius: 999px;
background: radial-gradient(circle, rgba(255,122,26,0.06), transparent 68%);
opacity: 0;
transition: opacity .18s ease;
}

.step-card.active::after,
.step-card.completed.current-completed::after { opacity: 1; }

.step-top {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
}

.step-label {
color: var(--orange);
font-size: 12px;
letter-spacing: .12em;
text-transform: uppercase;
font-weight: 800;
}

.step-indicator {
width: 10px;
height: 10px;
border-radius: 999px;
background: transparent;
}

.step-card.active .step-indicator,
.step-card.completed.current-completed .step-indicator {
background: var(--orange);
box-shadow: 0 0 12px rgba(255,122,26,0.34);
animation: pulse 1.8s ease-in-out infinite;
}

.step-card h3 {
margin: 18px 0 8px;
font-size: 28px;
line-height: 1.02;
letter-spacing: -.05em;
font-weight: 800;
}

.step-meta {
display: flex;
align-items: flex-end;
justify-content: space-between;
gap: 14px;
margin-top: 20px;
}

.step-action {
font-size: 14px;
color: rgba(245,242,237,0.32);
font-weight: 700;
letter-spacing: -.01em;
}

.step-card.active .step-action,
.step-card.completed.current-completed .step-action {
color: rgba(255,232,217,0.92);
}

.step-card.completed .step-action {
color: rgba(245,242,237,0.80);
}

.step-value {
font-size: 13px;
color: rgba(245,242,237,0.76);
font-weight: 700;
text-align: right;
}

.step-card:not(.completed) .step-value {
color: rgba(245,242,237,0.26);
}

.cta-wrap {
padding-top: 22px;
}

.cta-button {
width: 100%;
height: 68px;
border: 1px solid rgba(255,122,26,0.60);
border-radius: 22px;
background: var(--orange);
color: white;
font-size: 18px;
font-weight: 800;
letter-spacing: .02em;
text-transform: uppercase;
cursor: pointer;
transition: transform .18s ease, background .18s ease, opacity .18s ease;
}

.cta-button:hover:not(:disabled) {
transform: translateY(-1px);
background: var(--orange-2);
}

.cta-button:disabled {
opacity: .34;
cursor: not-allowed;
}

.right-side {
min-width: 0;
}

.summary-panel {
border-radius: 24px;
border: 1px solid rgba(255,255,255,0.10);
background: var(--panel);
padding: 18px;
box-shadow: 0 18px 46px rgba(0,0,0,0.28);
}

.summary-title {
font-size: 12px;
letter-spacing: .12em;
text-transform: uppercase;
color: rgba(255,213,186,0.72);
font-weight: 800;
margin-bottom: 12px;
}

.summary-block {
border: 1px solid rgba(255,255,255,0.08);
background: rgba(255,255,255,0.02);
border-radius: 18px;
padding: 14px;
margin-bottom: 10px;
}

.summary-block strong {
display: block;
font-size: 14px;
font-weight: 800;
margin-bottom: 4px;
}

.summary-block span {
display: block;
color: rgba(245,242,237,0.62);
font-size: 12px;
line-height: 1.5;
}

.summary-rows {
border: 1px solid rgba(255,255,255,0.08);
background: rgba(255,255,255,0.018);
border-radius: 18px;
padding: 10px 14px;
}

.summary-row {
display: flex;
justify-content: space-between;
gap: 12px;
padding: 10px 0;
border-bottom: 1px solid rgba(255,255,255,0.05);
font-size: 12px;
color: rgba(245,242,237,0.58);
position: relative;
}

.summary-row:last-child { border-bottom: 0; }
.summary-row b { color: rgba(245,242,237,0.92); font-weight: 700; }
.summary-row.active-summary { color: rgba(255,213,186,0.86); }
.summary-row.active-summary b { color: #fff1e7; }
.summary-row.active-summary span {
display: flex;
align-items: center;
}
.summary-row.active-summary::before {
content: "";
width: 8px;
height: 8px;
border-radius: 999px;
background: var(--orange);
box-shadow: 0 0 10px rgba(255,122,26,0.28);
display: inline-block;
margin-right: 10px;
flex: 0 0 auto;
}

.overlay {
position: fixed;
inset: 0;
display: none;
align-items: center;
justify-content: center;
z-index: 50;
padding: 24px;
background: rgba(3,2,2,0.76);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
}

.overlay.show { display: flex; }

.modal {
width: min(760px, 100%);
max-height: min(84vh, 860px);
overflow: hidden;
border-radius: 28px;
border: 1px solid rgba(255,255,255,0.10);
background: #100e0c;
box-shadow: 0 38px 90px rgba(0,0,0,0.60);
animation: modalIn .24s cubic-bezier(.22,.8,.24,1);
display: flex;
flex-direction: column;
}

.modal-head {
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
padding: 20px 22px 16px;
border-bottom: 1px solid rgba(255,255,255,0.07);
}

.modal-head-left small {
display: block;
color: rgba(255,213,186,0.72);
font-size: 12px;
letter-spacing: .10em;
text-transform: uppercase;
font-weight: 800;
margin-bottom: 8px;
}

.modal-head-left h2 {
margin: 0;
font-size: 28px;
line-height: 1.04;
letter-spacing: -.05em;
font-weight: 800;
}

.modal-head-left p {
margin: 10px 0 0;
color: rgba(245,242,237,0.66);
font-size: 15px;
line-height: 1.55;
}

.modal-progress {
font-size: 13px;
color: rgba(245,242,237,0.56);
font-weight: 700;
}

.modal-body {
padding: 20px 22px;
overflow: auto;
display: grid;
gap: 14px;
}

.search,
.text-input {
width: 100%;
height: 56px;
border-radius: 16px;
border: 1px solid rgba(255,255,255,0.08);
background: #151311;
color: white;
padding: 0 16px;
font-size: 15px;
outline: none;
transition: border-color .18s ease, box-shadow .18s ease;
}

.search:focus,
.text-input:focus {
border-color: rgba(255,140,58,0.52);
box-shadow: 0 0 0 3px rgba(255,122,26,0.06);
}

.search::placeholder,
.text-input::placeholder {
color: rgba(245,242,237,0.34);
}

.option-grid {
display: grid;
grid-template-columns: repeat(2, minmax(0, 1fr));
gap: 12px;
}

.option-card,
.search-option {
border: 1px solid rgba(255,255,255,0.08);
background: #151311;
cursor: pointer;
transition: transform .16s ease, border-color .16s ease, background .16s ease;
}

.option-card {
border-radius: 16px;
padding: 14px;
}

.search-option {
display: grid;
grid-template-columns: minmax(0, 1fr) auto;
gap: 12px;
align-items: center;
border-radius: 14px;
padding: 13px 14px;
}

.option-card:hover,
.search-option:hover {
transform: translateY(-1px);
border-color: rgba(255,255,255,0.14);
}

.option-card.selected,
.search-option.selected {
border-color: rgba(255,140,58,0.54);
background: rgba(255,122,26,0.08);
}

.option-card strong,
.search-option strong {
display: block;
font-size: 15px;
font-weight: 800;
letter-spacing: -.02em;
}

.option-card span,
.search-option span {
display: block;
margin-top: 4px;
color: rgba(245,242,237,0.54);
font-size: 13px;
line-height: 1.4;
}

.search-list {
display: grid;
gap: 16px;
max-height: 420px;
overflow: auto;
padding-right: 4px;
}

.group-title {
font-size: 12px;
letter-spacing: .14em;
text-transform: uppercase;
color: rgba(245,242,237,0.42);
font-weight: 800;
margin-bottom: 10px;
}

.badge {
min-height: 28px;
padding: 0 10px;
border-radius: 999px;
display: inline-flex;
align-items: center;
font-size: 12px;
font-weight: 800;
border: 1px solid rgba(255,255,255,0.06);
white-space: nowrap;
}

.badge.active { background: rgba(34,197,94,0.12); color: #d8ffe4; border-color: rgba(34,197,94,0.16); }
.badge.soon { background: rgba(255,122,26,0.10); color: #ffd2ae; border-color: rgba(255,122,26,0.16); }
.badge.projected { background: rgba(255,255,255,0.04); color: rgba(245,242,237,0.72); border-color: rgba(255,255,255,0.08); }

.modal-foot {
display: flex;
align-items: center;
justify-content: space-between;
gap: 12px;
padding: 16px 22px 20px;
border-top: 1px solid rgba(255,255,255,0.07);
}

.modal-btn {
min-width: 120px;
height: 46px;
border-radius: 15px;
font-size: 15px;
font-weight: 800;
border: 1px solid rgba(255,255,255,0.08);
cursor: pointer;
transition: transform .16s ease, opacity .16s ease, background .16s ease;
}

.modal-btn:hover:not(:disabled) { transform: translateY(-1px); }

.btn-ghost {
background: rgba(255,255,255,0.03);
color: rgba(245,242,237,0.90);
}

.btn-primary {
border: 1px solid rgba(255,122,26,0.56);
background: var(--orange);
color: white;
}

.btn-primary:hover:not(:disabled) { background: var(--orange-2); }
.modal-btn:disabled { opacity: .4; cursor: not-allowed; }

@keyframes twinkle {
0%, 100% { opacity: .16; transform: scale(1); }
50% { opacity: .42; transform: scale(1.3); }
}
@keyframes pulse {
0%, 100% { transform: scale(1); opacity: .84; }
50% { transform: scale(1.24); opacity: 1; }
}
@keyframes modalIn {
from { opacity: 0; transform: translateY(10px) scale(.99); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes activeBorderPulse {
0%, 100% {
border-color: rgba(255,140,58,0.62);
box-shadow: 0 0 0 1px rgba(255,122,26,0.10), 0 0 10px rgba(255,122,26,0.06);
}
50% {
border-color: rgba(255,166,94,0.88);
box-shadow: 0 0 0 1px rgba(255,140,58,0.14), 0 0 14px rgba(255,140,58,0.08);
}
}

@media (max-width: 980px) {
.main-grid {
grid-template-columns: 1fr;
}
}

@media (max-width: 760px) {
.page-shell { padding: 18px 14px; }
.console { padding: 18px; border-radius: 24px; }
.console-header { flex-direction: column; align-items: flex-start; }
.main-grid { gap: 20px; }
.hero h1 { font-size: clamp(34px, 10vw, 52px); }
.hero p { font-size: 16px; }
.steps-grid,
.option-grid { grid-template-columns: 1fr; }
.progress-wrap { width: 100%; justify-content
