<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | BETA Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; 
            padding: 15px; margin: 0; overflow-x: hidden;
        }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .console-container {
            width: 100%; max-width: 1100px; background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; 
            padding: 24px; position: relative; z-index: 10; margin-top: 20px;
        }

        /* HIDE TERMINAL ON MOBILE TO PREVENT OVERLAP */
        .system-log { display: none; }
        @media (min-width: 1024px) {
            .system-log {
                display: block; position: fixed; bottom: 80px; right: 30px; 
                width: 300px; height: 140px; background: rgba(15, 23, 42, 0.6);
                border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
                padding: 15px; font-family: monospace; font-size: 10px; z-index: 40;
            }
        }

        /* VAPI BUTTON MOBILE OVERRIDE */
        /* This forces the button to the center-bottom, above the browser bars */
        #vapi-support-btn, .vapi-btn {
            bottom: 100px !important; 
            right: auto !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 9999 !important;
        }

        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); font-weight: 800; cursor: pointer; }
        .step-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px; border-radius: 16px; opacity: 0.4; transition: 0.3s;
        }
        .step-card.unlocked { opacity: 1; border-color: rgba(249, 115, 22, 0.3); }
        .step-card.active { border-color: #f97316; background: rgba(249, 115, 22, 0.1); }

        .ticker-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 40px;
            background: #06080f; border-top: 1px solid rgba(249, 115, 22, 0.2);
            display: flex; align-items: center; z-index: 100; overflow: hidden;
        }
        .ticker-content { display: flex; white-space: nowrap; animation: marquee 60s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* SAFETY ZONE: This prevents content from being hidden by the Vapi button */
        .mobile-footer-spacer { height: 180px; width: 100%; }

        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="system-log">
        <div class="text-orange-500 font-bold mb-2 uppercase tracking-tighter">System Terminal</div>
        <div id="logContent" class="text-slate-400">Initializing...</div>
    </div>

    <div class="console-container">
        <div class="text-center mb-8">
            <div class="text-orange-500 font-black italic text-sm tracking-widest mb-1">AI CALL PORT</div>
            <div class="text-[10px] text-slate-500 font-bold uppercase">Mobile Console V1.0</div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-4xl font-black italic uppercase leading-none text-white mb-2">Neural <span class="text-orange-500">Voice</span></h1>
            <p class="text-slate-400 text-xs">Automated voice agents for your industry.</p>
        </div>

        <button id="mainActionBtn" onclick="handleStep(1)" class="orange-btn w-full py-5 rounded-2xl text-xs uppercase tracking-widest mb-8 shadow-lg shadow-orange-900/20">Start Setup</button>

        <div class="grid grid-cols-2 gap-3 mb-8">
            <div id="s1" class="step-card unlocked" onclick="handleStep(1)">
                <p class="text-[8px] font-black text-orange-500 uppercase">Step 1</p>
                <p id="v1" class="text-[10px] font-bold text-white uppercase">Market</p>
            </div>
            <div id="s2" class="step-card" onclick="handleStep(2)">
                <p class="text-[8px] font-black text-orange-500 uppercase">Step 2</p>
                <p id="v2" class="text-[10px] font-bold text-white uppercase">Industry</p>
            </div>
            <div id="s3" class="step-card" onclick="handleStep(3)">
                <p class="text-[8px] font-black text-orange-500 uppercase">Step 3</p>
                <p id="v3" class="text-[10px] font-bold text-white uppercase">Name</p>
            </div>
            <div id="s4" class="step-card" onclick="handleStep(4)">
                <p class="text-[8px] font-black text-orange-500 uppercase">Step 4</p>
                <p id="v4" class="text-[10px] font-bold text-white uppercase">Demo</p>
            </div>
        </div>

        <div class="bg-black/40 border border-white/5 rounded-3xl p-8 text-center">
            <div class="flex items-baseline justify-center gap-1 mb-2">
                <span class="text-4xl font-black text-white">$199</span>
                <span class="text-slate-500 font-bold">/mo</span>
            </div>
            <div id="timer" class="text-orange-500/50 font-mono text-xs mb-6 font-bold">00:00:00</div>
            <button onclick="handleStep(6)" class="w-full py-4 bg-white text-black rounded-xl text-[10px] font-black uppercase tracking-widest">Reserve Port</button>
        </div>
    </div>

    <div class="mobile-footer-spacer"></div>

    <div class="ticker-bar"><div class="ticker-content" id="ticker"></div></div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-8 rounded-[32px] max-w-xs w-full text-center">
            <h2 id="mTitle" class="text-sm font-black uppercase text-white mb-6">Setup</h2>
            <div id="mContent" class="grid gap-3"></div>
            <button onclick="closeModal()" class="mt-6 text-[9px] text-slate-500 uppercase font-black">Close</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let completedSteps = 0; let currentIndustry = "Electrical";

        function handleStep(s) { if(s === 1 || completedSteps >= s-1) triggerModal(s); }

        function triggerModal(step) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";

            if(step === 1) {
                t.innerText = "Select Market";
                ["USA", "UK"].forEach(l => createBtn(l, () => finish(1, l), c));
            } else if(step === 2) {
                t.innerText = "Select Industry";
                Object.keys(assistants).forEach(i => createBtn(i, () => { currentIndustry = i; finish(2, i); }, c));
            } else if(step === 3) {
                t.innerText = "Business Name";
                c.innerHTML = `<input id="bn" placeholder="NAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white mb-4 text-center font-bold uppercase"><button onclick="saveB()" class="orange-btn w-full py-4 rounded-xl text-[10px]">SAVE</button>`;
            } else if(step === 4) {
                t.innerText = "Initialize Demo";
                createBtn("START VOICE CALL", runVoice, c);
            }
        }

        function createBtn(txt, fn, cont) {
            const b = document.createElement('button');
            b.className = "w-full py-4 bg-white/5 border border-white/10 rounded-xl text-white font-bold text-[10px] uppercase";
            b.innerText = txt; b.onclick = fn; cont.appendChild(b);
        }

        function finish(s, v) {
            completedSteps = s;
            document.getElementById(`v${s}`).innerText = v;
            document.getElementById(`s${s}`).classList.add('active');
            closeModal();
            if(s < 4) document.getElementById(`s${s+1}`).classList.add('unlocked');
        }

        function saveB() { const v = document.getElementById('bn').value; if(v) finish(3, v); }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        
        async function runVoice() { 
            closeModal();
            const id = assistants[currentIndustry];
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) window.vapiSDK.run({ apiKey: vapiApiKey, assistant: id });
            } catch(e) { alert("Mic needed"); }
        }

        // Ticker logic
        let tickerHtml = "";
        for(let i=0; i<10; i++) tickerHtml += `<span class="px-10 text-[8px] font-black text-orange-500 uppercase italic"> ⚡ SYSTEM ONLINE ⚡ DEPLOYMENT READY </span>`;
        document.getElementById('ticker').innerHTML = tickerHtml + tickerHtml;

        // Timer
        setInterval(() => {
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            document.getElementById('timer').textContent = time;
        }, 1000);

        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
