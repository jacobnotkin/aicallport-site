<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Call Port - System Configuration</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
background: #0a0a0a;
color: #fff;
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.fade {
animation: fade 0.4s ease;
}

@keyframes fade {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}

.card {
border: 1px solid rgba(255,255,255,0.08);
border-radius: 16px;
padding: 18px;
cursor: pointer;
transition: 0.2s;
}

.card:hover {
border-color: rgba(255,255,255,0.3);
background: rgba(255,255,255,0.03);
}

.selected {
border-color: #4f46e5;
background: rgba(79,70,229,0.1);
}
</style>
</head>

<body class="h-screen flex flex-col">

<!-- HEADER -->
<header class="flex justify-between items-center p-6">
<div class="text-lg font-medium">AI Call Port</div>
<div class="text-sm text-gray-400">Step 1 of 3</div>
</header>

<!-- MAIN -->
<main id="app" class="flex-1 flex items-center justify-center px-6">
</main>

<!-- FOOTER -->
<footer class="p-6 text-center">
<button id="nextBtn"
class="bg-indigo-600 hover:bg-indigo-700 px-8 py-3 rounded-xl text-white opacity-50"
disabled>
Continue
</button>
</footer>

<script>
let step = 0;
let data = {};

const app = document.getElementById("app");
const nextBtn = document.getElementById("nextBtn");

const steps = [

// STEP 1 — COMPANY NAME
() => `
<div class="fade text-center max-w-xl">
<h1 class="text-3xl mb-3">What is your company name?</h1>
<p class="text-gray-400 mb-8">We will build your system around your business</p>

<input id="company"
class="w-full p-4 rounded-xl bg-black border border-gray-700"
placeholder="Enter company name"
/>
</div>
`,

// STEP 2 — INDUSTRY
() => `
<div class="fade text-center max-w-xl">
<h1 class="text-3xl mb-6">What industry are you in?</h1>

<div class="grid grid-cols-2 gap-4">
${["Plumbing","HVAC","Clinic","Real Estate"].map(i => `
<div class="card" onclick="selectOption('${i}','industry', this)">
${i}
</div>
`).join("")}
</div>
</div>
`,

// STEP 3 — CALL HANDLING
() => `
<div class="fade text-center max-w-xl">
<h1 class="text-3xl mb-6">What should happen when someone calls?</h1>

<div class="space-y-3">
${[
"Capture leads",
"Book appointments",
"Both"
].map(i => `
<div class="card" onclick="selectOption('${i}','callMode', this)">
${i}
</div>
`).join("")}
</div>
</div>
`,

// STEP 4 — CALL VOLUME
() => `
<div class="fade text-center max-w-xl">
<h1 class="text-3xl mb-6">How many calls do you receive per day?</h1>

<div class="grid grid-cols-2 gap-4">
${["0-10","10-30","30-100","100+"].map(i => `
<div class="card" onclick="selectOption('${i}','volume', this)">
${i}
</div>
`).join("")}
</div>
</div>
`,

// STEP 5 — TEAM
() => `
<div class="fade text-center max-w-xl">
<h1 class="text-3xl mb-6">Do you work alone or with a team?</h1>

<div class="space-y-3">
${["Just me","Small team","Larger team"].map(i => `
<div class="card" onclick="selectOption('${i}','team', this)">
${i}
</div>
`).join("")}
</div>
</div>
`

];

function render() {
app.innerHTML = steps[step]();
nextBtn.disabled = true;
nextBtn.classList.add("opacity-50");
}

function selectOption(value, key, el) {
data[key] = value;

document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
el.classList.add("selected");

enableNext();
}

function enableNext() {
nextBtn.disabled = false;
nextBtn.classList.remove("opacity-50");
}

nextBtn.onclick = () => {
if (step === 0) {
const val = document.getElementById("company").value;
if (!val) return;
data.company = val;
}

step++;
if (step >= steps.length) {
console.log("FINAL DATA:", data);
alert("System configuration complete");
return;
}

render();
};

render();
</script>

</body>
</html>
