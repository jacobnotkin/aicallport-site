<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | Mobile Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* CRITICAL MOBILE RESET */
        * { box-sizing: border-box; }
        html, body { 
            width: 100%; overflow-x: hidden; position: relative;
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; padding: 0;
        }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.1) 0%, transparent 70%);
        }

        /* Responsive Container */
        .container-box {
            width: 92%; max-width: 1100px; margin: 20px auto 140px auto;
            background: rgba(10, 12, 18, 0.8); backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 24px;
        }

        /* Steps Layout: 2 columns on mobile, 6 on desktop */
        .steps-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        }
        @media (min-width: 768px) { .steps-grid { grid-template-columns: repeat(6, 1fr); } }

        .step-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px; border-radius: 12px; transition: 0.3s; opacity: 0.4;
        }
        .step-card.active { opacity: 1; border-color: #f97316; background: rgba(249, 115, 22, 0.05); }

        .orange-btn {
            background: linear-gradient(90deg, #f97316, #ea580c);
            color: white; font-weight: 800; text-transform: uppercase;
            padding: 16px; border-radius: 14px; transition: 0.2s;
            cursor: pointer; border: none; width: 100%;
        }
        @media (min-width: 768px) { .orange-btn { width: auto; padding: 16px 40px; } }

        /* Floating Terminal - Stays Fixed without breaking width */
        .neural-terminal {
            position: fixed; bottom: 20px; left: 5%; width: 90%;
            max-width: 350px; background: rgba(0,0,0,0.9);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 16px; padding: 12px; z-index: 100;
        }
        @media (min-width: 768px) { .neural-terminal { left: auto; right: 40px; } }

        #setupModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="neural-terminal">
        <div class="flex justify-between items-center mb-1">
            <span class="text-[8px] font-black text-orange-500 uppercase tracking-widest">Neural Link</span>
            <span class="text-[8px] text-green-500 animate-pulse uppercase">Active</span>
        </div>
        <div id="logText" class="text-[9px] font-mono text-slate-400">Ready for Deployment...</div>
    </div>

    <div class="container-box">
        <div class="flex items-center gap-2 mb-8">
            <div class="bg-orange-500 text-black font-black px-2 py-0.5 text-[9px] rounded italic">BETA</div>
            <div class="font-black italic text-xl uppercase tracking-tighter">AI CALL <span class="text-orange-500">PORT</span></div>
        </div>

        <div class="grid lg:grid-cols-2 gap-10 items-center">
            <div class="text-center lg:text-left">
                <h1 class="text-4xl md:text-6xl font-black italic uppercase leading-[0.9] mb-4">
                    Neural <span class="text-orange-500">Voice</span> Agent
                </h1>
                <p class="text-slate-400 text-sm mb-8 max-w-sm mx-auto lg:mx-0">
                    One-click autonomous voice infrastructure for your business.
                </p>
                <button onclick="handleStep(1)" class="orange-btn text-[11px] tracking-widest">Initialise Step 01</button>
            </div>

            <div class="bg-black/40 border border-orange-500/30 rounded-[32px] p-8 text-center">
                <div class="text-[10px] font-black text-orange-500 uppercase mb-4 tracking-widest">Beta Offer</div>
                <div class="text-5xl font-black text-white mb-2">$199<span class="text-sm text-slate-500">/mo</span></div>
                <div id="timer" class="text-xl font-mono text-white/50 mb-6">23:59:59</div>
                <button onclick="handleStep(6)" class="w-full bg-white text-black font-black py-4 rounded-xl text-[10px] uppercase hover:bg-orange-500 transition-all">Launch Now</button>
            </div>
        </div>

        <div class="mt-16">
            <div class="text-center text-[10px] font-black text-slate-500 uppercase tracking-[0.4em] mb-6">Activation Pipeline</div>
            <div class="steps-grid">
                <div id="s1" class="step-card active"><div class="text-[8px] font-black text-orange-500 uppercase">Market</div><div id="v1" class="text-[10px] font-bold">Select</div></div>
                <div id="s2" class="step-card"><div class="text-[8px] font-black text-orange-500 uppercase">Industry</div><div id="v2" class="text-[10px] font-bold">Waiting</div></div>
                <div id="s3" class="step-card"><div class="text-[8px] font-black text-orange-500 uppercase">Sync</div><div id="v3" class="text-[10px] font-bold">Waiting</div></div>
                <div id="s4" class="step-card"><div class="text-[8px] font-black text-orange-500 uppercase">Role</div><div id="v4" class="text-[10px] font-bold">Waiting</div></div>
                <div id="s5" class="step-card"><div class="text-[8px] font-black text-orange-500 uppercase">Demo</div><div id="v5" class="text-[10px] font-bold">Waiting</div></div>
                <div id="s6" class="step-card"><div class="text-[8px] font-black text-orange-500 uppercase">Final</div><div id="v6" class="text-[10px] font-bold">Waiting</div></div>
            </div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0b0d12] border border-white/10 p-8 rounded-[32px] w-full max-w-sm text-center">
            <h2 id="mTitle" class="text-xl font-black uppercase text-white mb-6"></h2>
            <div id="mContent" class="grid gap-3"></div>
            <button onclick="closeModal()" class="mt-8 text-[10px] text-slate-500 uppercase font-black">Cancel</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let currentStep = 1; let selectedInd = "";

        function log(m) { document.getElementById('logText').innerText = `> ${m.toUpperCase()}`; }

        function handleStep(s) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";

            if(s === 1) {
                t.innerText = "Select Market";
                ["USA", "UK"].forEach(opt => createBtn(opt, () => finish(1, opt), c));
            } else if(s === 2) {
                t.innerText = "Industry";
                Object.keys(assistants).forEach(opt => createBtn(opt, () => { selectedInd = opt; finish(2, opt); }, c));
            } else if(s === 3) {
                t.innerText = "Sync Business";
                c.innerHTML = `<input id="bn" placeholder="NAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white text-center mb-4"><button onclick="finish(3, document.getElementById('bn').value)" class="orange-btn">Verify</button>`;
            } else if(s === 5) {
                t.innerText = "Voice Demo";
                createBtn("Start Live Call", startDemo, c);
            }
        }

        function createBtn(txt, fn, p) {
            const b = document.createElement('button');
            b.className = "w-full py-4 bg-white/5 border border-white/10 hover:border-orange-500 rounded-xl text-white font-bold text-[10px] uppercase";
            b.innerText = txt; b.onclick = fn; p.appendChild(b);
        }

        function finish(s, v) {
            if(!v) return;
            document.getElementById(`v${s}`).innerText = v;
            document.getElementById(`s${s}`).classList.add('active');
            if(s < 6) document.getElementById(`s${s+1}`).classList.add('active');
            log(`${s} complete: ${v}`);
            closeModal();
        }

        async function startDemo() {
            log("Opening Mic...");
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) {
                    window.vapiSDK.run({ apiKey: vapiApiKey, assistant: assistants[selectedInd] });
                    finish(5, "ACTIVE");
                }
            } catch (e) { alert("HTTPS and Mic Permission required."); }
        }

        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }

        setInterval(() => {
            const n = new Date();
            document.getElementById('timer').innerText = `${23-n.getHours()}:${59-n.getMinutes()}:${59-n.getSeconds()}`;
        }, 1000);

        // Load Vapi
        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
