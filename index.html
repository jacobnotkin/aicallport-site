<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | BETA Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; margin: 0; overflow-x: hidden; display: flex; flex-direction: column;
        }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .console-container {
            width: 95%; max-width: 1100px; margin: 40px auto 20px; background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px; 
            padding: 30px; position: relative; z-index: 10;
        }

        /* Original Terminal Design */
        .system-log {
            width: 100%; max-width: 350px; height: 100px; margin: 0 auto 20px;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 16px; padding: 12px; font-family: monospace; font-size: 10px;
        }
        .log-line { border-left: 2px solid #f97316; padding-left: 8px; margin-bottom: 4px; }

        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); font-weight: 800; border: none; cursor: pointer; }

        .step-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px; border-radius: 20px; transition: 0.4s; opacity: 0.3;
        }
        .step-card.unlocked { opacity: 1; border-color: rgba(255, 255, 255, 0.2); }
        .step-card.active { border-color: #f97316 !important; background: rgba(249, 115, 22, 0.1) !important; }

        /* VAPI BUTTON FIX - Locked to Bottom Center & Always on Top */
        #vapi-support-btn, [class*="vapi-btn"] {
            position: fixed !important;
            bottom: 60px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 999999 !important; /* Top layer */
            display: block !important;
        }

        /* Create room so the button doesn't overlap the UI when scrolling */
        .page-footer-spacer { height: 150px; width: 100%; margin-top: auto; }

        .ticker-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 40px;
            background: rgba(6, 8, 15, 0.95); border-top: 1px solid #f97316;
            display: flex; align-items: center; z-index: 100; overflow: hidden;
        }
        .ticker-content { display: flex; white-space: nowrap; animation: marquee 50s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="console-container">
        <div class="system-log" id="logBox">
            <div class="flex justify-between text-[8px] text-orange-500 font-black uppercase mb-2">
                <span>Neural Terminal</span>
                <span class="animate-pulse">● Connected</span>
            </div>
            <div id="logContent" class="text-slate-400">
                <div class="log-line">SYSTEM ONLINE...</div>
                <div class="log-line">VOICE CHANNELS READY...</div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row justify-between items-center gap-10 mb-12">
            <div class="text-center lg:text-left">
                <div class="flex items-center justify-center lg:justify-start gap-2 mb-2">
                    <div class="bg-orange-500 text-black font-black italic px-2 py-0.5 text-[10px] rounded-sm">BETA</div>
                    <span class="text-xl font-black italic uppercase">AI CALL <span class="text-orange-500">PORT</span></span>
                </div>
                <h1 class="text-5xl md:text-7xl font-black italic uppercase leading-none mb-6">
                    NEURAL<br><span class="text-orange-500">RECEPTIONIST</span>
                </h1>
                <button onclick="handleStep(1)" class="orange-btn px-10 py-5 rounded-2xl text-[10px] uppercase tracking-widest italic shadow-xl">Begin 6-Step Activation</button>
            </div>

            <div class="w-full max-w-sm bg-black/40 border-2 border-orange-500/30 rounded-[40px] p-10 text-center">
                <span class="text-slate-600 line-through text-lg font-bold opacity-50">$399 Regular</span>
                <div class="flex items-baseline justify-center gap-1 mt-1">
                    <span class="text-6xl font-black text-white">$199</span>
                    <span class="text-orange-500 font-bold">/mo</span>
                </div>
                <div id="timer" class="text-xl font-mono font-black text-white/20 my-6">00:00:00</div>
                <button onclick="handleStep(6)" class="orange-btn w-full py-4 rounded-xl text-[10px] uppercase tracking-widest">Instant Activation</button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
            <div id="s1" class="step-card unlocked" onclick="handleStep(1)"><p class="text-[8px] font-black text-orange-500">01 MARKET</p><p id="v1" class="text-[10px] font-bold text-white uppercase mt-1">USA</p></div>
            <div id="s2" class="step-card unlocked" onclick="handleStep(2)"><p class="text-[8px] font-black text-orange-500">02 INDUSTRY</p><p id="v2" class="text-[10px] font-bold text-white uppercase mt-1">Electrical</p></div>
            <div id="s3" class="step-card unlocked" onclick="handleStep(3)"><p class="text-[8px] font-black text-orange-500">03 NAME</p><p id="v3" class="text-[10px] font-bold text-white uppercase mt-1">AAA</p></div>
            <div id="s4" class="step-card unlocked" onclick="handleStep(4)"><p class="text-[8px] font-black text-orange-500">04 ROLE</p><p id="v4" class="text-[10px] font-bold text-white uppercase mt-1">Receptionist</p></div>
            <div id="s5" class="step-card unlocked active" onclick="handleStep(5)"><p class="text-[8px] font-black text-orange-500">05 DEMO</p><p id="v5" class="text-[10px] font-bold text-white uppercase mt-1">Testing</p></div>
            <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[8px] font-black text-orange-500">06 PIPELINE</p><p id="v6" class="text-[10px] font-bold text-white uppercase mt-1">Activate</p></div>
        </div>
    </div>

    <div class="page-footer-spacer"></div>

    <div class="ticker-bar">
        <div class="ticker-content" id="ticker"></div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-10 rounded-[40px] max-w-sm w-full text-center">
            <h2 class="text-xl font-black uppercase text-white mb-6">Demo Initialization</h2>
            <button onclick="runVoice()" class="orange-btn w-full py-4 rounded-xl font-black text-[10px]">START VOICE LINK</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        
        function handleStep(s) { if(s === 5) document.getElementById('setupModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        
        async function runVoice() { 
            closeModal();
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) {
                    window.vapiSDK.run({ apiKey: vapiApiKey, assistant: "7a2fbe45-b54b-4375-aa1f-111be3f1501a" });
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }
            } catch(e) { console.log("Mic access denied"); }
        }

        function updateParallax(e) {
            document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%');
            document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%');
        }

        let tickerHtml = "";
        for(let i=0; i<10; i++) tickerHtml += `<span class="px-10 text-[9px] font-black text-orange-500 uppercase italic"> ⚡ SYSTEM ONLINE ⚡ DEPLOYMENT READY </span>`;
        document.getElementById('ticker').innerHTML = tickerHtml + tickerHtml;

        setInterval(() => {
            const now = new Date();
            document.getElementById('timer').textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
