        const marketCurrency = {
            "United States": { active: true },
            "United Kingdom": { active: true },
            "Spain": { active: true }

        };

        function createBtn(text, onClick) {
            const b = document.createElement('button');
            b.className = 'modal-btn';
            b.innerText = text;
            b.onclick = onClick;
            return b;
        }

        function triggerModal(step) {
            const m = document.getElementById('setupModal'), 
                  c = document.getElementById('mContent'), 
                  s = document.getElementById('modalSearchContainer'), 
                  t = document.getElementById('mTitle'), 
                  lang = i18n[currentLang] || i18n.EN;
            
            m.style.display = 'flex'; 
            c.innerHTML = ""; 
            s.innerHTML = "";
            
            if(step === 1) { 
                t.innerText = lang.steps[0];
                s.innerHTML = `<input type="text" class="search-box" placeholder="SEARCH COUNTRIES..." onkeyup="filterList('mContent', this.value)">`;
                const countries = Object.keys(marketCurrency);
                const activeOnes = countries.filter(k => marketCurrency[k].active).sort();
                const soonOnes = countries.filter(k => !marketCurrency[k].active).sort();

                activeOnes.forEach(name => {
                    const btn = createBtn(name, () => { updateCurrencyUI(name); finish(1, name); });
                    btn.innerHTML = `<div class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div> ${name}`;
                    btn.setAttribute('data-n', name);
                    c.appendChild(btn);
                });

                const div = document.createElement('div');
                div.className = "text-[8px] font-black text-slate-600 uppercase tracking-[0.2em] my-3 border-b border-white/5 pb-1 text-center";
                div.innerText = "Coming Soon";
                c.appendChild(div);

                soonOnes.forEach(name => {
                    const btn = createBtn(name, () => {});
                    btn.classList.add('disabled');
                    btn.innerHTML = `<div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div> ${name}`;
                    btn.setAttribute('data-n', name);
                    c.appendChild(btn);
                });
            } else if (step === 2) {
                t.innerText = lang.steps[1];
                s.innerHTML = `<input type="text" class="search-box" placeholder="SEARCH INDUSTRIES..." onkeyup="filterList('mContent', this.value)">`;
                const industryList = lang.industries || i18n.EN.industries;
                industryList.forEach((name, idx) => {
                    const btn = createBtn(name, () => { currentIndustryIdx = idx; finish(2, name); });
                    btn.setAttribute('data-n', name);
                    c.appendChild(btn);
                });
            } else if (step === 3) {
                t.innerText = lang.steps[2];
                c.innerHTML = `<input id="bn" placeholder="BUSINESS NAME" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white mb-2 text-center text-xs uppercase font-black outline-none"><button onclick="saveB()" class="orange-btn w-full py-3 rounded-xl font-black text-[10px]">SAVE</button>`;
            } else if (step === 4) {
                // Translated ROLE buttons
                t.innerText = lang.steps[3];
                const roles = lang.roles || i18n.EN.roles;
                roles.forEach(r => c.appendChild(createBtn(r, () => finish(4, r))));
            } else if (step === 5) {
                // Translated DEMO button
                t.innerText = lang.steps[4];
                const btnText = lang.demoBtn || i18n.EN.demoBtn;
                c.appendChild(createBtn(btnText, runVoice));
            } else if (step === 6) {
                // Translated DEPLOY button
                t.innerText = lang.steps[5] || "DEPLOYMENT";
                const btnText = lang.deployBtn || i18n.EN.deployBtn;
                c.appendChild(createBtn(btnText, () => { 
                    // Assuming confetti() and finish() exist in your base code
                    if(typeof confetti === 'function') confetti(); 
                    finish(6, "READY"); 
                    setTimeout(() => window.open("https://buy.stripe.com/8x24gA9TB9Vab160h43ks01"), 1200); 
                }));
            }
        }

        // Dummy functions to prevent errors if not in your base code snippet
        function updateCurrencyUI(n) {}
        function finish(s, v) { console.log("Step " + s + " value: " + v); document.getElementById('setupModal').style.display = 'none'; }
        function filterList(id, val) {
            const btns = document.getElementById(id).getElementsByClassName('modal-btn');
            for(let b of btns) {
                b.style.display = b.getAttribute('data-n').toUpperCase().includes(val.toUpperCase()) ? "" : "none";
            }
        }
        function saveB() { const val = document.getElementById('bn').value; finish(3, val); }
        function runVoice() { console.log("Voice started"); }
