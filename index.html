<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | BETA Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* MOBILE STABILITY FIXES */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 0; width: 100%; overflow-x: hidden;
            /* Changed from Flex to Block for mobile scroll stability */
            display: block !important; 
        }

        body { padding: 15px; min-height: 100vh; }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), var(--glow-color, rgba(249, 115, 22, 0.1)) 0%, transparent 60%);
            pointer-events: none;
        }

        .console-container {
            width: 100%; max-width: 1100px; margin: 20px auto 120px auto;
            background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; 
            padding: 24px; position: relative; z-index: 10;
        }

        @media (min-width: 1024px) {
            .console-container { padding: 40px; border-radius: 40px; }
        }

        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); cursor: pointer; touch-action: manipulation; }

        .step-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px; border-radius: 16px; transition: 0.4s; opacity: 0.3;
        }
        .step-card.unlocked { opacity: 1; border-color: rgba(255, 255, 255, 0.15); }
        .step-card.active { border-color: #f97316 !important; background: rgba(249, 115, 22, 0.15) !important; }
        .next-focus { animation: next-step-pulse 1.5s infinite ease-in-out; border-width: 2px; opacity: 1; }

        @keyframes next-step-pulse {
            0%, 100% { border-color: rgba(249, 115, 22, 0.3); }
            50% { border-color: #f97316; }
        }

        /* MODAL FIX: Absolute top layer for Role buttons */
        #setupModal { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.98); 
            z-index: 99999; display: none; align-items: center; justify-content: center; 
            padding: 20px;
        }
        
        .modal-box {
            background: #0f172a; border: 1px solid rgba(255,255,255,0.1);
            padding: 30px; border-radius: 30px; width: 100%; max-width: 350px; text-align: center;
        }

        .ticker-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 40px;
            background: #06080f; border-top: 1px solid rgba(249, 115, 22, 0.2);
            z-index: 100; display: flex; align-items: center; overflow: hidden;
        }
        .ticker-content { display: flex; white-space: nowrap; animation: marquee 60s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .system-log {
            position: fixed; bottom: 60px; right: 20px; width: 280px; height: 110px;
            background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px; padding: 12px; font-family: monospace; font-size: 9px;
            color: #94a3b8; z-index: 50; display: none; /* Hidden on small mobile to avoid overlap */
        }
        @media (min-width: 768px) { .system-log { display: block; } }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="system-log" id="logBox">
        <div class="text-[9px] text-orange-500 font-black mb-2 uppercase">Neural Terminal</div>
        <div id="logContent"></div>
    </div>

    <div class="console-container">
        <div class="flex justify-between items-start mb-10">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <div class="px-2 py-0.5 bg-orange-500 rounded-sm text-[10px] font-black text-black">BETA</div>
                    <span class="font-black italic text-xl uppercase tracking-tighter">AI CALL <span class="text-orange-500">PORT</span></span>
                </div>
                <div class="text-[8px] font-bold text-slate-500 uppercase tracking-widest">v5.0 Secure Operator</div>
            </div>
        </div>

        <div class="grid lg:grid-cols-5 gap-10 items-center">
            <div class="lg:col-span-3">
                <h1 class="text-4xl lg:text-6xl font-black italic uppercase leading-[0.9] mb-6">
                    <span class="text-white">INSTANT</span><br>
                    <span class="text-orange-500">AI RECEPTIONIST</span>
                </h1>
                <p class="text-slate-400 text-sm mb-8">Deploy your automated voice pipeline in 6 steps.</p>
                <button id="mainActionBtn" onclick="handleStep(1)" class="orange-btn w-full lg:w-auto px-10 py-5 rounded-2xl text-[10px] font-black uppercase italic">Begin Activation</button>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-black/50 border-2 border-orange-500/30 rounded-[35px] p-8 text-center">
                    <div class="flex flex-col items-center mb-4">
                        <span class="text-slate-600 line-through text-sm font-bold opacity-50">$399 Regular</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-5xl font-black text-white">$199</span>
                            <span class="text-orange-500 font-bold">/mo</span>
                        </div>
                    </div>
                    <div id="timer" class="text-xl font-mono font-black text-white/40 mb-6">00:00:00</div>
                    <button onclick="handleStep(6)" class="orange-btn w-full py-4 rounded-xl text-[10px] font-black uppercase tracking-widest">Activate Now</button>
                </div>
            </div>
        </div>

        <div id="stepsSection" class="mt-16">
            <div class="grid grid-cols-2 lg:grid-cols-6 gap-3">
                <div id="s1" class="step-card unlocked next-focus" onclick="handleStep(1)"><p class="text-[7px] font-black text-orange-500">01 MARKET</p><p id="v1" class="text-[9px] text-white/30 font-bold uppercase truncate">Select</p></div>
                <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[7px] font-black text-orange-500">02 NICHE</p><p id="v2" class="text-[9px] text-white/30 font-bold uppercase truncate">Select</p></div>
                <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[7px] font-black text-orange-500">03 BRAND</p><p id="v3" class="text-[9px] text-white/30 font-bold uppercase truncate">Sync</p></div>
                <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[7px] font-black text-orange-500">04 ROLE</p><p id="v4" class="text-[9px] text-white/30 font-bold uppercase truncate">Choose</p></div>
                <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[7px] font-black text-orange-500">05 DEMO</p><p id="v5" class="text-[9px] text-white/30 font-bold uppercase truncate">Sandbox</p></div>
                <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[7px] font-black text-orange-500">06 LAUNCH</p><p id="v6" class="text-[9px] text-white/30 font-bold uppercase truncate">Activate</p></div>
            </div>
        </div>
    </div>

    <div class="ticker-bar"><div class="ticker-content" id="ticker"></div></div>

    <div id="setupModal">
        <div class="modal-box">
            <h2 id="mTitle" class="text-lg font-black uppercase text-white mb-6">Setup</h2>
            <div id="mContent" class="grid gap-3"></div>
            <button onclick="closeModal()" class="mt-8 text-[10px] text-slate-500 uppercase font-black">← Back</button>
        </div>
    </div>

    <script>
        const stripeLink = "https://buy.stripe.com/8x24gA9TB9Vab160h43ks01";
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let completedSteps = 0; let currentIndustry = "";

        function addLog(msg) {
            const content = document.getElementById('logContent');
            const div = document.createElement('div');
            div.innerText = `> ${msg.toUpperCase()}`;
            content.prepend(div);
            if(content.children.length > 4) content.lastChild.remove();
        }

        function updateParallax(e) {
            document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%');
            document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%');
        }

        function handleStep(s) { if(s === 1 || completedSteps >= s-1) triggerModal(s); }

        function triggerModal(step) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";

            if(step === 1) {
                t.innerText = "Target Market";
                ["USA", "UK", "Canada"].forEach(l => createBtn(l, () => { addLog(`Region: ${l}`); finish(1, l); }, c));
            } else if(step === 2) {
                t.innerText = "Industry";
                Object.keys(assistants).forEach(i => createBtn(i, () => { currentIndustry = i; addLog(`Niche: ${i}`); finish(2, i); }, c));
            } else if(step === 3) {
                t.innerText = "Brand Name";
                c.innerHTML = `<input id="bn" placeholder="BUSINESS NAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white mb-4 text-center font-black uppercase"><button onclick="saveB()" class="orange-btn w-full py-4 rounded-xl font-black text-[10px]">Sync Identity</button>`;
            } else if(step === 4) {
                t.innerText = "Select Role";
                ["Receptionist", "Qualifier"].forEach(r => createBtn(r, () => { addLog(`Role: ${r}`); finish(4, r); }, c));
            } else if(step === 5) {
                t.innerText = "Sandbox Sandbox";
                createBtn("START LIVE CALL", runVoice, c);
            } else if(step === 6) {
                t.innerText = "Finalize";
                createBtn("Pay & Launch", () => { 
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    finish(6, "ACTIVE");
                    setTimeout(() => window.open(stripeLink, '_blank'), 1500);
                }, c);
            }
        }

        function createBtn(txt, fn, cont) {
            const b = document.createElement('button');
            b.className = "w-full py-4 bg-white/10 hover:bg-orange-600 rounded-xl text-white font-black text-[11px] uppercase transition-all active:scale-95";
            b.innerText = txt; b.onclick = fn; cont.appendChild(b);
        }

        function finish(s, v) {
            completedSteps = s;
            const el = document.getElementById(`v${s}`);
            el.innerText = v; el.classList.replace('text-white/30', 'text-white');
            document.getElementById(`s${s}`).classList.add('active');
            document.getElementById(`s${s}`).classList.remove('next-focus');
            closeModal();
            if(s < 6) {
                const n = s + 1;
                document.getElementById(`s${n}`).classList.add('unlocked', 'next-focus');
                document.getElementById('mainActionBtn').innerText = `Proceed to Step 0${n}`;
            }
        }

        function saveB() { const v = document.getElementById('bn').value; if(v) finish(3, v); }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        
        async function runVoice() { 
            const id = assistants[currentIndustry] || assistants["Electrical"];
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) {
                    window.vapiSDK.run({ apiKey: vapiApiKey, assistant: id });
                    closeModal(); finish(5, "TESTING");
                }
            } catch(e) { alert("Mic required for demo."); }
        }

        let tickerHtml = "";
        for(let i=0; i<15; i++) tickerHtml += `<span class="px-16 text-[9px] font-black text-orange-500 uppercase italic"> ⚡ SYSTEM ONLINE ⚡ DEPLOYMENT READY </span>`;
        document.getElementById('ticker').innerHTML = tickerHtml + tickerHtml;

        setInterval(() => {
            const now = new Date();
            const h = 23 - now.getHours(); const m = 59 - now.getMinutes(); const s = 59 - now.getSeconds();
            document.getElementById('timer').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);

        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
