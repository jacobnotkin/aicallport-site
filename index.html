<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global AI Receptionist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; overflow-x: hidden; }
        .hero-gradient { background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%); }
        .orange-btn { background: #f97316; color: #fff; transition: 0.3s; }
        .orange-btn:hover { background: #ea580c; transform: scale(1.02); }
        .step-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer; }
        .step-card:hover { border-color: #f97316; background: rgba(255,115,22,0.05); }
        .step-card.active { border-color: #f97316; background: rgba(255,115,22,0.1); }
        .search-box { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; color: white; margin-bottom: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; outline: none; }
        .modal-btn { width: 100%; text-align: left; padding: 12px; border-radius: 10px; margin-bottom: 4px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); font-size: 10px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .modal-btn:hover { background: rgba(255,255,255,0.1); }
        .modal-btn.disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        #vapi-status { position: fixed; bottom: 20px; right: 20px; font-size: 8px; font-weight: 900; color: #f97316; text-transform: uppercase; letter-spacing: 0.2em; pointer-events: none; }
    </style>
</head>
<body class="hero-gradient min-h-screen">
    <nav class="p-6 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-orange-500 rounded-full animate-pulse"></div>
            <span class="font-black text-sm tracking-tighter">GLOBAL AI</span>
        </div>
        <div class="flex gap-4">
            <button onclick="changeLang('EN')" class="text-[10px] font-black opacity-50 hover:opacity-100">EN</button>
            <button onclick="changeLang('ES')" class="text-[10px] font-black opacity-50 hover:opacity-100">ES</button>
            <button onclick="changeLang('FR')" class="text-[10px] font-black opacity-50 hover:opacity-100">FR</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-16 text-center">
        <div class="inline-block px-3 py-1 rounded-full border border-orange-500/30 text-orange-500 text-[8px] font-black tracking-widest mb-6">BETA ACCESS</div>
        <h1 id="h1" class="text-5xl md:text-7xl font-black mb-6 tracking-tighter leading-none">GLOBAL ZERO-HUMAN<br> AI RECEPTIONIST</h1>
        <p id="p" class="text-slate-400 text-sm md:text-lg mb-12 max-w-xl mx-auto font-medium">Instant <span class="text-orange-500">SMALL BUSINESS</span> Activation. <span class="text-orange-500">Worldwide Deployment. No Humans.</span></p>
        
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-12" id="stepContainer">
            </div>

        <button onclick="triggerModal(1)" id="startBtn" class="orange-btn px-12 py-5 rounded-2xl font-black text-xs tracking-widest uppercase shadow-2xl shadow-orange-500/20">Start Activation</button>
    </main>

    <div id="setupModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden z-50 flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm">
            <h2 id="mTitle" class="text-[10px] font-black text-orange-500 mb-6 tracking-[0.3em] uppercase text-center">Select Market</h2>
            <div id="modalSearchContainer"></div>
            <div id="mContent" class="space-y-1 max-h-[60vh] overflow-y-auto pr-2"></div>
            <button onclick="closeModal()" class="mt-8 text-white/30 hover:text-white text-[8px] font-black tracking-widest uppercase w-full">Cancel</button>
        </div>
    </div>

    <div id="vapi-status"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        // Global State
        let currentLang = 'EN';
        let selections = { market: null, industry: null, name: null, role: null };
        const industryKeys = ["Accounting", "After Hours", "Auto Repair", "Bakery", "Boutique", "Car Wash", "Car Rental", "Dental", "Electrical", "Electronics", "Florist", "Furniture", "HVAC", "Hair Salon", "Handyman", "House Cleaning", "Insurance", "Jewelry", "Landscaping", "Legal", "Locksmith", "Massage", "Med Spa", "Nail Salon", "Pest Control", "Plumbing", "Real Estate", "Restaurant", "Roofing", "Towing", "Urgent Care", "Veterinary", "Windows"];

        const marketCurrency = {
            "United States": { active: true, cur: "$", code: "USD", rate: "299", flag: "US" },
            "United Kingdom": { active: true, cur: "£", code: "GBP", rate: "249", flag: "GB" },
            "Canada": { active: true, cur: "$", code: "CAD", rate: "399", flag: "CA" },
            "Australia": { active: true, cur: "$", code: "AUD", rate: "449", flag: "AU" },
            "Spain": { active: true, cur: "€", code: "EUR", rate: "279", flag: "ES" },
            "France": { active: true, cur: "€", code: "EUR", rate: "279", flag: "FR" },
            "Germany": { active: true, cur: "€", code: "EUR", rate: "279", flag: "DE" },
            "Italy": { active: true, cur: "€", code: "EUR", rate: "279", flag: "IT" },
            "Netherlands": { active: true, cur: "€", code: "EUR", rate: "279", flag: "NL" },
            "Mexico": { active: false, cur: "$", code: "MXN", flag: "MX" },
            "Brazil": { active: false, cur: "R$", code: "BRL", flag: "BR" },
            "Japan": { active: false, cur: "¥", code: "JPY", flag: "JP" }
        };

        const i18n = {
            EN: { h1: "GLOBAL ZERO-HUMAN<br> AI RECEPTIONIST", p: "Instant <span class='text-orange-500'>SMALL BUSINESS</span> Activation. <span class='text-orange-500'>Worldwide Deployment. No Humans.</span>", start: "Start Activation", steps: ["01 Market", "02 Industry", "03 Business", "04 Role", "05 Demo", "06 Deploy"] },
            ES: { h1: "RECEPCIONISTA AI GLOBAL<br> SIN HUMANOS", p: "Activación Instantánea de <span class='text-orange-500'>NEGOCIOS</span>. <span class='text-orange-500'>Sin Humanos.</span>", start: "Iniciar Activación", steps: ["01 Mercado", "02 Industria", "03 Empresa", "04 Rol", "05 Demo", "06 Desplegar"] },
            FR: { h1: "RÉCEPTIONNISTE IA<br> SANS HUMAINS", p: "Activation <span class='text-orange-500'>PETITE ENTREPRISE</span>. <span class='text-orange-500'>Déploiement mondial.</span>", start: "Démarrer l'activation", steps: ["01 Marché", "02 Industrie", "03 Entreprise", "04 Rôle", "05 Démo", "06 Déployer"] }
        };

        function initSteps() {
            const container = document.getElementById('stepContainer');
            container.innerHTML = '';
            i18n[currentLang].steps.forEach((step, i) => {
                const card = document.createElement('div');
                card.className = `step-card p-4 rounded-xl text-left ${selections[Object.keys(selections)[i]] ? 'active' : ''}`;
                card.onclick = () => triggerModal(i + 1);
                card.innerHTML = `
                    <div class="text-[8px] font-black text-orange-500 mb-1 opacity-50 uppercase">${step}</div>
                    <div class="text-[10px] font-black truncate">${selections[Object.keys(selections)[i]] || '---'}</div>
                `;
                container.appendChild(card);
            });
        }

        function triggerModal(step) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const s = document.getElementById('modalSearchContainer');
            const t = document.getElementById('mTitle');
            const lang = i18n[currentLang];
            
            m.classList.remove('hidden');
            m.classList.add('flex');
            c.innerHTML = ""; s.innerHTML = "";
            
            if(step === 1) {
                t.innerText = lang.steps[0];
                s.innerHTML = `<input type="text" class="search-box" placeholder="SEARCH COUNTRIES..." onkeyup="filterList('mContent', this.value)">`;
                const countries = Object.keys(marketCurrency);
                const activeOnes = countries.filter(k => marketCurrency[k].active).sort();
                const soonOnes = countries.filter(k => !marketCurrency[k].active).sort();

                activeOnes.forEach(name => {
                    const btn = createBtn(name, () => finish(1, name));
                    btn.innerHTML = `<div class="w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div> ${name}`;
                    btn.setAttribute('data-n', name);
                    c.appendChild(btn);
                });

                const div = document.createElement('div');
                div.className = "text-[8px] font-black text-slate-600 uppercase tracking-[0.2em] my-3 border-b border-white/5 pb-1 text-center";
                div.innerText = "Coming Soon";
                c.appendChild(div);

                soonOnes.forEach(name => {
                    const btn = createBtn(name, () => {});
                    btn.classList.add('disabled');
                    btn.innerHTML = `<div class="w-1.5 h-1.5 rounded-full bg-slate-700"></div> ${name}`;
                    btn.setAttribute('data-n', name);
                    c.appendChild(btn);
                });
            } else if (step === 2) {
                t.innerText = lang.steps[1];
                s.innerHTML = `<input type="text" class="search-box" placeholder="SEARCH INDUSTRIES..." onkeyup="filterList('mContent', this.value)">`;
                industryKeys.forEach(name => {
                    const btn = createBtn(name, () => finish(2, name));
                    btn.setAttribute('data-n', name);
                    c.appendChild(btn);
                });
            } else if (step === 3) {
                t.innerText = lang.steps[2];
                c.innerHTML = `
                    <input id="bn" placeholder="BUSINESS NAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white mb-2 text-center text-xs uppercase font-black outline-none focus:border-orange-500">
                    <button onclick="saveB()" class="orange-btn w-full py-4 rounded-xl font-black text-[10px] tracking-[0.2em]">SAVE</button>
                `;
            } else if (step === 4) {
                t.innerText = lang.steps[3];
                ["Receptionist", "Sales Agent", "Support Agent"].forEach(r => c.appendChild(createBtn(r, () => finish(4, r))));
            } else if (step === 5) {
                t.innerText = lang.steps[4];
                c.appendChild(createBtn("START DEMO CALL", () => { closeModal(); alert('Connecting to Vapi...'); }));
            } else if (step === 6) {
                t.innerText = lang.steps[5];
                c.appendChild(createBtn("GET MY NUMBER", () => { confetti(); alert('Redirecting to Stripe...'); }));
            }
        }

        function createBtn(text, onClick) {
            const b = document.createElement('button');
            b.className = 'modal-btn';
            b.innerText = text;
            b.onclick = onClick;
            return b;
        }

        function filterList(id, val) {
            const btns = document.getElementById(id).getElementsByClassName('modal-btn');
            for(let b of btns) {
                if(b.getAttribute('data-n')) {
                    b.style.display = b.getAttribute('data-n').toUpperCase().includes(val.toUpperCase()) ? "" : "none";
                }
            }
        }

        function finish(step, val) {
            const keys = Object.keys(selections);
            selections[keys[step-1]] = val;
            closeModal();
            initSteps();
            if(step < 6) triggerModal(step + 1);
        }

        function saveB() { const v = document.getElementById('bn').value; if(v) finish(3, v); }
        function closeModal() { document.getElementById('setupModal').classList.add('hidden'); }
        function changeLang(l) { currentLang = l; document.getElementById('h1').innerHTML = i18n[l].h1; document.getElementById('p').innerHTML = i18n[l].p; document.getElementById('startBtn').innerText = i18n[l].start; initSteps(); }

        initSteps();
    </script>
</body>
</html>
