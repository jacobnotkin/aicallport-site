<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">

    <style>
        body { 
            background: #06080f; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden; width: 100vw;
        }

        .main-card {
            width: 92%; max-width: 500px; margin: 20px auto;
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .orange-btn {
            background: #f97316; color: #000; font-weight: 800;
            padding: 15px; border-radius: 12px; width: 100%;
            text-transform: uppercase; border: none; font-size: 12px;
        }

        .step-box {
            background: rgba(255,255,255,0.05); border-radius: 10px;
            padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .step-active { border-color: #f97316; background: rgba(249, 115, 22, 0.1); }

        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; align-items: center; justify-content: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="text-center mb-6">
            <h2 class="text-orange-500 font-black italic uppercase text-xl">AI CALL PORT</h2>
            <p class="text-slate-500 text-[10px] uppercase font-bold tracking-widest">Mobile Console v1.0</p>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black italic uppercase leading-none mb-2">Neural <span class="text-orange-500">Voice</span></h1>
            <p class="text-slate-400 text-xs mb-6">Automated voice agents for your industry.</p>
            <button onclick="openModal(1)" class="orange-btn">Start Setup</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div id="s1" class="step-box step-active">
                <div class="text-[8px] text-orange-500 font-black">STEP 1</div>
                <div id="v1" class="text-[10px] font-bold">MARKET</div>
            </div>
            <div id="s2" class="step-box">
                <div class="text-[8px] text-orange-500 font-black">STEP 2</div>
                <div id="v2" class="text-[10px] font-bold">INDUSTRY</div>
            </div>
            <div id="s3" class="step-box">
                <div class="text-[8px] text-orange-500 font-black">STEP 3</div>
                <div id="v3" class="text-[10px] font-bold">NAME</div>
            </div>
            <div id="s4" class="step-box">
                <div class="text-[8px] text-orange-500 font-black">STEP 4</div>
                <div id="v5" class="text-[10px] font-bold">DEMO</div>
            </div>
        </div>

        <div class="bg-black/50 p-6 rounded-2xl border border-orange-500/20 text-center">
            <div class="text-2xl font-black mb-1">$199<span class="text-xs text-slate-500">/mo</span></div>
            <div id="timer" class="text-sm font-mono text-orange-500/50 mb-4">23:59:59</div>
            <button onclick="window.open('https://buy.stripe.com/8x24gA9TB9Vab160h43ks01')" class="w-full bg-white text-black py-3 rounded-lg font-black text-[10px] uppercase">Reserve Port</button>
        </div>
    </div>

    <div id="modal">
        <div class="w-[85%] max-w-sm bg-[#111] p-8 rounded-3xl border border-white/10 text-center">
            <h3 id="mTitle" class="text-lg font-black uppercase mb-6"></h3>
            <div id="mContent" class="space-y-3"></div>
            <button onclick="closeModal()" class="mt-6 text-[10px] text-slate-500 font-black uppercase">Close</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { 
            "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", 
            "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c" 
        };
        let selectedIndustry = "";

        function openModal(step) {
            const m = document.getElementById('modal');
            const t = document.getElementById('mTitle');
            const c = document.getElementById('mContent');
            m.style.display = 'flex';
            c.innerHTML = "";

            if(step === 1) {
                t.innerText = "Select Market";
                ["USA", "UK"].forEach(opt => {
                    const b = document.createElement('button');
                    b.className = "w-full p-4 bg-white/5 border border-white/10 rounded-xl font-bold text-xs";
                    b.innerText = opt;
                    b.onclick = () => { finish(1, opt); openModal(2); };
                    c.appendChild(b);
                });
            } else if(step === 2) {
                t.innerText = "Industry";
                Object.keys(assistants).forEach(opt => {
                    const b = document.createElement('button');
                    b.className = "w-full p-4 bg-white/5 border border-white/10 rounded-xl font-bold text-xs";
                    b.innerText = opt;
                    b.onclick = () => { selectedIndustry = opt; finish(2, opt); openModal(3); };
                    c.appendChild(b);
                });
            } else if(step === 3) {
                t.innerText = "Business Name";
                c.innerHTML = `<input id="biz" class="w-full p-4 bg-white/5 rounded-xl text-center mb-4" placeholder="Name"><button id="saveBiz" class="orange-btn">Continue</button>`;
                document.getElementById('saveBiz').onclick = () => { finish(3, document.getElementById('biz').value); openModal(4); };
            } else if(step === 4) {
                t.innerText = "Start Demo";
                const b = document.createElement('button');
                b.className = "orange-btn";
                b.innerText = "Talk to AI Now";
                b.onclick = () => startCall();
                c.appendChild(b);
            }
        }

        function finish(s, val) {
            document.getElementById(`v${s}`).innerText = val;
            document.getElementById(`s${s}`).classList.add('step-active');
            if(s < 4) document.getElementById(`s${s+1}`).classList.add('step-active');
        }

        async function startCall() {
            try {
                // Ensure browser allows audio
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    const ctx = new AudioContext();
                    if (ctx.state === 'suspended') await ctx.resume();
                }
                
                // Request Mic
                await navigator.mediaDevices.getUserMedia({ audio: true });

                if (window.vapiSDK) {
                    window.vapiSDK.run({
                        apiKey: vapiApiKey,
                        assistant: assistants[selectedIndustry] || "7a2fbe45-b54b-4375-aa1f-111be3f1501a"
                    });
                    closeModal();
                } else {
                    alert("System syncing... Tap again in 1 second.");
                }
            } catch (e) {
                alert("Microphone access denied. Please use HTTPS.");
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        setInterval(() => {
            const n = new Date();
            document.getElementById('timer').innerText = `${23-n.getHours()}:${59-n.getMinutes()}:${59-n.getSeconds()}`;
        }, 1000);
    </script>
</body>
</html>
