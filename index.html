<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | Global Activation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --orange: #f97316; --bg: #06080f; --panel: rgba(10, 12, 18, 0.95); }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }
        .console-border { border: 1px solid rgba(255, 255, 255, 0.05); background: var(--panel); backdrop-filter: blur(12px); }
        .step-hidden { display: none; }
        .glow-orange { box-shadow: 0 0 20px rgba(249, 115, 22, 0.2); }
        .success-glow { box-shadow: 0 0 30px rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.3); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main id="main-console" class="w-full max-w-xl console-border rounded-3xl p-8 relative overflow-hidden">
        
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-[10px] font-black tracking-[0.2em] text-orange-500 uppercase">System Status</h2>
                <p class="text-xs font-bold text-white uppercase tracking-wider">Ready for Deployment</p>
            </div>
            <div class="text-right">
                <h2 class="text-[10px] font-black tracking-[0.2em] text-slate-500 uppercase">Node</h2>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Global-01</p>
            </div>
        </div>

        <div id="activation-flow">
            <section id="step-1">
                <h1 class="text-2xl font-black text-white mb-6 uppercase italic">01. Select Market</h1>
                <div class="grid grid-cols-2 gap-3 mb-8">
                    <button onclick="nextStep(2)" class="p-4 border border-white/10 rounded-xl hover:border-orange-500/50 transition bg-white/5 text-sm font-bold text-left uppercase tracking-tighter">United States (USD)</button>
                    <button onclick="nextStep(2)" class="p-4 border border-white/10 rounded-xl hover:border-orange-500/50 transition bg-white/5 text-sm font-bold text-left uppercase tracking-tighter">United Kingdom (GBP)</button>
                </div>
            </section>

            <section id="step-2" class="step-hidden">
                <h1 class="text-2xl font-black text-white mb-6 uppercase italic">02. Industry Domain</h1>
                <div class="space-y-3 mb-8">
                    <button onclick="nextStep(3)" class="w-full p-4 border border-white/10 rounded-xl hover:border-orange-500/50 transition bg-white/5 text-sm font-bold uppercase text-left tracking-widest">Medical / Health</button>
                    <button onclick="nextStep(3)" class="w-full p-4 border border-white/10 rounded-xl hover:border-orange-500/50 transition bg-white/5 text-sm font-bold uppercase text-left tracking-widest">Home Services (HVAC/Plumbing)</button>
                </div>
            </section>

            <section id="step-3" class="step-hidden text-center">
                <h1 class="text-2xl font-black text-white mb-4 uppercase italic">03. Secure Terminal</h1>
                <p class="text-slate-400 text-xs mb-8 font-bold">ESTABLISHING ENCRYPTED BRIDGE TO STRIPE...</p>
                <button onclick="triggerSuccess()" class="w-full bg-orange-500 hover:bg-orange-600 p-5 rounded-2xl text-white font-black uppercase tracking-[0.2em] text-xs transition glow-orange">Initialize Deployment ($49/mo)</button>
            </section>
        </div>
    </main>

    <main id="success-console" class="w-full max-w-md console-border rounded-3xl p-10 text-center step-hidden success-glow">
        <div class="w-20 h-20 bg-green-500/10 border-2 border-green-500/30 rounded-full flex items-center justify-center mx-auto mb-8 text-green-500">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        
        <h1 class="text-3xl font-black uppercase tracking-tight text-white mb-2">SYSTEM <span class="text-green-500">LIVE</span></h1>
        <p class="text-slate-400 text-sm mb-8 font-bold italic tracking-wide">Protocol Activated Successfully.</p>

        <div class="bg-orange-500/10 border border-orange-500/30 rounded-2xl p-6 mb-8">
            <p class="text-[9px] font-black uppercase text-orange-400 mb-2 tracking-widest">DEDICATED AI NUMBER</p>
            <p id="ai-number" class="text-2xl font-black text-white tracking-widest">+1 (888) 091-AI26</p>
        </div>

        <a href="#" class="block w-full bg-white/5 border border-white/10 hover:bg-white/10 p-4 rounded-xl text-white font-black text-[10px] tracking-[0.3em] transition">ENTER DASHBOARD</a>
    </main>

    <script>
        function nextStep(step) {
            // Hide all steps
            document.querySelectorAll('section').forEach(s => s.classList.add('step-hidden'));
            // Show specific step
            document.getElementById(`step-${step}`).classList.remove('step-hidden');
        }

        function triggerSuccess() {
            // Transition from Main Console to Success Console
            document.getElementById('main-console').classList.add('step-hidden');
            document.getElementById('success-console').classList.remove('step-hidden');
            
            // Logic to fetch real number can be triggered here
            console.log("Payment Verified. AI Agent Provisioning started.");
        }
    </script>
</body>
</html>
