<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Call Port — System Configuration</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
--bg-1: #050816;
--bg-2: #0a1028;
--bg-3: #121b3f;
--line: rgba(255,255,255,0.08);
--line-strong: rgba(255,255,255,0.18);
--text: #f8fbff;
--muted: rgba(224,231,255,0.72);
--accent: #4f7cff;
--accent-2: #8b5cf6;
--accent-3: #2dd4bf;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
margin: 0;
overflow: hidden;
color: var(--text);
font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
background:
radial-gradient(circle at 20% 20%, rgba(79,124,255,0.14), transparent 24%),
radial-gradient(circle at 78% 22%, rgba(139,92,246,0.12), transparent 20%),
radial-gradient(circle at 50% 80%, rgba(45,212,191,0.08), transparent 24%),
linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 32%, var(--bg-1) 100%);
}

.bg-grid,
.bg-orb,
.bg-stars {
position: fixed;
inset: 0;
pointer-events: none;
}

.bg-grid {
background:
linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
background-size: 44px 44px;
mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
opacity: .5;
}

.bg-orb::before,
.bg-orb::after {
content: "";
position: absolute;
border-radius: 9999px;
filter: blur(80px);
opacity: .34;
animation: drift 14s ease-in-out infinite alternate;
}

.bg-orb::before {
width: 360px;
height: 360px;
left: -80px;
top: 8%;
background: rgba(79,124,255,.22);
}

.bg-orb::after {
width: 300px;
height: 300px;
right: -40px;
top: 14%;
background: rgba(139,92,246,.18);
animation-delay: 1.8s;
}

.bg-stars span {
position: absolute;
width: 2px;
height: 2px;
border-radius: 999px;
background: rgba(255,255,255,.45);
box-shadow: 0 0 10px rgba(255,255,255,.45);
animation: twinkle 3.8s ease-in-out infinite;
}

.shell {
position: relative;
z-index: 1;
min-height: 100vh;
display: flex;
flex-direction: column;
padding: 22px 28px 28px;
}

.topbar {
display: flex;
align-items: center;
justify-content: space-between;
gap: 20px;
margin-bottom: 10px;
}

.brand {
display: inline-flex;
align-items: center;
gap: 10px;
font-size: 15px;
font-weight: 700;
letter-spacing: -.03em;
color: rgba(240,247,255,.96);
}

.brand-mark {
width: 28px;
height: 28px;
border-radius: 10px;
background: linear-gradient(180deg, #8ec5ff 0%, #4f7cff 100%);
box-shadow: 0 8px 24px rgba(79,124,255,.35);
}

.progress-wrap {
display: flex;
align-items: center;
gap: 14px;
min-width: 210px;
justify-content: flex-end;
}

.progress-text {
font-size: 12px;
color: rgba(224,231,255,.78);
letter-spacing: .02em;
white-space: nowrap;
}

.progress-bar {
position: relative;
width: 160px;
height: 8px;
border-radius: 999px;
background: rgba(255,255,255,.07);
overflow: hidden;
border: 1px solid rgba(255,255,255,.06);
}

.progress-fill {
position: absolute;
inset: 0 auto 0 0;
width: 33.33%;
border-radius: inherit;
background: linear-gradient(90deg, #4f7cff 0%, #7c6bff 52%, #8b5cf6 100%);
box-shadow: 0 0 24px rgba(79,124,255,.42);
transition: width .45s cubic-bezier(.22,.8,.24,1);
}

.main {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
position: relative;
}

.question-panel {
width: min(760px, 100%);
text-align: center;
padding: 34px 24px 18px;
animation: fadeUp .55s cubic-bezier(.22,.8,.24,1);
}

.eyebrow {
display: inline-flex;
align-items: center;
justify-content: center;
min-height: 34px;
padding: 0 14px;
border-radius: 999px;
border: 1px solid rgba(255,255,255,.10);
background: rgba(255,255,255,.04);
color: rgba(224,231,255,.82);
font-size: 11px;
letter-spacing: .14em;
text-transform: uppercase;
margin-bottom: 18px;
}

.title {
margin: 0;
font-size: clamp(40px, 5.6vw, 68px);
line-height: .96;
font-weight: 700;
letter-spacing: -.06em;
text-wrap: balance;
}

.subtitle {
margin: 16px auto 0;
max-width: 540px;
color: var(--muted);
font-size: clamp(15px, 1.35vw, 20px);
line-height: 1.65;
text-wrap: balance;
}

.input-zone {
width: min(540px, 100%);
margin: 34px auto 0;
position: relative;
}

.input-glow {
position: absolute;
inset: -10px;
border-radius: 28px;
background: radial-gradient(circle at center, rgba(79,124,255,.22), transparent 58%);
filter: blur(24px);
opacity: .55;
pointer-events: none;
}

.premium-input {
position: relative;
width: 100%;
height: 68px;
padding: 0 22px;
border-radius: 22px;
outline: none;
border: 1px solid rgba(255,255,255,.12);
background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.045));
color: #fff;
font-size: 17px;
box-shadow:
inset 0 1px 0 rgba(255,255,255,.06),
0 20px 40px rgba(0,0,0,.22);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
transition: border-color .22s ease, box-shadow .22s ease, transform .22s ease;
}

.premium-input::placeholder {
color: rgba(224,231,255,.42);
}

.premium-input:focus {
border-color: rgba(111,157,255,.78);
box-shadow:
inset 0 1px 0 rgba(255,255,255,.08),
0 0 0 4px rgba(79,124,255,.12),
0 28px 56px rgba(9,17,40,.34);
transform: translateY(-1px);
}

.hint {
margin-top: 14px;
color: rgba(224,231,255,.48);
font-size: 13px;
line-height: 1.5;
}

.footer {
display: flex;
justify-content: center;
padding-top: 8px;
}

.cta {
min-width: 164px;
height: 56px;
border: 0;
border-radius: 18px;
color: white;
font-size: 16px;
font-weight: 600;
letter-spacing: -.02em;
background: linear-gradient(180deg, #5e89ff 0%, #3c63ff 100%);
box-shadow: 0 18px 44px rgba(60,99,255,.34);
transition: transform .22s ease, box-shadow .22s ease, opacity .22s ease;
cursor: pointer;
}

.cta:hover:not(:disabled) {
transform: translateY(-1px);
box-shadow: 0 22px 52px rgba(60,99,255,.42);
}

.cta:disabled {
opacity: .38;
cursor: not-allowed;
box-shadow: none;
}

.micro-status {
position: absolute;
left: 50%;
bottom: 96px;
transform: translateX(-50%);
display: inline-flex;
align-items: center;
gap: 10px;
padding: 10px 14px;
border-radius: 999px;
border: 1px solid rgba(255,255,255,.08);
background: rgba(255,255,255,.045);
color: rgba(224,231,255,.72);
font-size: 13px;
backdrop-filter: blur(18px);
-webkit-backdrop-filter: blur(18px);
}

.pulse-dot {
width: 8px;
height: 8px;
border-radius: 999px;
background: #2dd4bf;
box-shadow: 0 0 18px rgba(45,212,191,.8);
animation: pulse 2s ease-in-out infinite;
}

@keyframes fadeUp {
from { opacity: 0; transform: translateY(14px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes drift {
0% { transform: translate3d(0, 0, 0) scale(1); }
100% { transform: translate3d(20px, -12px, 0) scale(1.08); }
}

@keyframes twinkle {
0%, 100% { opacity: .22; transform: scale(1); }
50% { opacity: .85; transform: scale(1.55); }
}

@keyframes pulse {
0%, 100% { transform: scale(1); opacity: .85; }
50% { transform: scale(1.4); opacity: 1; }
}

@media (max-width: 640px) {
.shell { padding: 18px 16px 22px; }
.topbar { margin-bottom: 0; }
.progress-wrap { min-width: auto; gap: 10px; }
.progress-bar { width: 110px; }
.question-panel { padding-inline: 6px; }
.input-zone { margin-top: 28px; }
.premium-input { height: 60px; font-size: 16px; border-radius: 18px; }
.cta { width: 100%; max-width: 320px; }
.micro-status { bottom: 88px; width: calc(100% - 32px); justify-content: center; }
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-orb"></div>
<div class="bg-stars" aria-hidden="true">
<span style="left:18%; top:20%; animation-delay:.2s"></span>
<span style="left:29%; top:28%; animation-delay:1.1s"></span>
<span style="left:38%; top:18%; animation-delay:2.2s"></span>
<span style="left:60%; top:26%; animation-delay:.8s"></span>
<span style="left:73%; top:20%; animation-delay:1.9s"></span>
<span style="left:81%; top:34%; animation-delay:2.8s"></span>
<span style="left:48%; top:70%; animation-delay:1.5s"></span>
<span style="left:65%; top:78%; animation-delay:2.4s"></span>
</div>

<div class="shell">
<header class="topbar">
<div class="brand">
<span class="brand-mark"></span>
<span>AI Call Port</span>
</div>
<div class="progress-wrap">
<span class="progress-text">Step 1 of 3</span>
<div class="progress-bar" aria-hidden="true">
<div class="progress-fill"></div>
</div>
</div>
</header>

<main class="main">
<section class="question-panel">
<div class="eyebrow">System configuration</div>
<h1 class="title">What is your company name?</h1>
<p class="subtitle">We’ll build your AI system around your business, workflow, and call volume.</p>

<div class="input-zone">
<div class="input-glow"></div>
<input class="premium-input" type="text" placeholder="Enter company name" autofocus />
<div class="hint">This will be used to generate your business-specific call flow and CRM structure.</div>
</div>
</section>

<div class="micro-status">
<span class="pulse-dot"></span>
<span>Preparing your system configuration flow</span>
</div>
</main>

<footer class="footer">
<button class="cta">Continue</button>
</footer>
</div>
</body>
</html>
