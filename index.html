<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CALL PORT | Global Receptionist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --dark-bg: #0a0a0c;
        }
        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }
        .industry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="text-center mb-16">
        <h1 class="text-5xl font-black tracking-tighter mb-4 neon-text">AI CALL PORT</h1>
        <p class="text-gray-400 text-lg">The 24/7 Global Receptionist for Modern Business</p>
    </header>

    <section class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold italic">SELECT INDUSTRY</h2>
            <div class="flex gap-4">
                <button onclick="changeLanguage('EN')" class="text-xs border border-white/20 px-2 py-1 rounded hover:bg-white hover:text-black transition">EN</button>
                <button onclick="changeLanguage('ES')" class="text-xs border border-white/20 px-2 py-1 rounded hover:bg-white hover:text-black transition">ES</button>
            </div>
        </div>

        <div id="industry-container" class="industry-grid">
            </div>
    </section>

    <div id="vapi-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
        <div class="glass-card p-8 max-w-lg w-full text-center">
            <div id="modal-icon" class="text-5xl mb-4 text-cyan-400"></div>
            <h3 id="modal-title" class="text-2xl font-bold mb-2"></h3>
            <p id="modal-script" class="text-gray-300 italic mb-6"></p>
            <button onclick="toggleModal()" class="bg-white text-black font-bold py-3 px-8 rounded-full hover:bg-cyan-400 transition">CLOSE DEMO</button>
        </div>
    </div>

    <script>
        const industries = [
            {
                id: "hvac",
                name: "HVAC & Plumbing",
                icon: "fa-tools",
                script: "Hello! This is the emergency service line. Do you have a leak or is your AC out?",
                description: "Handles emergency dispatch and appointment scheduling."
            },
            {
                id: "legal",
                name: "Law Firms",
                icon: "fa-gavel",
                script: "Thank you for calling. Are you a new client looking for a consultation?",
                description: "Intake screening and calendar management for attorneys."
            },
            {
                id: "medical",
                name: "Dental & Medical",
                icon: "fa-tooth",
                script: "Hi there! Would you like to schedule a cleaning or a follow-up visit?",
                description: "HIPAA-compliant appointment booking and reminders."
            },
            {
                id: "realestate",
                name: "Real Estate",
                icon: "fa-home",
                script: "Hello! Are you calling about the property on Main Street?",
                description: "Lead qualification and property viewing bookings."
            },
            {
                id: "salon",
                name: "Beauty & Salons",
                icon: "fa-scissors",
                script: "Hi! Looking to book a cut, color, or a quick trim today?",
                description: "Managing high-volume bookings and late-arrival calls."
            },
            {
                id: "restaurant",
                name: "Restaurants",
                icon: "fa-utensils",
                script: "Welcome! Would you like to make a reservation for tonight?",
                description: "Handling table bookings and common FAQ (menu, hours)."
            },
            {
                id: "fitness",
                name: "Gyms & Trainers",
                icon: "fa-dumbbell",
                script: "Hey! Want to sign up for a trial session or check class times?",
                description: "Membership inquiries and personal training schedules."
            },
            {
                id: "towing",
                name: "Towing & Auto",
                icon: "fa-truck-pickup",
                script: "Emergency Roadside. Please tell me your location and vehicle model.",
                description: "Rapid data collection for dispatch and logistics."
            }
        ];

        function renderIndustries() {
            const container = document.getElementById('industry-container');
            container.innerHTML = industries.map(ind => `
                <div class="glass-card p-6 cursor-pointer group" onclick="openDemo('${ind.id}')">
                    <div class="flex justify-between items-start mb-4">
                        <i class="fas ${ind.icon} text-3xl text-gray-500 group-hover:text-cyan-400 transition"></i>
                        <span class="text-[10px] uppercase tracking-widest text-gray-500">Industry Module</span>
                    </div>
                    <h3 class="text-xl font-bold mb-2">${ind.name}</h3>
                    <p class="text-sm text-gray-400 mb-4">${ind.description}</p>
                    <div class="text-xs font-mono text-cyan-400 opacity-0 group-hover:opacity-100 transition">
                        RUN_VAPI_STIMULATION >
                    </div>
                </div>
            `).join('');
        }

        function openDemo(id) {
            const ind = industries.find(i => i.id === id);
            document.getElementById('modal-title').innerText = ind.name;
            document.getElementById('modal-script').innerText = `"${ind.script}"`;
            document.getElementById('modal-icon').innerHTML = `<i class="fas ${ind.icon}"></i>`;
            toggleModal();
        }

        function toggleModal() {
            const modal = document.getElementById('vapi-modal');
            modal.classList.toggle('hidden');
        }

        function changeLanguage(lang) {
            alert("Switching system language to: " + lang + ". This will update the Vapi Voice Prompt.");
            // Logic to update Vapi voice ID or System Prompt goes here
        }

        // Initialize the site
        renderIndustries();

    </script>
</body>
</html>
