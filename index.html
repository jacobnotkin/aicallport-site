<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | BETA Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; margin: 0; overflow-x: hidden; display: flex; flex-direction: column;
        }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Console styling restored exactly */
        .console-container {
            width: 95%; max-width: 1100px; margin: 40px auto; background: rgba(10, 12, 18, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px; 
            padding: 30px; position: relative; z-index: 10;
        }

        .system-log {
            position: absolute; top: -20px; left: 50%; transform: translateX(-50%);
            width: 280px; background: rgba(15, 23, 42, 0.9); border: 1px solid #f97316;
            border-radius: 12px; padding: 10px; font-family: monospace; font-size: 9px; z-index: 20;
        }

        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); font-weight: 800; border: none; cursor: pointer; }
        
        .step-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px; border-radius: 20px; transition: 0.3s; opacity: 0.4;
        }
        .step-card.unlocked { opacity: 1; border-color: rgba(255, 255, 255, 0.2); }
        .step-card.active { border-color: #f97316; background: rgba(249, 115, 22, 0.1); }

        /* THE FIX: Absolute Bottom Constraints */
        .bottom-anchor-zone {
            margin-top: auto;
            width: 100%;
            height: 120px; /* Space for the button to live */
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            z-index: 50;
        }

        .ticker-bar {
            width: 100%; height: 45px; background: #000;
            border-top: 1px solid rgba(249, 115, 22, 0.3);
            display: flex; align-items: center; overflow: hidden;
        }
        .ticker-content { display: flex; white-space: nowrap; animation: marquee 50s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* Force the Vapi Button Widget to stay in our Basement Zone */
        #vapi-support-btn, [class*="vapi-btn"] {
            position: fixed !important;
            bottom: 60px !important; /* Above the ticker */
            left: 50% !important;
            transform: translateX(-50%) !important;
            top: auto !important;
            right: auto !important;
            z-index: 99999 !important;
        }

        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="console-container">
        <div class="system-log" id="logBox">
            <div class="flex justify-between text-orange-500 font-bold uppercase mb-1">
                <span>Neural Terminal</span>
                <span class="animate-pulse">Active</span>
            </div>
            <div id="logContent" class="text-slate-400">
                <div>> SYSTEM CALIBRATED</div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-center mb-10 mt-6 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl md:text-6xl font-black italic uppercase leading-none">
                    NEURAL <br><span class="text-orange-500">RECEPTIONIST</span>
                </h1>
                <button onclick="handleStep(1)" class="orange-btn px-8 py-4 rounded-2xl text-[10px] uppercase tracking-widest mt-6">Begin Activation</button>
            </div>

            <div class="w-full md:w-80 bg-black/60 border border-orange-500/30 rounded-[30px] p-8 text-center">
                <span class="text-slate-500 line-through text-xs">$399 Regular</span>
                <div class="text-5xl font-black text-white">$199<span class="text-sm text-orange-500">/mo</span></div>
                <div id="timer" class="text-xs font-mono text-white/30 mt-2 mb-6">00:00:00</div>
                <button onclick="handleStep(6)" class="orange-btn w-full py-3 rounded-xl text-[10px] uppercase">Instant Activation</button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
            <div id="s1" class="step-card unlocked" onclick="handleStep(1)"><p class="text-[7px] font-black text-orange-500">01 MARKET</p><p id="v1" class="text-[9px] font-bold uppercase mt-1">USA</p></div>
            <div id="s2" class="step-card unlocked" onclick="handleStep(2)"><p class="text-[7px] font-black text-orange-500">02 INDUSTRY</p><p id="v2" class="text-[9px] font-bold uppercase mt-1">Select</p></div>
            <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[7px] font-black text-orange-500">03 NAME</p><p id="v3" class="text-[9px] font-bold uppercase mt-1">Sync</p></div>
            <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[7px] font-black text-orange-500">04 ROLE</p><p id="v4" class="text-[9px] font-bold uppercase mt-1">Choose</p></div>
            <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[7px] font-black text-orange-500">05 DEMO</p><p id="v5" class="text-[9px] font-bold uppercase mt-1">Sandbox</p></div>
            <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[7px] font-black text-orange-500">06 PIPELINE</p><p id="v6" class="text-[9px] font-bold uppercase mt-1">Activate</p></div>
        </div>
    </div>

    <div class="bottom-anchor-zone">
        <div class="ticker-bar">
            <div class="ticker-content" id="ticker"></div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-10 rounded-[40px] max-w-sm w-full text-center">
            <h2 id="mTitle" class="text-xl font-black uppercase text-white mb-6">Setup</h2>
            <div id="mContent" class="grid gap-3"></div>
            <button onclick="closeModal()" class="mt-6 text-[10px] text-slate-500 uppercase font-black">Back</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let currentIndustry = "Electrical";

        function handleStep(s) { triggerModal(s); }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }

        function triggerModal(step) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";
            if(step === 5) {
                t.innerText = "Sandbox Test";
                const b = document.createElement('button');
                b.className = "orange-btn w-full py-4 rounded-xl text-[10px] uppercase";
                b.innerText = "Initialize Voice Link";
                b.onclick = runVoice;
                c.appendChild(b);
            } else {
                t.innerText = "Step " + step;
                c.innerHTML = `<p class="text-slate-400 text-xs">Configure your agent parameters here.</p>`;
            }
        }
        
        async function runVoice() { 
            closeModal();
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) {
                    window.vapiSDK.run({ apiKey: vapiApiKey, assistant: assistants[currentIndustry] });
                    // Force the button into view
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }
            } catch(e) { console.log(e); }
        }

        function updateParallax(e) {
            document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%');
            document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%');
        }

        let tickerHtml = "";
        for(let i=0; i<10; i++) tickerHtml += `<span class="px-10 text-[9px] font-black text-orange-500 uppercase italic"> ⚡ SYSTEM ONLINE ⚡ DEPLOYMENT READY </span>`;
        document.getElementById('ticker').innerHTML = tickerHtml + tickerHtml;

        setInterval(() => {
            const now = new Date();
            document.getElementById('timer').textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
