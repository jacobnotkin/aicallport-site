<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | BETA Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; 
            min-height: 100vh; margin: 0; padding-bottom: 120px; /* SPACE FOR BUTTON */
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.1) 0%, transparent 70%);
        }

        .console-container {
            width: 95%; max-width: 1100px; margin: 20px auto; 
            background: rgba(10, 12, 18, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 32px; 
            padding: 24px; position: relative; z-index: 10;
        }

        /* FORCE VAPI BUTTON TO THE VERY FRONT */
        #vapi-support-btn, [class*="vapi-btn"], .vapi-btn-is-active {
            position: fixed !important;
            bottom: 40px !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            z-index: 999999 !important; /* Higher than everything else */
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); font-weight: 800; }
        
        .step-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px; border-radius: 16px; opacity: 0.5;
        }
        .step-card.active { border-color: #f97316; background: rgba(249, 115, 22, 0.1); opacity: 1; }

        .ticker-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 30px;
            background: #000; border-top: 1px solid #f97316; z-index: 100;
        }

        /* Neural Terminal moved to avoid any collision */
        .system-log {
            width: 90%; margin: 0 auto 15px; background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(249, 115, 22, 0.3); border-radius: 12px; padding: 10px;
            font-family: monospace; font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="system-log">
        <div class="text-orange-500 font-bold uppercase">Neural Terminal: <span class="text-white">Active</span></div>
        <div class="text-slate-400">> UI LAYERS CALIBRATED</div>
    </div>

    <div class="console-container">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-black italic uppercase text-white">NEURAL <span class="text-orange-500">RECEPTIONIST</span></h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Mobile Console V1.1</p>
        </div>

        <button onclick="handleStep(1)" class="orange-btn w-full py-4 rounded-2xl text-xs uppercase mb-8">Start Activation</button>

        <div class="bg-black/50 border border-white/10 rounded-3xl p-8 text-center mb-8">
            <div class="text-4xl font-black text-white">$199<span class="text-sm text-orange-500">/mo</span></div>
            <div id="timer" class="text-xs font-mono text-slate-500 mt-1 mb-4">00:00:00</div>
            <button onclick="handleStep(6)" class="w-full py-3 bg-white text-black font-black rounded-xl text-[10px] uppercase">Reserve Now</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div id="s1" class="step-card active"><p class="text-[8px] font-black text-orange-500">01 MARKET</p><p class="text-[10px] font-bold text-white">USA</p></div>
            <div id="s2" class="step-card active"><p class="text-[8px] font-black text-orange-500">02 INDUSTRY</p><p class="text-[10px] font-bold text-white">ELECTRICAL</p></div>
            <div id="s3" class="step-card active"><p class="text-[8px] font-black text-orange-500">03 NAME</p><p class="text-[10px] font-bold text-white">READY</p></div>
            <div id="s4" class="step-card active" onclick="handleStep(5)"><p class="text-[8px] font-black text-orange-500">04 DEMO</p><p class="text-[10px] font-bold text-white">START CALL</p></div>
        </div>
    </div>

    <div class="ticker-bar"></div>

    <div id="setupModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; display:none; align-items:center; justify-content:center;">
        <div class="bg-[#0f172a] p-10 rounded-[32px] text-center border border-white/10">
            <h2 class="text-white font-black mb-6">INITIALIZE VOICE</h2>
            <button onclick="runVoice()" class="orange-btn px-10 py-4 rounded-xl text-xs">START DEMO</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        function handleStep(s) { document.getElementById('setupModal').style.display = 'flex'; }
        
        async function runVoice() { 
            document.getElementById('setupModal').style.display = 'none';
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) {
                    window.vapiSDK.run({ apiKey: vapiApiKey, assistant: "7a2fbe45-b54b-4375-aa1f-111be3f1501a" });
                    // Scroll down to the button area automatically
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }
            } catch(e) { alert("Microphone access is required for the demo."); }
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('timer').textContent = now.toTimeString().split(' ')[0];
        }, 1000);

        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
