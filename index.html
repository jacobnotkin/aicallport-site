<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CALL PORT | Operator Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* FORCE SINGLE COLUMN - Stops the layout from doubling */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            background: #06080f; 
            color: #e2e8f0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; 
            padding: 0; 
            width: 100%;
            overflow-x: hidden;
            display: block !important; /* Block prevents flex-side-by-side bugs */
        }

        body { padding: 12px; min-height: 100vh; }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 30%, rgba(249, 115, 22, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Main Shell */
        .console-wrap {
            width: 100%;
            max-width: 480px; /* Locked for mobile stability */
            margin: 0 auto;
            background: rgba(13, 17, 23, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 20px;
            position: relative;
            z-index: 10;
            margin-top: 10px;
        }

        @media (min-width: 1024px) {
            .console-wrap { max-width: 1000px; padding: 40px; }
        }

        .orange-btn { 
            background: linear-gradient(90deg, #f97316, #ea580c); 
            touch-action: manipulation;
            font-weight: 800;
            text-transform: uppercase;
            font-style: italic;
        }
        
        .step-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px; border-radius: 14px; opacity: 0.3;
            transition: all 0.3s;
        }
        .step-card.unlocked { opacity: 1; border-color: rgba(249, 115, 22, 0.3); }
        .step-card.active { border-color: #f97316; background: rgba(249, 115, 22, 0.1); transform: scale(1.02); }

        /* THE MODAL: Absolute Priority for Role Selection */
        #setupModal { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.98); 
            z-index: 999999; /* Forces it to the very front */
            display: none; 
            align-items: center; 
            justify-content: center; 
            padding: 15px;
        }
        
        .modal-box {
            background: #0f172a; 
            border: 2px solid rgba(249, 115, 22, 0.4); 
            padding: 24px; 
            border-radius: 32px; 
            width: 100%; 
            max-width: 340px; 
            text-align: center;
        }

        .role-option-btn {
            width: 100%;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 12px;
            margin-bottom: 10px;
            transition: background 0.2s;
        }
        .role-option-btn:active { background: #f97316; }

        /* Ticker */
        .ticker-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 35px;
            background: #06080f; border-top: 1px solid rgba(249, 115, 22, 0.2);
            z-index: 50; display: flex; align-items: center; overflow: hidden;
        }
        .ticker-content { display: flex; white-space: nowrap; animation: marquee 40s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="console-wrap">
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-2">
                <div class="px-2 py-0.5 bg-orange-500 rounded text-[9px] font-black text-black">BETA</div>
                <span class="font-black italic text-base uppercase">AI CALL <span class="text-orange-500">PORT</span></span>
            </div>
            <div class="animate-pulse text-[8px] text-orange-500 font-bold uppercase">System Live</div>
        </div>

        <div class="text-center lg:text-left mb-8">
            <h1 class="text-4xl lg:text-7xl font-black italic uppercase leading-[0.85] mb-4">
                <span class="text-white block">INSTANT</span>
                <span class="text-orange-500 block">AI OPERATOR</span>
            </h1>
            <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest mb-6">Autonomous Voice Infrastructure</p>
            <button id="mainActionBtn" onclick="handleStep(1)" class="orange-btn w-full lg:w-auto px-10 py-5 rounded-2xl text-[11px] tracking-tighter shadow-xl">Begin 6-Step Activation</button>
        </div>

        <div class="bg-black/40 border border-white/5 rounded-[30px] p-6 text-center mb-10">
            <div class="flex flex-col items-center">
                <span class="text-slate-600 line-through text-[10px] font-bold mb-1">$399 Regular</span>
                <div class="flex items-baseline gap-1">
                    <span class="text-5xl font-black text-white">$199</span>
                    <span class="text-orange-500 font-bold">/mo</span>
                </div>
                <div id="timer" class="mt-4 text-lg font-mono text-white/20">00:00:00</div>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-6 gap-2">
            <div id="s1" class="step-card unlocked" onclick="handleStep(1)"><p class="text-[7px] font-black text-orange-500">01 MARKET</p><p id="v1" class="text-[9px] text-white/30 font-bold uppercase truncate">Select</p></div>
            <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[7px] font-black text-orange-500">02 NICHE</p><p id="v2" class="text-[9px] text-white/30 font-bold uppercase truncate">Select</p></div>
            <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[7px] font-black text-orange-500">03 BRAND</p><p id="v3" class="text-[9px] text-white/30 font-bold uppercase truncate">Sync</p></div>
            <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[7px] font-black text-orange-500">04 ROLE</p><p id="v4" class="text-[9px] text-white/30 font-bold uppercase truncate">Choose</p></div>
            <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[7px] font-black text-orange-500">05 DEMO</p><p id="v5" class="text-[9px] text-white/30 font-bold uppercase truncate">Test</p></div>
            <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[7px] font-black text-orange-500">06 LAUNCH</p><p id="v6" class="text-[9px] text-white/30 font-bold uppercase truncate">Activate</p></div>
        </div>
    </div>

    <div class="ticker-bar"><div class="ticker-content" id="ticker"></div></div>

    <div id="setupModal">
        <div class="modal-box">
            <h2 id="mTitle" class="text-xs font-black uppercase text-white mb-6 tracking-widest">Configuration</h2>
            <div id="mContent"></div>
            <button onclick="closeModal()" class="mt-6 text-[8px] text-slate-500 uppercase font-black tracking-widest">← Back</button>
        </div>
    </div>

    <script>
        const stripeLink = "https://buy.stripe.com/8x24gA9TB9Vab160h43ks01";
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let completedSteps = 0; let currentIndustry = "";

        function handleStep(s) { if(s === 1 || completedSteps >= s-1) triggerModal(s); }

        function triggerModal(step) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";

            if(step === 1) {
                t.innerText = "Region";
                ["USA", "UK", "Canada"].forEach(l => createBtn(l, () => finish(1, l), c));
            } else if(step === 2) {
                t.innerText = "Industry";
                Object.keys(assistants).forEach(i => createBtn(i, () => { currentIndustry = i; finish(2, i); }, c));
            } else if(step === 3) {
                t.innerText = "Business Name";
                c.innerHTML = `<input id="bn" placeholder="ENTER NAME" class="w-full bg-white/5 border border-white/10 p-5 rounded-xl text-white mb-4 text-center font-black uppercase text-xs focus:border-orange-500 outline-none"><button onclick="saveB()" class="orange-btn w-full py-4 rounded-xl font-black text-[10px]">VERIFY</button>`;
            } else if(step === 4) {
                t.innerText = "Select Role";
                ["Receptionist", "Qualifier"].forEach(r => createBtn(r, () => finish(4, r), c));
            } else if(step === 5) {
                t.innerText = "Demo Console";
                createBtn("Initialize Audio", runVoice, c);
            } else if(step === 6) {
                t.innerText = "Launch Pipeline";
                createBtn("Pay & Activate", () => { 
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    finish(6, "ACTIVE");
                    setTimeout(() => window.open(stripeLink, '_blank'), 1500);
                }, c);
            }
        }

        function createBtn(txt, fn, cont) {
            const b = document.createElement('button');
            b.className = "role-option-btn";
            b.innerText = txt; b.onclick = fn; cont.appendChild(b);
        }

        function finish(s, v) {
            completedSteps = s;
            const el = document.getElementById(`v${s}`);
            el.innerText = v; el.classList.replace('text-white/30', 'text-white');
            document.getElementById(`s${s}`).classList.add('active');
            closeModal();
            if(s < 6) {
                document.getElementById(`s${s+1}`).classList.add('unlocked');
                document.getElementById('mainActionBtn').innerText = `Next: Step 0${s+1}`;
            }
        }

        function saveB() { const v = document.getElementById('bn').value; if(v) finish(3, v); }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        
        async function runVoice() { 
            const id = assistants[currentIndustry] || assistants["Electrical"];
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                if(window.vapiSDK) {
                    window.vapiSDK.run({ apiKey: vapiApiKey, assistant: id });
                    closeModal(); finish(5, "TESTING");
                }
            } catch(e) { alert("Mic required for demo."); }
        }

        let tickerHtml = "";
        for(let i=0; i<10; i++) tickerHtml += `<span class="px-10 text-[8px] font-black text-orange-500 italic"> ⚡ DEPLOYMENT READY </span>`;
        document.getElementById('ticker').innerHTML = tickerHtml + tickerHtml;

        setInterval(() => {
            const now = new Date();
            const h = 23 - now.getHours(); const m = 59 - now.getMinutes(); const s = 59 - now.getSeconds();
            document.getElementById('timer').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);

        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
