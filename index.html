<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | Global SMALL BUSINESS Activation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; } 
        html, body { width: 100%; min-height: 100vh; position: relative; background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; overflow-x: hidden; display: flex; flex-direction: column; }
        body { padding: 12px; }
        @media (min-width: 1024px) { body { padding: 24px; } }
        
        .bg-glow { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.15) 0%, transparent 50%); pointer-events: none; }
        .console-container { width: 100%; max-width: 1100px; background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px; position: relative; z-index: 10; margin: 0 auto 40px auto; }
        
        .hero-title { background: linear-gradient(180deg, #FFFFFF 30%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; transition: 0.2s; }
        .orange-btn:active { transform: scale(0.98); }
        
        .step-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 12px; opacity: 0.3; transition: 0.3s; cursor: pointer; }
        .step-card.active { border-color: #f97316 !important; background: rgba(249, 115, 22, 0.1) !important; opacity: 1 !important; }
        .next-focus { animation: border-glow 2s infinite ease-in-out !important; opacity: 1 !important; }
        
        @keyframes border-glow { 0%, 100% { border-color: rgba(249, 115, 22, 0.3); } 50% { border-color: #f97316; box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); } }
        
        .floating-lang { position: fixed; top: 15px; right: 15px; z-index: 1000; }
        .lang-trigger { background: rgba(10, 12, 18, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; backdrop-filter: blur(5px); }
        #langMenu { position: absolute; top: 50px; right: 0; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; display: none; flex-direction: column; gap: 8px; width: 220px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .search-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; color: white; font-size: 11px; outline: none; width: 100%; margin-bottom: 8px; }
        .modal-scroll { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        
        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 800; text-transform: uppercase; font-size: 9px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
        .modal-btn:hover:not(.disabled) { background: rgba(255,255,255,0.1); border-color: #f97316; }
        .modal-btn.disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="floating-lang">
        <button onclick="toggleLangMenu()" class="lang-trigger">
            <img id="curFlag" src="https://flagcdn.com/us.svg" class="w-4" alt="Flag">
            <span id="curLangText" class="text-[9px] font-black text-white uppercase">US | EN</span>
        </button>
        <div id="langMenu">
            <input type="text" id="langSearch" class="search-box" placeholder="SEARCH LANGUAGES..." onkeyup="filterList('langList', this.value)">
            <div class="modal-scroll" id="langList"></div>
        </div>
    </div>

    <div class="console-container">
        <div class="flex justify-between items-center mb-6 lg:mb-12">
            <div class="flex items-center gap-2">
                <span class="font-black italic text-base lg:text-xl uppercase text-white">AI CALL <span class="text-orange-500">PORT</span></span>
            </div>
            <div class="bg-orange-500/10 border border-orange-500/20 px-2 py-1 rounded-full flex items-center gap-1.5">
                <span id="live-label" class="text-[7px] font-black text-orange-500 uppercase tracking-widest">Global Live</span>
            </div>
        </div>

        <div class="grid lg:grid-cols-5 gap-6 lg:gap-12 items-center">
            <div class="lg:col-span-3 text-center lg:text-left">
                <h1 id="hero-h1" class="text-3xl lg:text-5xl font-black italic uppercase leading-tight mb-4 hero-title">GLOBAL ZERO-HUMAN<br> AI RECEPTIONIST</h1>
                <p id="hero-p" class="text-slate-400 text-[11px] lg:text-sm mb-6 max-w-xs mx-auto lg:mx-0 font-bold uppercase tracking-wider">Instant <span class="text-orange-500">SMALL BUSINESS</span> Activation.</p>
                <button onclick="handleStep(1)" id="hero-cta" class="orange-btn w-full lg:w-auto px-8 py-4 rounded-xl text-[10px] font-black uppercase tracking-widest italic">Start Activation</button>
            </div>
            
            <div class="lg:col-span-2">
                <div class="bg-black/50 border border-orange-500/30 rounded-3xl p-6 text-center">
                    <h3 id="beta-txt" class="text-[10px] uppercase mb-2 font-black text-orange-500 tracking-[0.2em]">BETA ACCESS</h3>
                    <div class="flex flex-col items-center mb-4">
                        <span id="reg-txt" class="text-slate-600 line-through text-xs font-bold">$399 Regular</span>
                        <div class="flex items-baseline gap-1">
                            <span id="main-currency" class="text-4xl lg:text-5xl font-black text-white">$</span>
                            <span id="main-price" class="text-4xl lg:text-5xl font-black text-white">199</span>
                            <span class="text-orange-500 font-bold">/mo</span>
                        </div>
                    </div>
                    <button onclick="handleStep(1)" id="side-cta" class="orange-btn w-full py-3 rounded-xl text-[10px] font-black uppercase italic">Activate Now</button>
                </div>
            </div>
        </div>

        <div class="mt-10 lg:mt-20">
            <div class="flex items-center justify-between mb-4 border-b border-white/5 pb-2">
                <span id="proto-label" class="text-[9px] font-black uppercase tracking-[0.2em] text-orange-500">Activation Protocol</span>
            </div>
            <div class="grid grid-cols-2 lg:grid-cols-6 gap-3">
                <div id="s1" class="step-card next-focus" onclick="handleStep(1)"><p class="text-[7px] font-black text-orange-500 uppercase step-label">01 Market</p><p id="v1" class="text-[9px] text-white/30 font-bold uppercase truncate val-label">Select</p></div>
                <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[7px] font-black text-orange-500 uppercase step-label">02 Industry</p><p id="v2" class="text-[9px] text-white/30 font-bold uppercase truncate val-label">Select</p></div>
                <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[7px] font-black text-orange-500 uppercase step-label">03 Business</p><p id="v3" class="text-[9px] text-white/30 font-bold uppercase truncate val-label">Sync</p></div>
                <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[7px] font-black text-orange-500 uppercase step-label">04 Role</p><p id="v4" class="text-[9px] text-white/30 font-bold uppercase truncate val-label">Choose</p></div>
                <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[7px] font-black text-orange-500 uppercase step-label">05 Demo</p><p id="v5" class="text-[9px] text-white/30 font-bold uppercase truncate italic val-label">Sandbox</p></div>
                <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[7px] font-black text-orange-500 uppercase step-label">06 Deploy</p><p id="v6" class="text-[9px] text-white/30 font-bold uppercase truncate italic val-label">Instant</p></div>
            </div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-6 rounded-3xl max-w-sm w-full text-center">
            <h2 id="mTitle" class="text-lg font-black uppercase text-white mb-6">Setup</h2>
            <div id="modalSearchContainer"></div>
            <div id="mContent" class="modal-scroll"></div>
            <button id="mClose" onclick="closeModal()" class="mt-6 text-[10px] text-slate-500 uppercase font-black hover:text-white">Close</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        let completedSteps = 0, currentLang = "EN", selectedMarket = "United States";

        const marketCurrency = {
            "United States": { cur: "$", price: "199", reg: "399", active: true },
            "Germany": { cur: "€", price: "185", reg: "370", active: true },
            "Mexico": { cur: "$", price: "---", reg: "---", active: false }
        };

        const languages = [{ id: 'EN', n: 'English', f: 'us' }, { id: 'ES', n: 'Español', f: 'mx' }, { id: 'FR', n: 'Français', f: 'fr' }];

        const i18n = {
            EN: { 
                h1: "GLOBAL ZERO-HUMAN<br> AI RECEPTIONIST", p: "Instant <span class='text-orange-500'>SMALL BUSINESS</span> Activation.", start: "Start Activation", now: "Activate Now", beta: "BETA ACCESS", reg: "Regular", live: "Global Live", 
                steps: ["01 Market", "02 Industry", "03 Business", "04 Role", "05 Demo", "06 Deploy"], 
                values: ["Select", "Select", "Sync", "Choose", "Sandbox", "Instant"], 
                modal: { close: "Close", searchM: "Search Countries...", searchI: "Search Industries...", placeholderB: "BUSINESS NAME", save: "SAVE", roles: ["Receptionist", "Sales Agent", "Support Agent"], demo: "START DEMO CALL", deploy: "GET MY NUMBER", comingSoon: "Coming Soon" }
            },
            ES: { 
                h1: "RECEPCIONISTA AI GLOBAL<br> SIN HUMANOS", p: "Activación Instantánea de <span class='text-orange-500'>NEGOCIOS</span>.", start: "Iniciar", now: "Activar", beta: "ACCESO BETA", reg: "Regular", live: "En Vivo", 
                steps: ["01 Mercado", "02 Industria", "03 Empresa", "04 Rol", "05 Demo", "06 Desplegar"], 
                values: ["Elegir", "Elegir", "Sinc", "Rol", "Sandbox", "Instante"], 
                modal: { close: "Cerrar", searchM: "Buscar Países...", searchI: "Buscar Industrias...", placeholderB: "NOMBRE DE EMPRESA", save: "GUARDAR", roles: ["Recepcionista", "Agente de Ventas", "Soporte"], demo: "INICIAR DEMO", deploy: "OBTENER NÚMERO", comingSoon: "Próximamente" }
            }
        };

        function setLang(cc, langCode) {
            currentLang = langCode; 
            const t = i18n[currentLang] || i18n.EN;
            
            document.getElementById('curFlag').src = `https://flagcdn.com/${cc}.svg`;
            document.getElementById('curLangText').innerText = `${cc.toUpperCase()} | ${currentLang}`;
            document.getElementById('hero-h1').innerHTML = t.h1 || i18n.EN.h1;
            document.getElementById('hero-p').innerHTML = t.p || i18n.EN.p;
            document.getElementById('hero-cta').innerText = t.start || i18n.EN.start;
            document.getElementById('side-cta').innerText = t.now || i18n.EN.now;
            document.getElementById('beta-txt').innerText = t.beta || i18n.EN.beta;
            document.getElementById('live-label').innerText = t.live || i18n.EN.live;
            document.getElementById('mClose').innerText = t.modal.close || i18n.EN.modal.close;

            document.querySelectorAll('.step-label').forEach((el, i) => { el.innerText = t.steps[i] || i18n.EN.steps[i]; });
            document.querySelectorAll('.val-label').forEach((el, i) => { if(completedSteps <= i) el.innerText = t.values[i] || i18n.EN.values[i]; });

            toggleLangMenu(false);
        }

        function triggerModal(step) {
            const m = document.getElementById('setupModal'), c = document.getElementById('mContent'), s = document.getElementById('modalSearchContainer'), t = document.getElementById('mTitle'), lang = i18n[currentLang] || i18n.EN;
            const def = i18n.EN; // Fallback
            m.style.display = 'flex'; c.innerHTML = ""; s.innerHTML = "";
            
            if(step === 3) {
                t.innerText = lang.steps[2] || def.steps[2];
                c.innerHTML = `<input id="bn" placeholder="${lang.modal.placeholderB || def.modal.placeholderB}" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl text-white mb-2 text-center text-xs uppercase font-black outline-none"><button onclick="saveB()" class="orange-btn w-full py-3 rounded-xl font-black text-[10px]">${lang.modal.save || def.modal.save}</button>`;
            } else if (step === 4) {
                t.innerText = lang.steps[3] || def.steps[3];
                const roles = lang.modal.roles || def.modal.roles;
                roles.forEach(r => c.appendChild(createBtn(r, () => finish(4, r))));
            } else if (step === 5) {
                t.innerText = lang.steps[4] || def.steps[4];
                c.appendChild(createBtn(lang.modal.demo || def.modal.demo, () => finish(5, "ACTIVE")));
            } else if (step === 1 || step === 2) {
                // Simplified Market/Industry logic for testing
                t.innerText = lang.steps[step-1] || def.steps[step-1];
                c.appendChild(createBtn("Demo Option", () => finish(step, "Done")));
            }
        }

        function createBtn(txt, fn) { const b = document.createElement('button'); b.className = "modal-btn"; b.innerText = txt; b.onclick = fn; return b; }
        function handleStep(s) { if(s === 1 || completedSteps >= s-1) triggerModal(s); }
        function finish(s, v) { completedSteps = s; document.getElementById(`v${s}`).innerText = v; document.getElementById(`s${s}`).classList.add('active'); closeModal(); if(s<6) document.getElementById(`s${s+1}`).classList.add('next-focus'); }
        function saveB() { const v = document.getElementById('bn').value; if(v) finish(3, v); }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        function toggleLangMenu(force) { const d = document.getElementById('langMenu'); d.style.display = (force !== undefined ? force : d.style.display !== 'flex') ? 'flex' : 'none'; }
        function updateParallax(e) { document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%'); document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%'); }

        // Initialize Language List
        const list = document.getElementById('langList');
        languages.forEach(l => {
            const b = createBtn(l.n, () => setLang(l.f, l.id));
            b.innerHTML = `<img src="https://flagcdn.com/${l.f}.svg" class="w-3"> ${l.n}`;
            list.appendChild(b);
        });
    </script>
</body>
</html>
