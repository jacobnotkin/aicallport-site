<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | Global SMALL BUSINESS Activation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; } 
        html, body { width: 100%; min-height: 100vh; background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        body { padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .bg-glow { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.15) 0%, transparent 50%); pointer-events: none; }
        .console-container { width: 100%; max-width: 1100px; background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 30px; position: relative; z-index: 10; }
        
        .hero-title { background: linear-gradient(180deg, #FFFFFF 30%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; transition: 0.2s; color: white; font-weight: 800; }
        .orange-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .orange-btn:active { transform: scale(0.98); }
        
        .step-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 16px; opacity: 0.3; transition: 0.3s; cursor: pointer; }
        .step-card.active { border-color: #f97316; background: rgba(249, 115, 22, 0.1); opacity: 1; }
        .next-focus { animation: border-glow 2s infinite ease-in-out; opacity: 1; }
        
        @keyframes border-glow { 0%, 100% { border-color: rgba(249, 115, 22, 0.3); } 50% { border-color: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.3); } }
        
        .floating-lang { position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .lang-trigger { background: rgba(10, 12, 18, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 15px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        #langMenu { position: absolute; top: 55px; right: 0; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: none; flex-direction: column; gap: 5px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-btn { width: 100%; padding: 10px; border-radius: 8px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); color: white; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .modal-btn:hover { background: rgba(255,255,255,0.1); border-color: #f97316; }

        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="floating-lang">
        <button onclick="toggleLangMenu()" class="lang-trigger">
            <img id="curFlag" src="https://flagcdn.com/us.svg" class="w-4" alt="Flag">
            <span id="curLangText" class="text-[10px] font-black text-white uppercase">US | EN</span>
        </button>
        <div id="langMenu">
            <div class="max-h-[300px] overflow-y-auto" id="langList"></div>
        </div>
    </div>

    <div class="console-container">
        <div class="flex justify-between items-center mb-16">
            <span class="font-black italic text-2xl text-white uppercase tracking-tighter">AI CALL <span class="text-orange-500">PORT</span></span>
            <div class="flex items-center gap-2 px-3 py-1 bg-orange-500/10 border border-orange-500/20 rounded-full">
                <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[8px] font-black text-orange-500 uppercase tracking-widest">System Active</span>
            </div>
        </div>

        <div class="grid lg:grid-cols-5 gap-12 items-center mb-16">
            <div class="lg:col-span-3 text-center lg:text-left">
                <h1 class="text-4xl lg:text-6xl font-black italic uppercase leading-[0.9] mb-6 hero-title">GLOBAL ZERO-HUMAN<br>AI RECEPTIONIST</h1>
                <p class="text-slate-400 text-sm lg:text-base mb-8 font-bold uppercase tracking-widest">Instant <span class="text-orange-500">Small Business</span> Activation. Worldwide.</p>
                <button onclick="handleStep(1)" class="orange-btn px-10 py-5 rounded-2xl text-xs uppercase italic tracking-widest">Start Activation Protocol</button>
            </div>
            
            <div class="lg:col-span-2">
                <div class="bg-black/40 border border-white/5 p-8 rounded-[32px] text-center">
                    <div class="flex items-baseline justify-center gap-1 mb-6">
                        <span id="curSym" class="text-5xl font-black text-white">$</span>
                        <span id="curPrice" class="text-5xl font-black text-white">199</span>
                        <span class="text-orange-500 font-bold">/mo</span>
                    </div>
                    <button onclick="handleStep(1)" class="orange-btn w-full py-4 rounded-xl text-[10px] uppercase italic">Activate Now</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-6 gap-4">
            <div id="s1" class="step-card next-focus" onclick="handleStep(1)"><p class="text-[8px] font-black text-orange-500 mb-1">01 MARKET</p><p id="v1" class="text-[10px] text-white/40 font-bold uppercase">Select</p></div>
            <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[8px] font-black text-orange-500 mb-1">02 INDUSTRY</p><p id="v2" class="text-[10px] text-white/40 font-bold uppercase">Select</p></div>
            <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[8px] font-black text-orange-500 mb-1">03 BUSINESS</p><p id="v3" class="text-[10px] text-white/40 font-bold uppercase">Sync</p></div>
            <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[8px] font-black text-orange-500 mb-1">04 ROLE</p><p id="v4" class="text-[10px] text-white/40 font-bold uppercase">Choose</p></div>
            <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[8px] font-black text-orange-500 mb-1">05 DEMO</p><p id="v5" class="text-[10px] text-white/40 font-bold uppercase italic">Test</p></div>
            <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[8px] font-black text-orange-500 mb-1">06 DEPLOY</p><p id="v6" class="text-[10px] text-white/40 font-bold uppercase italic">Live</p></div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-8 rounded-3xl max-w-sm w-full text-center">
            <h2 id="mTitle" class="text-xl font-black uppercase text-white mb-6">Setup</h2>
            <div id="mContent" class="space-y-2"></div>
            <button onclick="closeModal()" class="mt-8 text-[10px] text-slate-500 font-black uppercase hover:text-white transition-colors">Close</button>
        </div>
    </div>

    <script>
        let completedSteps = 0;
        const markets = { "United States": ["$", "199"], "United Kingdom": ["£", "155"], "Germany": ["€", "185"], "Japan": ["¥", "30k"] };
        const languages = [
            { id: 'EN', n: 'English', f: 'us' }, { id: 'ES', n: 'Español', f: 'mx' }, { id: 'FR', n: 'Français', f: 'fr' }, { id: 'DE', n: 'Deutsch', f: 'de' },
            { id: 'IT', n: 'Italiano', f: 'it' }, { id: 'PT', n: 'Português', f: 'pt' }, { id: 'RU', n: 'Русский', f: 'ru' }, { id: 'JP', n: '日本語', f: 'jp' }
        ];

        function setLang(id, flag) {
            document.getElementById('curFlag').src = `https://flagcdn.com/${flag}.svg`;
            document.getElementById('curLangText').innerText = `${flag.toUpperCase()} | ${id}`;
            toggleLangMenu(false);
        }

        function handleStep(s) {
            if (s === 1 || completedSteps >= s - 1) {
                const modal = document.getElementById('setupModal'), content = document.getElementById('mContent');
                modal.style.display = 'flex'; content.innerHTML = "";
                if (s === 1) {
                    Object.keys(markets).forEach(m => {
                        const btn = document.createElement('button'); btn.className = "modal-btn"; btn.innerText = m;
                        btn.onclick = () => { 
                            document.getElementById('curSym').innerText = markets[m][0];
                            document.getElementById('curPrice').innerText = markets[m][1];
                            finish(1, m); 
                        };
                        content.appendChild(btn);
                    });
                } else { finish(s, "CONFIRMED"); }
            }
        }

        function finish(s, v) {
            completedSteps = s; document.getElementById(`v${s}`).innerText = v;
            document.getElementById(`s${s}`).classList.add('active');
            document.getElementById(`s${s}`).classList.remove('next-focus');
            if(s < 6) document.getElementById(`s${s+1}`).classList.add('next-focus');
            closeModal();
            if(s === 6) confetti();
        }

        function toggleLangMenu(force) { const m = document.getElementById('langMenu'); m.style.display = (force === false) ? 'none' : (m.style.display === 'flex' ? 'none' : 'flex'); }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        function updateParallax(e) { document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%'); document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%'); }

        const list = document.getElementById('langList');
        languages.forEach(l => {
            const b = document.createElement('button'); b.className = "modal-btn";
            b.innerHTML = `<img src="https://flagcdn.com/${l.f}.svg" class="w-3"> ${l.n}`;
            b.onclick = () => setLang(l.id, l.f);
            list.appendChild(b);
        });
    </script>
</body>
</html>
