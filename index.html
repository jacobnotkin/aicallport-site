<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | Global SMALL BUSINESS Activation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; } 
        html, body { width: 100%; min-height: 100vh; position: relative; background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; overflow-x: hidden; display: flex; flex-direction: column; }
        body { padding: 12px; }
        @media (min-width: 1024px) { body { padding: 24px; } }
        
        .bg-glow { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.15) 0%, transparent 50%); pointer-events: none; }
        .console-container { width: 100%; max-width: 1100px; background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px; position: relative; z-index: 10; margin: 0 auto 40px auto; }
        
        .hero-title { background: linear-gradient(180deg, #FFFFFF 30%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; transition: 0.2s; color: white; }
        .orange-btn:active { transform: scale(0.98); }
        
        .step-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; border-radius: 12px; opacity: 0.3; transition: 0.3s; cursor: pointer; }
        .step-card.active { border-color: #f97316 !important; background: rgba(249, 115, 22, 0.1) !important; opacity: 1 !important; }
        .next-focus { animation: border-glow 2s infinite ease-in-out !important; opacity: 1 !important; }
        
        @keyframes border-glow { 0%, 100% { border-color: rgba(249, 115, 22, 0.3); } 50% { border-color: #f97316; box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); } }
        
        .floating-lang { position: fixed; top: 15px; right: 15px; z-index: 1000; }
        .lang-trigger { background: rgba(10, 12, 18, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; backdrop-filter: blur(5px); }
        #langMenu { position: absolute; top: 50px; right: 0; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; display: none; flex-direction: column; gap: 8px; width: 220px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .search-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; color: white; font-size: 11px; outline: none; width: 100%; margin-bottom: 8px; }
        .modal-scroll { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        
        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 800; text-transform: uppercase; font-size: 9px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="floating-lang">
        <button onclick="toggleLangMenu()" class="lang-trigger">
            <img id="curFlag" src="https://flagcdn.com/us.svg" class="w-4" alt="Flag">
            <span id="curLangText" class="text-[9px] font-black text-white uppercase">US | EN</span>
        </button>
        <div id="langMenu">
            <input type="text" id="langSearch" class="search-box" placeholder="SEARCH..." onkeyup="filterLangs(this.value)">
            <div class="modal-scroll" id="langList"></div>
        </div>
    </div>

    <div class="console-container">
        <div class="flex justify-between items-center mb-12">
            <span class="font-black italic text-xl uppercase text-white">AI CALL <span class="text-orange-500">PORT</span></span>
            <span id="live-label" class="text-[7px] font-black text-orange-500 uppercase tracking-widest px-2 py-1 border border-orange-500/20 rounded-full">Global Live</span>
        </div>

        <div class="grid lg:grid-cols-5 gap-12 items-center">
            <div class="lg:col-span-3">
                <h1 id="hero-h1" class="text-4xl lg:text-6xl font-black italic uppercase leading-tight mb-4 hero-title">GLOBAL ZERO-HUMAN AI RECEPTIONIST</h1>
                <p id="hero-p" class="text-slate-400 text-sm mb-6 font-bold uppercase tracking-wider">Instant <span class="text-orange-500">SMALL BUSINESS</span> Activation.</p>
                <button onclick="handleStep(1)" id="hero-cta" class="orange-btn px-8 py-4 rounded-xl text-[10px] font-black uppercase italic">Start Activation</button>
            </div>
            <div class="lg:col-span-2 bg-black/50 border border-orange-500/30 rounded-3xl p-6 text-center">
                <div class="flex items-baseline justify-center gap-1 mb-4">
                    <span id="main-currency" class="text-4xl font-black text-white">$</span>
                    <span id="main-price" class="text-4xl font-black text-white">199</span>
                    <span class="text-orange-500 font-bold">/mo</span>
                </div>
                <button onclick="handleStep(1)" id="side-cta" class="orange-btn w-full py-3 rounded-xl text-[10px] font-black uppercase italic">Activate Now</button>
            </div>
        </div>

        <div class="mt-20 grid grid-cols-2 lg:grid-cols-6 gap-3">
            <div id="s1" class="step-card next-focus" onclick="handleStep(1)"><p class="text-[7px] font-black text-orange-500 uppercase">01 Market</p><p id="v1" class="text-[9px] text-white/30 font-bold uppercase val-label">Select</p></div>
            <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[7px] font-black text-orange-500 uppercase">02 Industry</p><p id="v2" class="text-[9px] text-white/30 font-bold uppercase val-label">Select</p></div>
            <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[7px] font-black text-orange-500 uppercase">03 Business</p><p id="v3" class="text-[9px] text-white/30 font-bold uppercase val-label">Sync</p></div>
            <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[7px] font-black text-orange-500 uppercase">04 Role</p><p id="v4" class="text-[9px] text-white/30 font-bold uppercase val-label">Choose</p></div>
            <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[7px] font-black text-orange-500 uppercase">05 Demo</p><p id="v5" class="text-[9px] text-white/30 font-bold uppercase val-label">Sandbox</p></div>
            <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[7px] font-black text-orange-500 uppercase">06 Deploy</p><p id="v6" class="text-[9px] text-white/30 font-bold uppercase val-label">Instant</p></div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-6 rounded-3xl max-w-sm w-full text-center">
            <h2 id="mTitle" class="text-lg font-black uppercase text-white mb-6">Setup</h2>
            <div id="mContent" class="modal-scroll"></div>
            <button onclick="closeModal()" class="mt-6 text-[10px] text-slate-500 uppercase font-black">Close</button>
        </div>
    </div>

    <script>
        let completedSteps = 0, currentLang = "EN";
        const marketCurrency = { "United States": ["$", 199], "United Kingdom": ["£", 155], "Germany": ["€", 185], "Japan": ["¥", 30000] };
        
        const languages = [
            { id: 'EN', n: 'English', f: 'us' }, { id: 'ES', n: 'Español', f: 'mx' }, { id: 'FR', n: 'Français', f: 'fr' }, { id: 'DE', n: 'Deutsch', f: 'de' },
            { id: 'IT', n: 'Italiano', f: 'it' }, { id: 'PT', n: 'Português', f: 'pt' }, { id: 'RU', n: 'Русский', f: 'ru' }, { id: 'JP', n: '日本語', f: 'jp' },
            { id: 'KR', n: '한국어', f: 'kr' }, { id: 'CN', n: '中文', f: 'cn' }, { id: 'AR', n: 'العربية', f: 'sa' }, { id: 'IN', n: 'हिन्दी', f: 'in' },
            { id: 'NL', n: 'Nederlands', f: 'nl' }, { id: 'PL', n: 'Polski', f: 'pl' }, { id: 'TR', n: 'Türkçe', f: 'tr' }, { id: 'SE', n: 'Svenska', f: 'se' },
            { id: 'NO', n: 'Norsk', f: 'no' }, { id: 'DK', n: 'Dansk', f: 'dk' }, { id: 'IL', n: 'עברית', f: 'il' }, { id: 'TH', n: 'ไทย', f: 'th' }
        ];

        // Core Translations (Base code only includes major ones to ensure speed/stability)
        const i18n = {
            EN: { h1: "GLOBAL ZERO-HUMAN AI RECEPTIONIST", start: "START ACTIVATION", live: "GLOBAL LIVE" },
            ES: { h1: "RECEPCIONISTA AI GLOBAL SIN HUMANOS", start: "INICIAR ACTIVACIÓN", live: "EN VIVO" },
            FR: { h1: "RÉCEPTIONNISTE IA SANS HUMAINS", start: "LANCER L'ACTIVATION", live: "EN DIRECT" },
            DE: { h1: "GLOBALER KI-EMPFANG OHNE MENSCHEN", start: "AKTIVIERUNG STARTEN", live: "GLOBAL LIVE" }
        };

        function setLang(id, flag) {
            currentLang = id;
            const t = i18n[id] || i18n.EN; // FAILSAFE: Use EN if language is not yet translated
            document.getElementById('curFlag').src = `https://flagcdn.com/${flag}.svg`;
            document.getElementById('curLangText').innerText = `${flag.toUpperCase()} | ${id}`;
            document.getElementById('hero-h1').innerText = t.h1;
            document.getElementById('hero-cta').innerText = t.start;
            document.getElementById('live-label').innerText = t.live;
            toggleLangMenu(false);
        }

        function handleStep(s) {
            if (s === 1 || completedSteps >= s - 1) {
                const modal = document.getElementById('setupModal'), content = document.getElementById('mContent');
                modal.style.display = 'flex'; content.innerHTML = "";
                if (s === 1) {
                    Object.keys(marketCurrency).forEach(m => {
                        const b = document.createElement('button'); b.className = "modal-btn"; b.innerText = m;
                        b.onclick = () => { document.getElementById('main-currency').innerText = marketCurrency[m][0]; document.getElementById('main-price').innerText = marketCurrency[m][1]; finish(1, m); };
                        content.appendChild(b);
                    });
                } else { finish(s, "SYNCED"); }
            }
        }

        function finish(s, v) { 
            completedSteps = s; document.getElementById(`v${s}`).innerText = v; document.getElementById(`s${s}`).classList.add('active'); 
            if(s < 6) document.getElementById(`s${s+1}`).classList.add('next-focus');
            closeModal(); 
        }

        function toggleLangMenu(force) { const m = document.getElementById('langMenu'); m.style.display = (force === false) ? 'none' : (m.style.display === 'flex' ? 'none' : 'flex'); }
        function filterLangs(q) { document.querySelectorAll('#langList .modal-btn').forEach(b => { b.style.display = b.innerText.toLowerCase().includes(q.toLowerCase()) ? 'flex' : 'none'; }); }
        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }
        function updateParallax(e) { document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%'); document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%'); }

        // Load Language List
        const list = document.getElementById('langList');
        languages.forEach(l => {
            const b = document.createElement('button'); b.className = "modal-btn";
            b.innerHTML = `<img src="https://flagcdn.com/${l.f}.svg" class="w-3"> ${l.n}`;
            b.onclick = () => setLang(l.id, l.f);
            list.appendChild(b);
        });
    </script>
</body>
</html>
