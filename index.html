<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Base</title>
    <script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi.browser.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .hidden { display: none; }
        #controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Market Selection</h1>
    <div id="controls">
        <button onclick="setMarket('US')">USA</button>
        <button onclick="setMarket('UK')">UK</button>
        <button onclick="setMarket('ES')">Spain</button>
    </div>

    <hr>

    <div id="demo-section">
        <h2>05 Demo</h2>
        <button id="vapiButton" onclick="runVoice()">START DEMO CALL</button>
        <br><br>
        <a id="stripe-link" href="https://buy.stripe.com/test_default" target="_blank">Get it now</a>
    </div>

    <script>
        const vapi = new Vapi('YOUR_VAPI_PUBLIC_KEY');

        function setMarket(market) {
            const stripeLink = document.getElementById('stripe-link');
            if (market === 'US') {
                stripeLink.href = "https://buy.stripe.com/us_link";
                console.log("Market set to US");
            } else if (market === 'UK') {
                stripeLink.href = "https://buy.stripe.com/uk_link";
                console.log("Market set to UK");
            } else if (market === 'ES') {
                stripeLink.href = "https://buy.stripe.com/es_link";
                console.log("Market set to Spain");
            }
        }

        function runVoice() {
            vapi.start('YOUR_ASSISTANT_ID');
            console.log("Vapi call started");
        }

        vapi.on('call-start', () => {
            document.getElementById('vapiButton').innerText = "CALL IN PROGRESS";
        });

        vapi.on('call-end', () => {
            document.getElementById('vapiButton').innerText = "START DEMO CALL";
        });
    </script>

</body>
</html>
