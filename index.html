<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI CALL PORT | 2026 Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .bg-glow { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 50%, rgba(249, 115, 22, 0.1) 0%, transparent 70%); }
        .console-container { width: 94%; max-width: 1100px; background: rgba(10, 12, 18, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px; margin: 20px auto; }
        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); font-weight: 800; text-transform: uppercase; color: white; transition: 0.2s; border: none; cursor: pointer; }
        .orange-btn:active { transform: scale(0.96); opacity: 0.9; }
        .step-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 12px; opacity: 0.4; pointer-events: none; }
        .step-card.active { opacity: 1; pointer-events: auto; border-color: #f97316; box-shadow: 0 0 15px rgba(249, 115, 22, 0.2); }
        .system-log { position: fixed; bottom: 20px; right: 20px; left: 20px; height: 80px; background: rgba(0,0,0,0.8); border: 1px solid #f97316; border-radius: 12px; padding: 10px; font-family: monospace; font-size: 10px; z-index: 100; overflow: hidden; }
        @media (min-width: 768px) { .system-log { left: auto; width: 300px; height: 120px; } }
        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="system-log" id="logBox">
        <div class="text-orange-500 font-bold mb-1 flex justify-between uppercase"><span>Terminal v5.1</span><span id="pStatus">SECURE</span></div>
        <div id="logContent" class="text-white opacity-80"></div>
    </div>

    <div class="console-container">
        <div class="flex items-center gap-2 mb-8">
            <div class="bg-orange-500 text-black font-black px-2 py-0.5 text-[10px] italic rounded">BETA</div>
            <h2 class="font-black italic uppercase tracking-tighter">AI CALL <span class="text-orange-500">PORT</span></h2>
        </div>

        <div class="text-center md:text-left mb-12">
            <h1 class="text-4xl md:text-6xl font-black italic uppercase leading-none mb-4">Voice <span class="text-orange-500">Automation</span></h1>
            <p class="text-slate-400 text-sm mb-8">Launch your autonomous receptionist in minutes.</p>
            <button id="mainBtn" onclick="handleStep(1)" class="orange-btn px-10 py-4 rounded-xl text-xs tracking-widest">Initialise System</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
            <div id="s1" class="step-card active"><p class="text-[8px] text-orange-500 font-bold">01 MARKET</p><p id="v1" class="text-[10px] font-bold">USA</p></div>
            <div id="s2" class="step-card"><p class="text-[8px] text-orange-500 font-bold">02 INDUSTRY</p><p id="v2" class="text-[10px] font-bold">WAITING</p></div>
            <div id="s3" class="step-card"><p class="text-[8px] text-orange-500 font-bold">03 SYNC</p><p id="v3" class="text-[10px] font-bold">WAITING</p></div>
            <div id="s4" class="step-card"><p class="text-[8px] text-orange-500 font-bold">04 ROLE</p><p id="v4" class="text-[10px] font-bold">WAITING</p></div>
            <div id="s5" class="step-card"><p class="text-[8px] text-orange-500 font-bold">05 DEMO</p><p id="v5" class="text-[10px] font-bold">WAITING</p></div>
            <div id="s6" class="step-card"><p class="text-[8px] text-orange-500 font-bold">06 LAUNCH</p><p id="v6" class="text-[10px] font-bold">WAITING</p></div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#111] border border-white/10 p-8 rounded-3xl max-w-sm w-full text-center">
            <h3 id="mTitle" class="text-xl font-black uppercase text-white mb-6"></h3>
            <div id="mContent" class="space-y-3"></div>
            <button onclick="closeModal()" class="mt-8 text-[10px] text-slate-500 uppercase font-black tracking-widest">Cancel</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let currentStep = 1; let industry = "";

        function addLog(m) {
            const l = document.getElementById('logContent');
            l.innerHTML = `<div>> ${m.toUpperCase()}</div>` + l.innerHTML;
        }

        // 1. MOBILE AUDIO UNLOCKER (The "Warm Up")
        async function unlockAudio() {
            addLog("Unlocking Mobile Audio...");
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') await ctx.resume();
            }
        }

        function handleStep(s) {
            unlockAudio(); // Always try to unlock on every main interaction
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";

            if(s === 1) {
                t.innerText = "Select Market";
                ["USA", "UK"].forEach(opt => createOpt(opt, () => finishStep(1, opt), c));
            } else if(s === 2) {
                t.innerText = "Industry Data";
                Object.keys(assistants).forEach(opt => createOpt(opt, () => { industry = opt; finishStep(2, opt); }, c));
            } else if(s === 3) {
                t.innerText = "Company Name";
                c.innerHTML = `<input id="biz" class="w-full bg-white/5 border border-white/20 p-4 rounded-xl text-white text-center uppercase text-xs mb-4" placeholder="Business Name"><button onclick="finishStep(3, document.getElementById('biz').value)" class="orange-btn w-full py-4 rounded-xl text-[10px]">Verify</button>`;
            } else if(s === 4) {
                t.innerText = "Agent Role";
                ["Receptionist", "Sales Guru"].forEach(opt => createOpt(opt, () => finishStep(4, opt), c));
            } else if(s === 5) {
                t.innerText = "Live Demo";
                addLog("Awaiting User Voice Authorization");
                createOpt("START VOICE CALL", startDemo, c);
            }
        }

        function createOpt(txt, fn, parent) {
            const b = document.createElement('button');
            b.className = "w-full py-4 bg-white/5 hover:bg-white/10 rounded-xl text-white font-bold text-[10px] uppercase";
            b.innerText = txt; b.onclick = fn; parent.appendChild(b);
        }

        function finishStep(s, val) {
            if(!val) return;
            document.getElementById(`v${s}`).innerText = val;
            document.getElementById(`s${s}`).classList.add('active');
            currentStep = s + 1;
            if(document.getElementById(`s${currentStep}`)) document.getElementById(`s${currentStep}`).classList.add('active');
            document.getElementById('mainBtn').innerText = `Continue to Step 0${currentStep}`;
            closeModal();
            addLog(`Step ${s} Verified: ${val}`);
        }

        async function startDemo() {
            addLog("Checking Permissions...");
            try {
                // EXPLICIT PERMISSION REQUEST
                await navigator.mediaDevices.getUserMedia({ audio: true });
                addLog("Mic Granted. Patching Vapi...");
                
                if (window.vapiSDK) {
                    window.vapiSDK.run({
                        apiKey: vapiApiKey,
                        assistant: assistants[industry]
                    });
                    finishStep(5, "TESTING");
                } else {
                    addLog("Error: SDK Not Ready");
                    alert("SDK loading... try again in 1 second.");
                }
            } catch (e) {
                addLog("Mic Blocked. Check HTTPS.");
                alert("Microphone access is required. Please ensure you are using HTTPS.");
            }
        }

        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }

        // Load Vapi
        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");

        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
            document.getElementById('pStatus').innerText = "UNSAFE";
            document.getElementById('pStatus').className = "text-red-500 animate-pulse";
            addLog("CRITICAL: HTTPS REQUIRED FOR MOBILE MIC");
        }
    </script>
</body>
</html>
