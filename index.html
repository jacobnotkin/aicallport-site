<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>AI CALL PORT | Global SMB Activation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; } 
        html, body { 
            width: 100%; position: relative;
            background: #06080f; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 0; min-height: 100vh;
        }
        body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 12px; }
        @media (min-width: 1024px) { body { justify-content: center; } }

        .bg-glow {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(249, 115, 22, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        .console-container {
            width: 100%; max-width: 1100px; 
            background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px;
            position: relative; z-index: 10; margin-bottom: 80px; 
        }

        .hero-title { background: linear-gradient(180deg, #FFFFFF 30%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .orange-btn { background: linear-gradient(90deg, #f97316, #ea580c); border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; }

        .step-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 10px; border-radius: 12px; opacity: 0.3; transition: 0.3s; cursor: pointer;
        }
        .next-focus { animation: border-glow 2s infinite ease-in-out !important; opacity: 1 !important; }
        @keyframes border-glow {
            0%, 100% { border-color: rgba(249, 115, 22, 0.3); }
            50% { border-color: #f97316; box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
        }
        .step-card.active { border-color: #f97316 !important; background: rgba(249, 115, 22, 0.1) !important; opacity: 1 !important; }

        #setupModal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-scroll { max-height: 60vh; overflow-y: auto; padding-right: 8px; }
        .modal-scroll::-webkit-scrollbar { width: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #f97316; border-radius: 10px; }

        .modal-btn { 
            width: 100%; padding: 12px; border-radius: 12px; font-weight: 800; text-transform: uppercase; font-size: 10px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px;
        }
        .modal-btn:hover { background: rgba(249, 115, 22, 0.1); border-color: #f97316; }

        .dot-blink { width: 6px; height: 6px; background-color: #22c55e; border-radius: 50%; animation: pulse-green 2s infinite; }
        @keyframes pulse-green { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); } }
    </style>
</head>
<body onmousemove="updateParallax(event)">
    <div class="bg-glow"></div>

    <div class="console-container">
        <div class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-2">
                <span class="font-black italic text-xl uppercase">AI CALL <span class="text-orange-500">PORT</span></span>
                <div class="px-1.5 py-0.5 bg-orange-500 rounded-sm text-[8px] font-black text-black">BETA</div>
            </div>
            <div class="bg-orange-500/10 border border-orange-500/20 px-3 py-1 rounded-full flex items-center gap-2">
                <div class="dot-blink"></div>
                <span class="text-[8px] font-black text-orange-500 uppercase tracking-widest">Global Live Nodes</span>
            </div>
        </div>

        <div class="grid lg:grid-cols-5 gap-12 items-center">
            <div class="lg:col-span-3 text-center lg:text-left">
                <h1 class="text-4xl lg:text-6xl font-black italic uppercase leading-tight mb-4 hero-title">GLOBAL ZERO-HUMAN<br> AI RECEPTIONIST</h1>
                <p class="text-slate-400 text-sm mb-8 font-bold uppercase tracking-wider">Instant SMB Activation. <span class="text-orange-500">Multilingual. No Humans.</span></p>
                <button onclick="handleStep(1)" class="sync-btn orange-btn px-10 py-5 rounded-xl text-[10px] font-black uppercase tracking-widest italic">Start Activation</button>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-black/50 border border-orange-500/30 rounded-3xl p-8 text-center">
                    <h3 class="text-[10px] uppercase mb-2 font-black text-orange-500">BETA PRICING</h3>
                    <div class="flex items-baseline justify-center gap-1 mb-6">
                        <span class="text-5xl font-black text-white">$199</span>
                        <span class="text-orange-500 font-bold">/mo</span>
                    </div>
                    <div id="timer" class="text-xs font-mono text-white/30 mb-6">00:00:00</div>
                    <button onclick="handleStep(1)" class="orange-btn w-full py-4 rounded-xl text-[10px] font-black uppercase italic">Claim Access</button>
                </div>
            </div>
        </div>

        <div class="mt-20">
            <div class="grid grid-cols-2 lg:grid-cols-6 gap-3">
                <div id="s1" class="step-card next-focus" onclick="handleStep(1)"><p class="text-[7px] font-black text-orange-500 uppercase">01 Market</p><p id="v1" class="text-[9px] text-white/30 font-bold uppercase truncate">Select</p></div>
                <div id="s2" class="step-card" onclick="handleStep(2)"><p class="text-[7px] font-black text-orange-500 uppercase">02 Industry</p><p id="v2" class="text-[9px] text-white/30 font-bold uppercase truncate">Select</p></div>
                <div id="s3" class="step-card" onclick="handleStep(3)"><p class="text-[7px] font-black text-orange-500 uppercase">03 Business</p><p id="v3" class="text-[9px] text-white/30 font-bold uppercase truncate">Sync</p></div>
                <div id="s4" class="step-card" onclick="handleStep(4)"><p class="text-[7px] font-black text-orange-500 uppercase">04 Intelligence</p><p id="v4" class="text-[9px] text-white/30 font-bold uppercase truncate">Config</p></div>
                <div id="s5" class="step-card" onclick="handleStep(5)"><p class="text-[7px] font-black text-orange-500 uppercase">05 Sandbox</p><p id="v5" class="text-[9px] text-white/30 font-bold uppercase truncate italic">Voice Test</p></div>
                <div id="s6" class="step-card" onclick="handleStep(6)"><p class="text-[7px] font-black text-orange-500 uppercase">06 Deploy</p><p id="v6" class="text-[9px] text-white/30 font-bold uppercase truncate italic">Instant</p></div>
            </div>
        </div>
    </div>

    <div id="setupModal">
        <div class="bg-[#0f172a] border border-white/10 p-6 rounded-3xl max-w-sm w-full text-center">
            <h2 id="mTitle" class="text-lg font-black uppercase text-white mb-6">Setup</h2>
            <div id="mContent" class="modal-scroll"></div>
            <button onclick="closeModal()" class="mt-6 text-[10px] text-slate-500 uppercase font-black hover:text-white transition-colors">Close</button>
        </div>
    </div>

    <script>
        const vapiApiKey = "d4fcbe60-643b-48c8-9d74-dfb8ff3236f3";
        const assistants = { "Electrical": "7a2fbe45-b54b-4375-aa1f-111be3f1501a", "Plumbing": "e6dec738-840f-4932-85b4-421b2a7bdb0c", "Wellness": "e95dca20-93f2-46f0-b014-3a885586fa65", "Legal": "e4ef966a-b6de-4e4f-b586-3dda4480fd0f" };
        let completedSteps = 0; let currentIndustry = ""; let selectedLang = "EN";

        const activeCountries = ["Canada", "Chile", "France", "Germany", "Mexico", "Spain", "UAE", "UK", "United States"].sort();
        const comingSoonCountries = ["Argentina", "Brazil", "India", "Italy", "Japan", "Norway", "South Korea", "Sweden", "Switzerland"].sort();

        function handleStep(s) { if(s === 1 || completedSteps >= s-1) triggerModal(s); }

        function triggerModal(step) {
            const m = document.getElementById('setupModal');
            const c = document.getElementById('mContent');
            const t = document.getElementById('mTitle');
            m.style.display = 'flex'; c.innerHTML = "";
            
            if(step === 1) {
                t.innerText = "Select Market";
                createHeader("Live Nodes", "text-green-500", c);
                activeCountries.forEach(l => {
                    c.appendChild(createBtn(l, () => showLanguageSelection(l)));
                });
                createHeader("Incoming", "text-orange-500 mt-4", c);
                comingSoonCountries.forEach(l => {
                    c.appendChild(createBtn(l, () => openWaitlist(l, "Market")));
                });
            } else if (step === 2) {
                t.innerText = "Industry";
                Object.keys(assistants).forEach(i => {
                    c.appendChild(createBtn(i, () => { currentIndustry = i; finish(2, i); }));
                });
            } else if (step === 3) {
                t.innerText = "Business Name";
                c.innerHTML = `<input id="bn" placeholder="NAME" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white mb-4 text-center font-black uppercase outline-none focus:border-orange-500"><button id="saveBtn" class="orange-btn w-full py-4 rounded-xl font-black text-[10px]">SAVE</button>`;
                document.getElementById('saveBtn').onclick = () => { const v = document.getElementById('bn').value; if(v) finish(3, v); };
            } else if (step === 4) {
                t.innerText = "Intelligence";
                ["Receptionist", "Booking Agent", "Lead Qualifier"].forEach(r => {
                    c.appendChild(createBtn(r, () => {
                        const isPoly = document.getElementById('polyToggle')?.checked;
                        finish(4, isPoly ? `${r} + Polyglot` : r);
                    }));
                });
                const toggle = document.createElement('div');
                toggle.className = "mt-6 p-4 bg-orange-500/10 border border-orange-500/30 rounded-xl flex items-center justify-between";
                toggle.innerHTML = `<div class="text-left"><p class="text-[9px] font-black text-orange-500">POLYGLOT MODE</p><p class="text-[7px] text-slate-400">AUTO-DETECT LANGUAGES</p></div><input type="checkbox" id="polyToggle" class="w-5 h-5 accent-orange-500">`;
                c.appendChild(toggle);
            } else if (step === 5) {
                t.innerText = "Voice Sandbox";
                const b = createBtn("START LIVE DEMO", runVoice);
                b.className = "orange-btn w-full py-5 rounded-xl font-black text-[10px]";
                c.appendChild(b);
            } else if (step === 6) {
                t.innerText = "Deploy";
                const b = createBtn("ACTIVATE PORT", () => { confetti(); finish(6, "LIVE"); setTimeout(() => window.open("https://buy.stripe.com/8x24gA9TB9Vab160h43ks01"), 1000); });
                b.className = "orange-btn w-full py-5 rounded-xl font-black text-[10px]";
                c.appendChild(b);
            }
        }

        function showLanguageSelection(country) {
            const c = document.getElementById('mContent');
            c.innerHTML = ""; document.getElementById('mTitle').innerText = "Language";
            createHeader(`Tongue for ${country}`, "text-orange-500", c);
            const langs = [{n:"English",c:"EN"}, {n:"Spanish",c:"ES"}, {n:"German",c:"DE"}, {n:"French",c:"FR"}];
            langs.forEach(l => {
                c.appendChild(createBtn(l.n, () => { selectedLang = l.c; finish(1, `${country} (${l.c})`); }));
            });
        }

        function createBtn(txt, fn) {
            const b = document.createElement('button');
            b.className = "modal-btn"; b.innerText = txt; b.onclick = fn;
            return b;
        }

        function createHeader(txt, cls, cont) {
            const h = document.createElement('p');
            h.className = `text-[8px] font-black mb-2 uppercase text-left ${cls}`;
            h.innerText = txt; cont.appendChild(h);
        }

        function openWaitlist(item, type) {
            const c = document.getElementById('mContent');
            c.innerHTML = `<p class="text-[9px] text-slate-400 mb-4 uppercase">Locking in $199 rate for ${item}</p><input id="wE" placeholder="EMAIL" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl text-white mb-4 text-center font-black uppercase outline-none"><button onclick="closeModal()" class="orange-btn w-full py-4 rounded-xl text-[10px] font-black tracking-widest">REQUEST ACCESS</button>`;
        }

        function finish(s, v) {
            completedSteps = s; 
            const el = document.getElementById(`v${s}`);
            const card = document.getElementById(`s${s}`);
            el.innerText = v; el.classList.replace('text-white/30', 'text-white');
            card.classList.add('active'); card.classList.remove('next-focus'); 
            closeModal();
            if(s < 6) {
                const next = s + 1;
                document.getElementById(`s${next}`).classList.add('next-focus');
                document.querySelectorAll('.sync-btn').forEach(btn => btn.innerText = `Proceed to Step 0${next}`);
            }
        }

        function closeModal() { document.getElementById('setupModal').style.display = 'none'; }

        async function runVoice() { 
            const id = assistants[currentIndustry] || assistants["Electrical"];
            try { 
                await navigator.mediaDevices.getUserMedia({ audio: true }); 
                if(window.vapiSDK) { window.vapiSDK.run({ apiKey: vapiApiKey, assistant: id }); closeModal(); finish(5, "ACTIVE"); } 
            } catch(e) { alert("Mic required."); }
        }

        function updateParallax(e) { document.documentElement.style.setProperty('--mx', (e.clientX / window.innerWidth * 100) + '%'); document.documentElement.style.setProperty('--my', (e.clientY / window.innerHeight * 100) + '%'); }
        setInterval(() => {
            const now = new Date(); const h = 23 - now.getHours(); const m = 59 - now.getMinutes(); const s = 59 - now.getSeconds();
            document.getElementById('timer').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }, 1000);
        (function(d,t){var g=d.createElement(t),s=d.getElementsByTagName(t)[0];g.src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";g.defer=true;g.async=true;s.parentNode.insertBefore(g,s);})(document,"script");
    </script>
</body>
</html>
