<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Call Port - Step 1</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
background: radial-gradient(circle at 20% 20%, #1e3a8a, #020617);
color: white;
font-family: -apple-system, BlinkMacSystemFont, sans-serif;
overflow-x: hidden;
}

.section {
opacity: 0;
transform: translateY(20px);
transition: all 0.5s ease;
}

.section.active {
opacity: 1;
transform: translateY(0);
}

.card {
border: 1px solid rgba(255,255,255,0.1);
border-radius: 14px;
padding: 16px;
cursor: pointer;
transition: 0.2s;
}

.card:hover {
border-color: rgba(255,255,255,0.4);
}

.selected {
border-color: #4f46e5;
background: rgba(79,70,229,0.15);
}

input {
background: rgba(255,255,255,0.05);
border: 1px solid rgba(255,255,255,0.2);
border-radius: 12px;
padding: 14px;
width: 100%;
}

button {
background: linear-gradient(135deg, #4f46e5, #3b82f6);
}
</style>
</head>

<body class="min-h-screen flex flex-col items-center">

<div class="w-full max-w-2xl px-6 py-12">

<h1 class="text-4xl font-bold text-center mb-6">
System Configuration
</h1>

<p class="text-center text-gray-300 mb-10">
We will automatically build your AI call system based on your answers
</p>

<!-- COMPANY -->
<div id="step1" class="section active">
<h2 class="text-xl mb-4">Company name</h2>
<input id="company" placeholder="Enter company name" />
</div>

<!-- INDUSTRY -->
<div id="step2" class="section mt-10">
<h2 class="text-xl mb-4">Industry</h2>
<div class="grid grid-cols-2 gap-3">
<div class="card" onclick="select(this,'industry','Plumbing')">Plumbing</div>
<div class="card" onclick="select(this,'industry','HVAC')">HVAC</div>
<div class="card" onclick="select(this,'industry','Clinic')">Clinic</div>
<div class="card" onclick="select(this,'industry','Real Estate')">Real Estate</div>
</div>
</div>

<!-- CALL MODE -->
<div id="step3" class="section mt-10">
<h2 class="text-xl mb-4">Call handling</h2>
<div class="space-y-3">
<div class="card" onclick="select(this,'calls','Leads')">Capture Leads</div>
<div class="card" onclick="select(this,'calls','Booking')">Book Appointments</div>
<div class="card" onclick="select(this,'calls','Both')">Both</div>
</div>
</div>

<!-- HOURS -->
<div id="step4" class="section mt-10">
<h2 class="text-xl mb-4">Business hours</h2>
<div class="grid grid-cols-2 gap-3">
<div class="card" onclick="select(this,'hours','9-5')">9AM - 5PM</div>
<div class="card" onclick="select(this,'hours','Extended')">Extended</div>
<div class="card" onclick="select(this,'hours','24/7')">24/7</div>
</div>
</div>

<!-- TEAM -->
<div id="step5" class="section mt-10">
<h2 class="text-xl mb-4">Team size</h2>
<div class="space-y-3">
<div class="card" onclick="select(this,'team','Solo')">Just me</div>
<div class="card" onclick="select(this,'team','Small')">Small team</div>
<div class="card" onclick="select(this,'team','Large')">Large team</div>
</div>
</div>

<!-- CTA -->
<div class="mt-12 text-center">
<button id="submitBtn" class="px-8 py-4 rounded-xl opacity-40" disabled>
Build My AI System
</button>
</div>

</div>

<script>
let data = {};

const companyInput = document.getElementById('company');
companyInput.addEventListener('input', () => {
if(companyInput.value.length > 2) {
data.company = companyInput.value;
reveal('step2');
}
});

function select(el, key, value) {
el.parentNode.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
el.classList.add('selected');
data[key] = value;

if(key === 'industry') reveal('step3');
if(key === 'calls') reveal('step4');
if(key === 'hours') reveal('step5');

checkComplete();
}

function reveal(id) {
const el = document.getElementById(id);
el.classList.add('active');
el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function checkComplete() {
if(data.company && data.industry && data.calls && data.hours && data.team) {
document.getElementById('submitBtn').disabled = false;
document.getElementById('submitBtn').classList.remove('opacity-40');
}
}

</script>

</body>
</html>
