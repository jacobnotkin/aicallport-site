<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Call Port - Activation</title>

<style>
:root{
--bg:#060504;
--panel:#12100e;
--border:rgba(255,255,255,0.12);
--text:#f5f5f5;
--muted:rgba(255,255,255,0.5);
--orange:#ff7a1a;
}

body{
margin:0;
font-family:Inter, sans-serif;
background:var(--bg);
color:var(--text);
}

.container{
max-width:1100px;
margin:80px auto;
padding:20px;
}

h1{
font-size:48px;
margin-bottom:10px;
}

.subtitle{
color:var(--muted);
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.step{
background:var(--panel);
border:1px solid var(--border);
border-radius:20px;
padding:24px;
cursor:not-allowed;
opacity:0.3;
transition:0.2s;
}

.step.active{
cursor:pointer;
opacity:1;
border:1px solid var(--orange);
box-shadow:0 0 12px rgba(255,122,26,0.2);
animation:pulse 1.5s infinite;
}

.step.completed{
opacity:0.9;
}

.step h3{
margin:0;
font-size:14px;
color:var(--orange);
letter-spacing:1px;
}

.step p{
margin-top:10px;
font-size:20px;
}

.cta{
margin-top:40px;
width:100%;
padding:18px;
border:none;
border-radius:20px;
font-size:18px;
background:linear-gradient(180deg,#ff8c3a,#ff6a00);
color:white;
cursor:pointer;
}

@keyframes pulse{
0%,100%{box-shadow:0 0 8px rgba(255,122,26,0.2);}
50%{box-shadow:0 0 16px rgba(255,122,26,0.4);}
}
</style>
</head>

<body>

<div class="container">

<h1>Activation Protocol</h1>
<div class="subtitle">Complete each step to build your AI call system</div>

<div class="grid">

<div class="step active" onclick="openStep(1)">
<h3>STEP 01</h3>
<p>Country</p>
</div>

<div class="step" id="step2">
<h3>STEP 02</h3>
<p>Industry</p>
</div>

<div class="step" id="step3">
<h3>STEP 03</h3>
<p>Business Name</p>
</div>

<div class="step" id="step4">
<h3>STEP 04</h3>
<p>Call Handling</p>
</div>

<div class="step" id="step5">
<h3>STEP 05</h3>
<p>Business Hours</p>
</div>

<div class="step" id="step6">
<h3>STEP 06</h3>
<p>Team Setup</p>
</div>

</div>

<button class="cta">Start Activation</button>

</div>

<script>
function openStep(n){
const current = document.querySelector('.step.active');
current.classList.remove('active');
current.classList.add('completed');

const next = document.getElementById('step'+(n+1));
if(next){
next.classList.add('active');
next.style.opacity = 1;
}
}
</script>

</body>
</html>
