<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI CALL PORT | Dashboard</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9E%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet" />

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#06080f;
      color:#e2e8f0;
      font-family:'Plus Jakarta Sans',sans-serif;
      min-height:100vh;
    }

    .app-shell{
      max-width:1200px;
      margin:20px auto;
      padding:14px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(10,12,18,.85);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter:blur(10px);
    }
    .topbar-left{display:flex;align-items:center;gap:10px}
    .brand{font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:12px}
    .badge{
      font-weight:900;
      font-size:9px;
      letter-spacing:.14em;
      text-transform:uppercase;
      padding:4px 8px;
      border-radius:999px;
      background:rgba(249,115,22,.14);
      border:1px solid rgba(249,115,22,.35);
      color:#fff;
    }
    .topbar-right{display:flex;gap:8px;flex-wrap:wrap}
    .topbar-btn{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.04);
      color:#fff;
      font-weight:900;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      cursor:pointer;
    }
    .topbar-btn.active{
      border-color:rgba(249,115,22,.45);
      background:rgba(249,115,22,.12);
    }

    .app-body{
      display:grid;
      grid-template-columns:260px 1fr;
      gap:14px;
      margin-top:14px;
    }
    @media (max-width: 980px){
      .app-body{grid-template-columns:1fr}
      .sidebar{position:relative}
    }

    .sidebar{
      background:rgba(10,12,18,.85);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      padding:14px;
      backdrop-filter:blur(10px);
    }
    .sidebar-title{
      font-weight:900;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(148,163,184,.9);
      margin-bottom:10px;
    }
    .side-link{
      width:100%;
      text-align:left;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.03);
      color:#fff;
      font-weight:900;
      font-size:10px;
      letter-spacing:.16em;
      text-transform:uppercase;
      cursor:pointer;
      margin-bottom:8px;
    }
    .side-link.active{
      border-color:rgba(249,115,22,.45);
      background:rgba(249,115,22,.12);
    }

    .sidebar-footer{
      margin-top:12px;
      padding-top:12px;
      border-top:1px solid rgba(255,255,255,.06);
    }
    .small-muted{
      font-weight:900;
      font-size:10px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:rgba(148,163,184,.75);
      margin-bottom:8px;
    }
    .status-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      border:1px solid rgba(249,115,22,.25);
      background:rgba(249,115,22,.08);
      color:#fff;
      font-weight:900;
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.18em;
    }

    .app-main{
      background:rgba(10,12,18,.85);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      padding:16px;
      backdrop-filter:blur(10px);
      min-height:520px;
    }

    .page{display:none}
    .page.active{display:block}
    .page-title{
      font-weight:900;
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#fff;
      margin-bottom:12px;
    }
    .page-card{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      padding:14px;
      color:rgba(226,232,240,.9);
      font-weight:600;
      font-size:13px;
      line-height:1.5;
    }
    a.back-home{
      color:rgba(249,115,22,.95);
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:10px;
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">AI CALL PORT</div>
        <div class="badge">BETA</div>
      </div>

      <div class="topbar-right">
        <button class="topbar-btn" data-page="pageSetup">Setup</button>
        <button class="topbar-btn" data-page="pageActivity">Activity</button>
        <button class="topbar-btn" data-page="pageBilling">Billing</button>
        <a class="topbar-btn" href="/">Home</a>
      </div>
    </div>

    <div class="app-body">
      <div class="sidebar">
        <div class="sidebar-title">Navigation</div>

        <button class="side-link" data-page="pageDashboard">Overview</button>
        <button class="side-link" data-page="pageSetup">Setup</button>
        <button class="side-link" data-page="pageActivity">Call Logs</button>
        <button class="side-link" data-page="pageBilling">Plan & Billing</button>

        <div class="sidebar-footer">
          <div class="small-muted">Status</div>
          <div class="status-pill">GLOBAL LIVE</div>
        </div>
      </div>

      <div class="app-main">
        <div id="pageDashboard" class="page active">
  <div class="page-title">Overview</div>

  <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;">

    <div class="page-card">
      <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#94a3b8;margin-bottom:8px;">
        Active Calls
      </div>
      <div style="font-size:32px;font-weight:900;color:white;">
        12
      </div>
    </div>

    <div class="page-card">
      <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#94a3b8;margin-bottom:8px;">
        Calls Today
      </div>
      <div style="font-size:32px;font-weight:900;color:white;">
        84
      </div>
    </div>

    <div class="page-card">
      <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#94a3b8;margin-bottom:8px;">
        Conversion Rate
      </div>
      <div style="font-size:32px;font-weight:900;color:white;">
        27%
      </div>
    </div>

    <div class="page-card">
      <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#94a3b8;margin-bottom:8px;">
        Plan
      </div>
      <div style="font-size:20px;font-weight:900;color:white;">
        Beta Small Business
      </div>
    </div>

  </div>

  <div style="margin-top:20px;" class="page-card">
    <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#94a3b8;margin-bottom:12px;">
      Recent Calls
    </div>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;justify-content:space-between;">
        <span>Inbound — Dental Clinic</span>
        <span style="color:#22c55e;">Booked</span>
      </div>

      <div style="display:flex;justify-content:space-between;">
        <span>Inbound — HVAC Repair</span>
        <span style="color:#f97316;">Follow-up</span>
      </div>

      <div style="display:flex;justify-content:space-between;">
        <span>Inbound — Restaurant</span>
        <span style="color:#94a3b8;">Missed</span>
      </div>
    </div>
  </div>
</div>

  <script>
    function showPage(pageId){
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      const page = document.getElementById(pageId);
      if(page) page.classList.add("active");

      document.querySelectorAll(".side-link").forEach(b => b.classList.toggle("active", b.dataset.page === pageId));
      document.querySelectorAll(".topbar-btn").forEach(b => {
        if(!b.dataset.page) return;
        b.classList.toggle("active", b.dataset.page === pageId);
      });
    }

    document.querySelectorAll("[data-page]").forEach(btn => {
      btn.addEventListener("click", () => showPage(btn.dataset.page));
    });

    // Default
    showPage("pageDashboard");
  </script>
</body>
</html>
