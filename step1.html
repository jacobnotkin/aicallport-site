  <script>
    const form = document.getElementById("setupForm");
    const errorEl = document.getElementById("formError");

    function collectCheckedValues(containerId) {
      return Array.from(document.querySelectorAll(`#${containerId} input:checked`))
        .map(input => input.value);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const companyName = document.getElementById("companyName").value.trim();
      const ownerName = document.getElementById("ownerName").value.trim();
      const businessEmail = document.getElementById("businessEmail").value.trim();
      const businessPhone = document.getElementById("businessPhone").value.trim();
      const website = document.getElementById("website").value.trim();
      const [country, continent, countryStatus] = document.getElementById("country").value.split("|");
      const [industry, industryCategory] = document.getElementById("industry").value.split("|");
      const businessModel = document.getElementById("businessModel").value;
      const teamSize = document.getElementById("teamSize").value;
      const schedulingMode = document.getElementById("schedulingMode").value;
      const callerGoals = document.getElementById("callerGoals").value.trim();
      const channels = collectCheckedValues("channelsGrid");
      const languages = collectCheckedValues("languagesGrid");
      const workflowNeeds = collectCheckedValues("workflowGrid");

      const isValid = companyName && channels.length && languages.length && workflowNeeds.length;
      if (!isValid) {
        errorEl.style.display = "block";
        return;
      }

      errorEl.style.display = "none";

      const params = new URLSearchParams();
      params.set("companyName", companyName);
      params.set("ownerName", ownerName);
      params.set("businessEmail", businessEmail);
      params.set("businessPhone", businessPhone);
      params.set("website", website);
      params.set("country", country);
      params.set("continent", continent);
      params.set("countryStatus", countryStatus);
      params.set("industry", industry);
      params.set("industryCategory", industryCategory);
      params.set("businessModel", businessModel);
      params.set("teamSize", teamSize);
      params.set("schedulingMode", schedulingMode);
      params.set("callerGoals", callerGoals);
      params.set("channels", channels.join(", "));
      params.set("languages", languages.join(", "));
      params.set("workflowNeeds", workflowNeeds.join(", "));

      window.location.href = `config-progress.html?${params.toString()}`;
    });
  </script>
